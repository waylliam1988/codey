      $('model-dot').classList.toggle('offline', item.dataset.online !== '1');
      $('effort-wrap').hidden = item.dataset.effort !== '1';
      $('model-menu').classList.remove('open');
    };
  });
  $('effort-menu').querySelectorAll('.pop-item').forEach((item) => {
    item.onclick = () => {
      $('effort-menu').querySelectorAll('.pop-item').forEach((x) => x.classList.remove('selected'));
      item.classList.add('selected');
      state.effort = item.dataset.effort;
      $('effort-label').textContent = state.effort;
      $('effort-menu').classList.remove('open');
    };
  });

  /* Inline Title Rename */
  $('crumb-title').onclick = () => {
    const inp = $('crumb-input');
    inp.value = $('crumb-title').textContent;
    $('crumb-title').hidden = true;
    inp.hidden = false;
    inp.focus(); inp.select();
  };
  function commitTitle(save) {
    const inp = $('crumb-input');
    if (inp.hidden) return;
    const v = inp.value.trim();
    if (save && v) $('crumb-title').textContent = v;
    inp.hidden = true;
    $('crumb-title').hidden = false;
  }
  $('crumb-input').onblur = () => commitTitle(true);
  $('crumb-input').onkeydown = (e) => {
    if (e.key === 'Enter') commitTitle(true);
    if (e.key === 'Escape') commitTitle(false);
  };

  /* Sidebar Search */
  $('btn-search-toggle').onclick = () => {
    $('btn-search-toggle').hidden = true;
    $('search-box').hidden = false;
    $('search-input').focus();
  };
  $('search-input').oninput = (e) => {
    state.searchQuery = e.target.value;
    $('search-clear').hidden = !state.searchQuery;
    renderSidebar();
  };
  $('search-clear').onclick = () => {
    state.searchQuery = '';
    $('search-input').value = '';
    $('search-clear').hidden = true;
    $('search-input').focus();
    renderSidebar();
  };
  $('search-input').onblur = () => {
    if (!state.searchQuery) {
      $('search-box').hidden = true;
      $('btn-search-toggle').hidden = false;
    }
  };

  /* Sidebar & Workspace Controls */
  $('btn-collapse-sidebar').onclick = () => {
    $('app-shell').classList.add('sidebar-collapsed');
    $('btn-expand-sidebar').hidden = false;
  };
  $('btn-expand-sidebar').onclick = () => {
    $('app-shell').classList.remove('sidebar-collapsed');
    $('btn-expand-sidebar').hidden = true;
  };
  $('btn-new-chat').onclick = () => { state.folder = ''; switchScene('empty'); };
  $('btn-add-project').onclick = () => showToast('Native folder picker opens here');
  $('ctx-folder').onclick = () => {
    state.folder = state.folder ? '' : 'codey';
    syncContextRow();
    showToast(state.folder ? 'Workspace set to D:\\codey' : 'Switched to projectless chat');
  };
  $('ctx-research').onclick = () => {
    state.researchActive = !state.researchActive;
    syncContextRow();
    showToast(state.researchActive ? 'Research enabled for next message' : 'Research turned off');
  };

  document.querySelectorAll('.demo-tab').forEach((t) => {
    t.onclick = () => switchScene(t.dataset.scene);
  });
  $('btn-hide-demo').onclick = () => document.body.classList.add('demo-hidden');
  $('btn-show-demo').onclick = () => document.body.classList.remove('demo-hidden');

  document.querySelectorAll('.ws-quick-btn').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.openWs;
      if (state.wsOpen && state.wsActive === id) {
        setWorkspaceOpen(false);
      } else {
        ensureTab(id);
        state.wsActive = id;
        setWorkspaceOpen(true);
        renderWorkspace();
      }
    };
  });
  $('btn-toggle-ws').onclick = () => {
    if (state.wsOpen) setWorkspaceOpen(false);
    else {
      if (!state.wsTabs.length) state.wsTabs = ['files'];
      setWorkspaceOpen(true);
      renderWorkspace();
    }
  };
  $('btn-ws-close').onclick = () => setWorkspaceOpen(false);
  $('btn-ws-full').onclick = () => {
    state.wsFull = !state.wsFull;
    $('app-shell').classList.toggle('workspace-full', state.wsFull);
  };
  $('btn-ws-plus').onclick = (e) => {
    e.stopPropagation();
    $('ws-plus-menu').classList.toggle('open');
  };
  $('ws-plus-menu').querySelectorAll('[data-add-tab]').forEach((b) => {
    b.onclick = () => {
      ensureTab(b.dataset.addTab);
      state.wsActive = b.dataset.addTab;
      $('ws-plus-menu').classList.remove('open');
      setWorkspaceOpen(true);
      renderWorkspace();
    };
  });

  /* Drag Resizers for Left Sidebar & Right Workspace */
  function wireResizer(handle, cssVar, min, max, isRight) {
    let dragging = false;
    handle.onpointerdown = (e) => {
      dragging = true;
      handle.classList.add('dragging');
      $('app-shell').classList.add('is-resizing');
      handle.setPointerCapture(e.pointerId);
    };
    handle.onpointermove = (e) => {
      if (!dragging) return;
      const val = isRight ? window.innerWidth - e.clientX : e.clientX;
      const clamped = Math.max(min, Math.min(max, val));
      document.documentElement.style.setProperty(cssVar, clamped + 'px');
    };
    handle.onpointerup = () => {
      dragging = false;
      handle.classList.remove('dragging');
      $('app-shell').classList.remove('is-resizing');
    };
  }
  wireResizer($('sidebar-resize'), '--sidebar-w', 210, 380, false);
  wireResizer($('ws-resize'), '--workspace-w', 340, 760, true);

  /* Right-Click Selection Menu (Copy + Quote in Reply) */
  document.addEventListener('contextmenu', (e) => {
    const sel = window.getSelection()?.toString().trim();
    if (!sel) return;
    const inAsst = !!e.target.closest('[data-asst-selectable]');
    e.preventDefault();
    state.selectedQuoteText = sel;
    $('sel-quote').hidden = !inAsst;
    const m = $('sel-menu');
    m.style.left = Math.min(window.innerWidth - 160, e.clientX) + 'px';
    m.style.top = Math.min(window.innerHeight - 90, e.clientY) + 'px';
    m.classList.add('open');
  });
  $('sel-copy').onclick = () => {
    navigator.clipboard?.writeText(state.selectedQuoteText).catch(() => {});
    $('sel-menu').classList.remove('open');
    showToast('Copied selection');
  };
  $('sel-quote').onclick = () => {
    const quoted = state.selectedQuoteText.split('\n').map((l) => `> ${l}`).join('\n') + '\n\n';
    input.value = (input.value ? input.value + '\n' : '') + quoted;
    input.dispatchEvent(new Event('input'));
    input.focus();
    $('sel-menu').classList.remove('open');
  };

  /* Global Dismiss & Keyboard Shortcuts */
  document.addEventListener('click', () => {
    $('model-menu').classList.remove('open');
    $('effort-menu').classList.remove('open');
    $('ws-plus-menu').classList.remove('open');
    $('sel-menu').classList.remove('open');
    const sm = $('approval-split-menu');
    if (sm) sm.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); switchScene('empty'); }
    if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); }
    if (e.key === 'Escape') {
      ['modal-settings','modal-fork','modal-palette'].forEach(closeModal);
      $('sel-menu').classList.remove('open');
    }
  });
  window.addEventListener('resize', () => { if (pondActive) resizePond(); });

  /* Boot */
  switchScene('coding');
})();
</script>
</body>
</html>
