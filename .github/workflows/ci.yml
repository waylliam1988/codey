name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      # A minor-version regression on one Python must not hide the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and production build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Verify published frontend
        run: python -m tools.publish_frontend --check

      - name: Install Python dependencies
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
          python -m playwright install chromium

      - name: Ruff
        run: python -m ruff check .

      - name: Source size inventory
        run: python -m tools.source_size_inventory

      - name: Full-tree mypy
        run: python -m mypy codey

      - name: Full-tree Pyrefly
        if: matrix.python-version == '3.12'
        run: pyrefly check codey

      - name: Required machine contracts (no skips)
        run: python -m tools.machine_contract_gate

      - name: Pytest
        if: matrix.python-version != '3.12'
        run: python -m pytest -q -o faulthandler_timeout=120

      - name: Full-suite statement and branch coverage
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $env:COVERAGE_FILE = "$env:GITHUB_WORKSPACE/.e2e-artifacts/coverage/.coverage"
          python -m coverage run -m pytest -q -o faulthandler_timeout=120
          exit $LASTEXITCODE

      - name: Coverage report and gate
        if: always() && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $env:COVERAGE_FILE = "$env:GITHUB_WORKSPACE/.e2e-artifacts/coverage/.coverage"
          python -m coverage combine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.coverage_gate
          exit $LASTEXITCODE

      - name: Upload coverage evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-py312
          path: .e2e-artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: error

      - name: JavaScript syntax
        run: python -m tools.check_javascript

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and production build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Verify published frontend
        run: python -m tools.publish_frontend --check

      - name: Install Python dependencies
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
          python -m playwright install chromium --with-deps

      - name: Ruff
        run: python -m ruff check .

      - name: Source size inventory
        run: python -m tools.source_size_inventory

      - name: Full-tree mypy
        run: python -m mypy codey

      - name: POSIX file-boundary regressions
        run: python -m pytest -q -o faulthandler_timeout=120 tests/test_changes.py tests/test_workspace_paths.py tests/test_bounded_capture_and_context.py tests/test_coldstart_hardening.py

      - name: Required machine contracts (no skips)
        run: python -m tools.machine_contract_gate

      - name: JavaScript syntax
        run: python -m tools.check_javascript
