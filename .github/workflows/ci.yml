name: CI

# Local CI (tools/local_ci.py, wired through .githooks/pre-commit) is the
# authoritative gate. GitHub CI exists only for on-demand remote runs.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q

      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem codey/web/assets -Filter *.js | ForEach-Object {
            node --check $_.FullName
          }
