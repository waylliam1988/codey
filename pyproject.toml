[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
dynamic = ["version"]
description = "Local-first coding, research, and controllable memory workspace for web AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45",
    "pywebview>=5.3",
    "PyYAML>=6.0",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
codey = "codey.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codey.__version__" }

[tool.setuptools.packages.find]
include = ["codey*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
codey = [
    "provider_profiles.json",
    "web/index.html",
    "web/assets/*.css",
    "web/assets/*.js",
]
"codey.research" = ["search_profiles.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
