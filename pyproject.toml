[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
dynamic = ["version"]
description = "Local-first coding, research, and controllable memory workspace for web AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45",
    "pywebview>=5.3",
    "PyYAML>=6.0",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
codey = "codey.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codey.__version__" }

[tool.setuptools.packages.find]
include = ["codey*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
codey = [
    "web/index.html",
    "web/assets/*.css",
    "web/assets/*.js",
]
"codey.providers" = ["profiles.json"]
"codey.research" = ["search_profiles.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# W (trailing whitespace/newline) is enforced, and B/UP were enabled once
# their debt hit zero (`ruff check codey tests tools --select B,UP` clean as
# of 2026-09-20). I/SIM stay off until that debt is paid down
# (`ruff check codey tests tools --select I,SIM`: I:425, SIM:321, 746 total,
# 506 fixable as of 2026-09-21); enabling them now would only force unrelated
# fixes into every batch.
select = ["E4", "E7", "E9", "F", "W", "B", "UP"]

[tool.mypy]
# Baseline only, not a CI gate (CI runs ruff + pytest + node --check):
# `python -m mypy codey` reports 493 errors in 106 files as of 2026-09-21.
# New code should add annotations (TaskState-style Protocols over Any);
# ratchet the count down, never up.
python_version = "3.11"
ignore_missing_imports = true
