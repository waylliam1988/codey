[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
dynamic = ["version"]
description = "Local-first coding, research, and controllable memory workspace for web AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45",
    "pywebview>=5.3",
    "PyYAML>=6.0",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
codey = "codey.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codey.__version__" }

[tool.setuptools.packages.find]
include = ["codey*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
codey = [
    "web/index.html",
    "web/assets/*.css",
    "web/assets/*.js",
]
"codey.providers" = ["profiles.json"]
"codey.research" = ["search_profiles.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# W (trailing whitespace/newline) is enforced. B/UP were enabled once their
# debt hit zero (2026-09-20); I/SIM likewise since 2026-09-21, when the last
# of the 746 violations was fixed (I auto-sorted, SIM105 to suppress,
# SIM117 to single with-statements, small rules auto-fixed, SIM102/110
# merged by hand). Keep them on: new violations fail the gate.
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I", "SIM"]

[tool.mypy]
# Baseline only, not a CI gate (CI runs ruff + pytest + node --check):
# `python -m mypy codey` reports 493 errors in 106 files as of 2026-09-21.
# New code should add annotations (TaskState-style Protocols over Any);
# ratchet the count down, never up.
python_version = "3.11"
ignore_missing_imports = true
