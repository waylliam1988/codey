[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
dynamic = ["version"]
description = "Local-first coding, research, and controllable memory workspace for web AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45",
    "pywebview>=5.3",
    "PyYAML>=6.0",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
codey = "codey.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codey.__version__" }

[tool.setuptools.packages.find]
include = ["codey*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
codey = [
    "web/index.html",
    "web/icon.ico",
    "web/assets/*.css",
    "web/assets/*.js",
]
"codey.providers" = ["profiles.json"]
"codey.research" = ["search_profiles.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = ["tests/manual/results"]
faulthandler_timeout = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# W (trailing whitespace/newline) is enforced. B/UP were enabled once their
# debt hit zero (2026-09-20); I/SIM likewise since 2026-09-21, when the last
# of the 746 violations was fixed (I auto-sorted, SIM105 to suppress,
# SIM117 to single with-statements, small rules auto-fixed, SIM102/110
# merged by hand). Keep them on: new violations fail the gate.
# PLR0912 (too many branches, <= 20) + PLR0915 (too many statements, <= 80)
# are the readability gate since 2026-09-26: they punish "hard to follow"
# and "bloated" functions. C901 (McCabe <= 20) is also in the gate (see below).
# Thresholds were tuned 2026-09-26: defaults (12/50) flagged 145 functions
# including clean state machines (e.g. find_safe_cut with 13 branches);
# 20/80 leaves 27 true monsters, all with >= 21 branches.
# C901 (McCabe <= 20) joined the gate 2026-09-26: after the PLR split the
# C901 distribution is 312 (>8) / 43 (>15) / 12 (>18) / 5 (>20); 20 cuts
# only true monsters without re-flagging the just-split helpers (16-17).
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I", "SIM", "PLR0912", "PLR0915", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 80

[tool.ruff.lint.per-file-ignores]
# Tests/tools are scenario scripts, not production readability surface:
# a 180-statement e2e flow is expected, don't gate them on size.
"tests/**" = ["PLR0912", "PLR0915", "C901"]
"tools/**" = ["PLR0912", "PLR0915", "C901"]

[tool.mypy]
# The full tree remains a migration baseline; CI gates the typed boundary
# modules below and expands this list as each dependency surface is typed.
# The frozen 2026-10-03 starting point was 506 errors in 138 files (363
# source files checked). The current local run is clean (0 errors in 363
# source files);
# see the frozen raw output and classification report under
# `tools/mypy-baseline-2026-10-03.txt` and `docs/mypy-baseline-2026-10-03.md`.
# New code should add annotations (TaskState-style Protocols over Any);
# ratchet the count down, never up.
python_version = "3.11"
ignore_missing_imports = true

[tool.codey.typecheck]
gate = "incremental-core"
modules = [
    "codey/operations/task_state.py",
    "codey/operations/context.py",
    "codey/operations/ghost_context.py",
    "codey/operations/prompting.py",
    "codey/app/task_submit.py",
    "codey/app/server.py",
    "codey/app/headless_runner.py",
    "codey/workspace/changes.py",
    "codey/completion/contract.py",
    "codey/runtime/log/entries.py",
    "codey/runtime/core/cancellation.py",
    "codey/operations/task_loop.py",
    "codey/operations/project_writer_phase.py",
    "codey/operations/project_completion_enforcement.py",
    "codey/research/evidence_ledger.py",
    "codey/runs/trace.py",
]
