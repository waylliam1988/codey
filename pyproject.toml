[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
dynamic = ["version"]
description = "Local-first coding, research, and controllable memory workspace for web AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45",
    "pywebview>=5.3",
    "PyYAML>=6.0",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
codey = "codey.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "codey.__version__" }

[tool.setuptools.packages.find]
include = ["codey*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
codey = [
    "web/index.html",
    "web/assets/*.css",
    "web/assets/*.js",
]
"codey.providers" = ["profiles.json"]
"codey.research" = ["search_profiles.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# W (trailing whitespace/newline) is enforced. B/UP/I/SIM stay off until the
# pre-existing debt is paid down (`ruff check codey tests --select B,UP,I,SIM`:
# B:35, UP:223, I:373, SIM:319, 950 total, 678 fixable as of 2026-09-20);
# enabling them now would only force unrelated fixes into every batch.
select = ["E4", "E7", "E9", "F", "W"]
