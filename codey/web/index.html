// ============================ SSE event ingestion ============================
let runningSessionId = null;
let runningRunId = null;
let turnCounter = 0;
let activeChangesProject = '';
let lastChangesData = null;
let reconnectTimer = null;
let reconcilePromise = null;
let bufferedServerEvents = [];

function setStatus(text, kind) {
  const el = $('status');
  el.className = 'status ' + (kind || '');
  el.innerHTML = '';
  if (kind === 'run' || kind === 'warn') {
    const sp = document.createElement('span');
    sp.className = 'spinner';
    el.appendChild(sp);
  } else if (kind === 'err') {
    const d = document.createElement('span');
    d.className = 'status-dot err';
    el.appendChild(d);
  }
  if (text && (kind === 'run' || kind === 'warn' || kind === 'err')) {
    const t = document.createElement('span');
    t.className = 'status-text';
    t.textContent = text;
    el.appendChild(t);
  }
}

function handleServerEvent(data) {
  const runId = (data.run_id || '').toString();
  const sid = data.session_id;
  const mayOutliveRun = ['task_start', 'task_done', 'shell_request', 'shell_result', 'teach_request'];
  if (runId && runningRunId && !mayOutliveRun.includes(data.type) && runId !== runningRunId) return;
  if (data.type === 'status') {
    setStatus(data.status === 'connecting' ? 'Connecting to browser…' : data.status, 'warn');
    return;
  }
  if (data.type === 'providers') {
    applyProviderStatus(data.providers);
    return;
  }
  if (data.type === 'turn') {
    addToSession(sid, { type: 'turn', n: data.turn || 0, runId });
    return;
  }
  if (data.type === 'tool_started') {
    const rawToolId = (data.tool_id || '').toString();
    const toolKey = rawToolId ? `${runId}:${rawToolId}` : '';
    const s = sessions.find(x => x.id === sid);
    if (s && toolKey && s.messages.some(item => item.toolKey === toolKey)) return;
    addToSession(sid, {
      type: 'tool_pending',
      toolKey,
      eventKey: toolKey ? `tool:${toolKey}:start` : '',
      kind: data.kind || '',
      path: data.path || '',
      activity: (data.activity || '').toString().slice(0, 200),
      pending: true,
      runId,
    });
    return;
  }
  if (data.type === 'tool') {
    const rawToolId = (data.tool_id || '').toString();
    const toolKey = rawToolId ? `${runId}:${rawToolId}` : '';
    const toolStatus = (data.status || (data.ok === false ? 'error' : 'ok')).toString();
    const message = {
      type: 'tool',
      toolKey,
      eventKey: toolKey ? `tool:${toolKey}:final` : '',
      kind: data.kind || '',
      path: data.path || '',
      result: (data.result || '').toString().slice(0, 200),
      status: toolStatus,
      error: toolStatus === 'error',
      runId,
    };
    if (
      toolKey &&
      replaceSessionMessage(
        sid,
        item => item.type === 'tool_pending' && item.toolKey === toolKey,
        message,
      )
    ) return;
    addToSession(sid, message);
    return;
  }
  if (data.type === 'info') {
    if (data.text) addToSession(sid, { type: 'info', text: data.text, runId });
    return;
  }
  if (data.type === 'teach_request') {
    removeTeachMessage(sid);
    addToSession(sid, {
      type: 'teach', id: data.id, text: data.text, sessionId: sid, runId,
      eventKey: `teach:${data.id}`,
    });
    return;
  }
  if (data.type === 'task_start') {
    runningRunId = runId;
    runningSessionId = sid;
    turnCounter = 0;
    setStatus('Running', 'run');
    $('send').disabled = true;
    $('provider-button').disabled = true;
    updateSend();
    updateComposerContext();
    return;
  }
  if (data.type === 'task_done') {
    const current = !runId || runId === runningRunId;
    if (current) {
      runningRunId = null;
      runningSessionId = null;
      setStatus('', 'ok');
      $('provider-button').disabled = false;
      updateSend();
      updateComposerContext();
    }
    if (!markTerminalRun(sid, runId)) return;
    const summary = (data.summary || '').toString();
    const reason = (data.stop_reason || 'done').toString();
    const terminalKey = runId ? `terminal:${runId}` : '';
    const answerKey = terminalKey ? `${terminalKey}:answer` : '';
    const receiptKey = terminalKey ? `${terminalKey}:receipt` : '';
    const project = sessionProjectPath(sid);
    let shownReceipt = false;
    const researchRun = data.research ? recordResearchRun(sid, runId, data.research, data.receipt) : null;
    if (reason === 'error' && data.provider_failure && data.provider_failure.action === 'connect') {
      if (data.provider && PROVIDERS.includes(data.provider)) {
        providerStatus[data.provider] = false;
        syncProviderUI(currentProviderId());
      }
      addSendError(sid, terminalKey, runId);
      flushUiState();
      return;
    }
    if (summary.startsWith('ERROR:')) {
      addToSession(sid, { type: 'err', text: summary.replace(/^ERROR:\s*/i, ''), sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'max_turns') {
      const turns = data.turns || data.max_turns || 0;
      const label = turns ? `Reached turn limit (${turns})` : 'Reached turn limit';
      addToSession(sid, { type: 'limit', text: label, sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'no_progress') {
      addToSession(sid, { type: 'pause', text: 'Paused after several turns without new file writes', sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'approval') {
      // shell approval card is emitted separately
    } else if (reason === 'done') {
      if (data.mode === 'research') {
        if (summary) addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
        if (data.receipt && data.receipt.text) {
          addToSession(sid, {
            type: 'research_done',
            text: data.receipt.text,
            runId,
            sessionId: sid,
            eventKey: receiptKey,
          });
          shownReceipt = true;
        }
      } else if (data.mode === 'chat') {
        if (summary) addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
      } else if (project && summary) {
        addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
      }
      const changes = data.changes || {};
      const changed = !!data.changed;
      const changedCount = Number((data.receipt && data.receipt.changed_count) || changes.changed_count || 0);
      if (changed && changedCount > 0 && data.receipt && data.receipt.text) {
        addToSession(sid, {
          type: 'done',
          text: data.receipt.text,
          project: changes.project || project,
          changed: true,
          runId,
          eventKey: receiptKey,
        });
        shownReceipt = true;
      } else if (!project && summary && data.mode !== 'research' && data.mode !== 'chat') {
        addToSession(sid, { type: 'done', text: summary, runId, eventKey: terminalKey });
      }
    } else if (summary) {
      addToSession(sid, { type: 'done', text: summary, runId, eventKey: terminalKey });
    }
    if (reason !== 'error' && reason !== 'approval' && data.changed && !shownReceipt) maybeAddChangesSummary(sid, terminalKey, runId);
    flushUiState();
    return;
  }
  if (data.type === 'shell_request') {
    addToSession(sid, {
      type: 'shell_request',
      id: data.id,
      command: data.command,
      cwd: data.cwd,
      project: data.project,
      riskLabel: data.risk_label,
      riskTitle: data.risk_title,
      riskDetail: data.risk_detail,
      runId,
      eventKey: `shell:${data.id}`,
    });
    return;
  }
  if (data.type === 'shell_result') {
    removeShellRequest(sid, data.id);
    addToSession(sid, {
      type: 'shell_result',
      id: data.id,
      approved: !!data.approved,
      command: data.command,
      cwd: data.cwd,
      output: data.output,
      exitCode: data.exit_code,
      runId,
      eventKey: `shell-result:${data.id}`,
    });
    return;
  }
  if (data.type === 'reply') {
    const answerKey = runId ? `terminal:${runId}:answer` : '';
    if (data.text) addToSession(sid, { type: 'asst', text: data.text, runId, eventKey: answerKey });
    return;
  }
  if (data.type === 'review') {
    if (data.text) addToSession(sid, { type: 'review', text: data.text, runId });
    return;
  }
}

function clearReconnectTimer() {
  if (reconnectTimer === null) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
}

function scheduleReconnectStatus() {
  if (reconnectTimer !== null) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (evtSrc && evtSrc.readyState !== EventSource.OPEN) setStatus('Reconnecting…', 'warn');
  }, 5000);
}

let researchDrawerTab = 'evidence';
let researchGraphDepth = 1;
let researchNoteFocusId = '';

function disposeResearchGraph() {
  if (window.CodeyResearchGraph) window.CodeyResearchGraph.dispose();
}

function normalizeResearchRunArtifact(runId, research, receipt) {
  return {
    runId,
    synthesisId: (research.synthesis_id || '').toString(),
    notesCreated: Array.isArray(research.notes_created) ? research.notes_created.map(String) : [],
    notesUpdated: Array.isArray(research.notes_updated) ? research.notes_updated.map(String) : [],
    sourceUrls: Array.isArray(research.source_urls) ? research.source_urls.map(String) : [],
    sourcesRead: Number(research.sources_read || 0),
    queries: Array.isArray(research.queries) ? research.queries.map(String) : [],
    searchResults: Array.isArray(research.search_results) ? research.search_results : [],
    openedSources: Array.isArray(research.opened_sources) ? research.opened_sources : [],
    coverage: research.coverage && typeof research.coverage === 'object' ? research.coverage : {},
    citationMap: Array.isArray(research.citation_map) ? research.citation_map : [],
    evidenceItems: Array.isArray(research.evidence_items) ? research.evidence_items : [],
    counterpoints: Array.isArray(research.counterpoints) ? research.counterpoints.map(String) : [],
    qualityWarnings: Array.isArray(research.quality_warnings) ? research.quality_warnings.map(String) : [],
    receipt: receipt && receipt.text ? String(receipt.text) : '',
    restoreable: true,
    createdAt: Date.now(),
  };
}

function recordResearchRun(sessionId, runId, research, receipt) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return null;
  const item = normalizeResearchRunArtifact(runId, research || {}, receipt || {});
  researchDrawerTab = 'evidence';
  researchNoteFocusId = '';
  s.researchRuns = Array.isArray(s.researchRuns)
    ? s.researchRuns.filter(run => run.runId !== runId)
    : [];
  s.researchRuns.push(item);
  s.researchRuns = s.researchRuns.slice(-32);
  invalidateResearchNoteCache(noteIdsForResearchRun(item));
  persistActive();
  return item;
}

function currentResearchRun(sessionId = activeId) {
  const s = sessions.find(x => x.id === sessionId);
  const runs = s && Array.isArray(s.researchRuns) ? s.researchRuns : [];
  return runs.length ? runs[runs.length - 1] : null;
}

function openResearchDrawer(sessionId = activeId) {
  $('research-drawer').classList.add('open');
  $('research-drawer').setAttribute('aria-hidden', 'false');
  renderResearchDrawer(sessionId);
}

function closeResearchDrawer() {
  disposeResearchGraph();
  $('research-drawer').classList.remove('open');
  $('research-drawer').classList.remove('graph-open');
  $('research-drawer').setAttribute('aria-hidden', 'true');
}

function renderResearchDrawer(sessionId = activeId) {
  disposeResearchGraph();
  const run = currentResearchRun(sessionId);
  const body = $('research-body');
  $('research-drawer').classList.toggle('graph-open', !!run && researchDrawerTab === 'graph');
  if (!run) {
    $('research-subtitle').textContent = 'No research yet';
    $('research-restore').disabled = true;
    body.innerHTML = '<div class="changes-empty">No research yet</div>';
    return;
  }
  $('research-subtitle').textContent = `${run.notesCreated.length} notes · ${run.sourcesRead || run.sourceUrls.length} sources`;
  $('research-restore').disabled = !run.runId || !run.restoreable;
  body.innerHTML = '';
  body.appendChild(researchTabsNode());
  const panel = document.createElement('div');
  panel.className = 'research-panel';
  body.appendChild(panel);
  if (researchDrawerTab === 'sources') {
    renderResearchSources(panel, run);
  } else if (researchDrawerTab === 'graph') {
    renderResearchGraph(panel, run, sessionId);
  } else if (researchDrawerTab === 'notes') {
    const coreIds = coreNoteIdsForResearchRun(run);
    if (researchNoteFocusId && !coreIds.includes(researchNoteFocusId)) {
      panel.appendChild(researchSection('Selected note', [researchNoteFocusId]));
    }
    panel.appendChild(researchSection('Synthesis', run.synthesisId ? [run.synthesisId] : []));
    panel.appendChild(researchSection('Notes created', run.notesCreated));
    panel.appendChild(researchSection('Notes updated', run.notesUpdated));
    panel.appendChild(researchSection('Sources', run.sourceUrls));
    loadResearchRunNotes(run, sessionId);
  } else {
    renderResearchEvidence(panel, run);
  }
}

function researchTabsNode() {
  const tabs = document.createElement('div');
  tabs.className = 'research-tabs';
  const items = [
    ['evidence', 'Evidence'],
    ['sources', 'Sources'],
    ['graph', 'Graph'],
    ['notes', 'Notes'],
  ];
  for (const [id, label] of items) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'research-tab' + (researchDrawerTab === id ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      researchDrawerTab = id;
      renderResearchDrawer(activeId);
    };
    tabs.appendChild(btn);
  }
  return tabs;
}

function renderResearchEvidence(panel, run) {
  let rendered = false;
  for (const item of run.evidenceItems) {
    const title = item.claim || item.source_url || 'Evidence';
    const locator = item.locator || (item.page ? `p.${item.page}` : '');
    const meta = [item.stance || 'supports', locator, item.source_url || '', item.note_id ? `note ${item.note_id}` : '']
      .filter(Boolean).join(' · ');
    panel.appendChild(researchCard(title, meta, item.excerpt || ''));
    rendered = true;
  }
  if (run.counterpoints.length) {
    panel.appendChild(researchListCard('Counter-evidence / limitations', run.counterpoints));
    rendered = true;
  }
  if (run.qualityWarnings.length) {
    panel.appendChild(researchListCard('Quality warnings', run.qualityWarnings));
    rendered = true;
  }
  rendered = appendResearchCoverage(panel, run) || rendered;
  if (!rendered) panel.appendChild(researchEmpty('No evidence items recorded'));
}

function renderResearchSources(panel, run) {
  const citations = run.citationMap;
  const opened = run.openedSources;
  if (!citations.length && !opened.length && !run.sourceUrls.length) {
    panel.appendChild(researchEmpty('No sources recorded'));
    return;
  }
  const openedByUrl = new Map(opened.map(item => [String(item.final_url || item.url || ''), item]));
  const citationUrls = new Set(citations.map(item => String(item.url || '')));
  for (const item of citations) {
    const url = String(item.url || '');
    const source = openedByUrl.get(url) || {};
    panel.appendChild(researchSourceCard({
      ...source,
      ...item,
      quality: item.quality || source.quality || {},
      final_url: url || source.final_url || '',
    }));
  }
  for (const source of opened) {
    const url = String(source.final_url || source.url || '');
    if (!url || citationUrls.has(url)) continue;
    panel.appendChild(researchSourceCard({
      ...source,
      title: source.title || url,
      url,
      quality: source.quality || {},
      retrieved_at: source.retrieved_at || '',
    }));
  }
  if (!citations.length && !opened.length) {
    for (const url of run.sourceUrls) panel.appendChild(researchSourceCard({ title: url, url }));
  }
}

function renderResearchGraph(panel, run, sessionId) {
  if (!window.CodeyResearchGraph) {
    panel.appendChild(researchEmpty('Graph unavailable'));
    return;
  }
  window.CodeyResearchGraph.render(panel, {
    run,
    sessionId,
    activeId,
    depth: researchGraphDepth,
    focusIds: coreNoteIdsForResearchRun(run),
    counterpoints: run.counterpoints || [],
    onDepthChange(depth) {
      researchGraphDepth = depth;
      renderResearchDrawer(sessionId);
    },
    onOpenNote(noteId) {
      researchNoteFocusId = noteId;
      researchDrawerTab = 'notes';
      invalidateResearchNoteCache([noteId]);
      renderResearchDrawer(sessionId);
    },
    onOpenSource(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    },
  });
}

function appendResearchCoverage(panel, run) {
  const coverage = run.coverage;
  const queries = Array.isArray(coverage.queries) ? coverage.queries : run.queries;
  const results = run.searchResults;
  const skipped = Array.isArray(coverage.skipped_results) ? coverage.skipped_results : [];
  if (!queries.length && !results.length && !skipped.length) {
    return false;
  }
  if (queries.length) panel.appendChild(researchListCard('Search coverage', queries.map(query => `query: ${query}`)));
  if (results.length) {
    const rows = results.slice(0, 24).map(item => {
      const opened = item.opened ? 'opened' : 'not opened';
      return `${item.query || ''} · #${item.rank || ''} · ${opened} · ${item.title || item.url || ''}`;
    });
    panel.appendChild(researchListCard('Search results', rows));
  }
  if (skipped.length) {
    const rows = skipped.slice(0, 16).map(item => `${item.title || item.url || ''} · ${item.reason || 'skipped'}`);
    panel.appendChild(researchListCard('Skipped results', rows));
  }
  return true;
}

function researchSourceCard(item) {
  const number = item.number ? `[${item.number}] ` : '';
  const url = String(item.url || item.final_url || '');
  const quality = formatSourceQuality(item.quality || {});
  const pdf = formatPdfSourceMeta(item);
  const meta = [quality, pdf, item.retrieved_at || '', url].filter(Boolean).join(' · ');
  const card = researchCard(number + (item.title || url || 'Source'), meta, '');
  if (url) {
    card.style.cursor = 'pointer';
    card.onclick = () => window.open(url, '_blank', 'noopener,noreferrer');
    const actions = document.createElement('div');
    actions.className = 'research-card-meta';
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'drawer-btn research-copy';
    copy.textContent = 'Copy citation';
    copy.onclick = (e) => {
      e.stopPropagation();
      copyText(`${number}${item.title || 'Source'} - ${url}`);
    };
    actions.appendChild(copy);
    card.appendChild(actions);
  }
  return card;
}

function researchCard(title, meta, bodyText) {
  const card = document.createElement('div');
  card.className = 'research-card';
  const head = document.createElement('div');
  head.className = 'research-card-head';
  const titleEl = document.createElement('div');
  titleEl.className = 'research-card-title';
  titleEl.textContent = title || '';
  head.appendChild(titleEl);
  card.appendChild(head);
  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'research-card-meta';
    metaEl.textContent = meta;
    card.appendChild(metaEl);
  }
  if (bodyText) {
    const body = document.createElement('div');
    body.className = 'research-excerpt';
    body.textContent = bodyText;
    card.appendChild(body);
  }
  return card;
}

function researchListCard(title, values) {
  const card = researchCard(title, '', '');
  const list = document.createElement('ul');
  list.className = 'research-list';
  for (const value of values || []) {
    const li = document.createElement('li');
    li.textContent = String(value || '');
    list.appendChild(li);
  }
  card.appendChild(list);
  return card;
}

function researchEmpty(text) {
  const div = document.createElement('div');
  div.className = 'changes-empty';
  div.textContent = text;
  return div;
}

function formatSourceQuality(quality) {
  return [quality.level, quality.kind, quality.freshness, quality.independent_group]
    .filter(Boolean)
    .join(' · ');
}

function formatPdfSourceMeta(item) {
  if (String(item.content_kind || '').toLowerCase() !== 'pdf') return '';
  const pages = compactPages(Array.isArray(item.pages_read) ? item.pages_read : []);
  const pageCount = Number(item.page_count || 0);
  const parts = ['PDF'];
  if (pages) parts.push(pageCount ? `pages ${pages} / ${pageCount}` : `pages ${pages}`);
  if (item.truncated) parts.push('truncated');
  return parts.join(' · ');
}

function compactPages(values) {
  const pages = Array.from(new Set((values || [])
    .map(value => Number(value))
    .filter(value => Number.isInteger(value) && value > 0)))
    .sort((a, b) => a - b);
  if (!pages.length) return '';
  const ranges = [];
  let start = pages[0];
  let prev = pages[0];
  for (const page of pages.slice(1)) {
    if (page === prev + 1) {
      prev = page;
      continue;
    }
    ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
    start = page;
    prev = page;
  }
  ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
  return ranges.join(',');
}

function researchSection(title, values) {
  const wrap = document.createElement('div');
  wrap.className = 'change-file';
  const btn = document.createElement('button');
  btn.type = 'button';
  const status = document.createElement('span');
  status.className = 'change-status';
  status.textContent = values.length || 0;
  const path = document.createElement('span');
  path.className = 'change-path';
  path.textContent = title;
  const add = document.createElement('span');
  add.className = 'change-stat';
  add.textContent = '';
  const del = document.createElement('span');
  del.className = 'change-stat';
  del.textContent = '';
  btn.append(status, path, add, del);
  const pre = document.createElement('pre');
  pre.className = 'diff-pre';
  pre.hidden = false;
  pre.textContent = values.length ? values.map(researchValueText).join('\n\n') : '(none)';
  wrap.append(btn, pre);
  return wrap;
}

function researchValueText(value) {
  const text = String(value || '');
  const note = researchNoteCache[text];
  if (!note) return text;
  if (note.__state === 'loading') return `${text}\nLoading note...`;
  if (note.__state === 'missing') return `${text}\nNote no longer exists`;
  if (note.__state === 'error') return `${text}\nCould not load note`;
  const excerpt = note.body ? '\n' + note.body.slice(0, 420) + (note.body.length > 420 ? '\n...' : '') : '';
  const path = note.path ? `\n${note.path}` : '';
  return `[${note.type}] ${note.title}\n${note.id}${path}${excerpt}`;
}

const researchNoteCache = {};
function coreNoteIdsForResearchRun(run) {
  if (!run) return [];
  const ids = [run.synthesisId, ...(run.notesCreated || []), ...(run.notesUpdated || [])].filter(Boolean);
  return Array.from(new Set(ids));
}
function noteIdsForResearchRun(run) {
  const ids = coreNoteIdsForResearchRun(run);
  if (researchNoteFocusId) ids.push(researchNoteFocusId);
  return Array.from(new Set(ids.filter(Boolean)));
}
function invalidateResearchNoteCache(ids) {
  for (const id of ids || []) delete researchNoteCache[id];
}
async function loadResearchRunNotes(run, sessionId) {
  const ids = noteIdsForResearchRun(run)
    .filter(id => id && !researchNoteCache[id]);
  if (!ids.length) return;
  await Promise.all(ids.map(async (id) => {
    researchNoteCache[id] = { __state: 'loading' };
    try {
      const r = await fetch('/api/research/note?id=' + encodeURIComponent(id));
      if (r.status === 404) {
        researchNoteCache[id] = { __state: 'missing' };
        return;
      }
      if (!r.ok) {
        researchNoteCache[id] = { __state: 'error' };
        return;
      }
      const data = await r.json();
      researchNoteCache[id] = data.ok && data.note ? data.note : { __state: 'missing' };
    } catch {
      researchNoteCache[id] = { __state: 'error' };
    }
  }));
  if (currentResearchRun(sessionId) === run && $('research-drawer').classList.contains('open')) {
    renderResearchDrawer(sessionId);
  }
}

async function restoreResearchRun() {
  const run = currentResearchRun();
  if (!run || !run.runId) return;
  $('research-restore').disabled = true;
  try {
    const r = await fetch('/api/research/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: run.runId }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok || !data.ok) {
      $('research-subtitle').textContent = data.error || 'Restore failed';
      if (run && /not found/i.test(data.error || '')) {
        run.restoreable = false;
        persistActiveNow();
        renderResearchDrawer(activeId);
      }
      return;
    }
    $('research-subtitle').textContent = `${(data.restored || []).length} restored`;
    invalidateResearchNoteCache(noteIdsForResearchRun(run));
    const s = activeSession();
    if (s && Array.isArray(s.researchRuns)) {
      s.researchRuns = s.researchRuns.filter(item => item.runId !== run.runId);
      persistActiveNow();
    }
    addToSession(activeId, {
      type: 'done',
      text: `Research restored: ${(data.restored || []).length} files`,
      eventKey: `research-restore:${run.runId}`,
    });
    renderResearchDrawer(activeId);
  } finally {
    const current = currentResearchRun();
    $('research-restore').disabled = !current || !current.restoreable;
  }
}

function markResearchRestoreAvailability(runIds) {
  const available = new Set(Array.isArray(runIds) ? runIds.map(String) : []);
  let changed = false;
  for (const s of sessions) {
    const runs = Array.isArray(s.researchRuns) ? s.researchRuns : [];
    for (const run of runs) {
      const next = available.has(String(run.runId || ''));
      if (!!run.restoreable !== next) {
        run.restoreable = next;
        changed = true;
      }
    }
  }
  if (changed) persistActive();
  if ($('research-drawer').classList.contains('open')) renderResearchDrawer(activeId);
}

function applyRunState(data) {
  if (data.last_shell_result) handleServerEvent(data.last_shell_result);
  if (data.last_terminal_event) handleServerEvent(data.last_terminal_event);
  if (data.pending_event) handleServerEvent(data.pending_event);

  const busy = !!data.busy && !!data.run_id;
  runningRunId = busy ? data.run_id : null;
  runningSessionId = busy ? data.session_id : null;
  if (busy) {
    const connecting = data.run_status === 'connecting';
    setStatus(connecting ? 'Connecting to browser…' : 'Running', connecting ? 'warn' : 'run');
  } else {
    setStatus('', 'ok');
  }
  $('provider-button').disabled = busy;
  markResearchRestoreAvailability(data.research_restore_runs || []);
  updateSend();
  updateComposerContext();
}

function reconcileRunState() {
  if (reconcilePromise) return reconcilePromise;
  bufferedServerEvents = [];
  reconcilePromise = (async () => {
    try {
      const response = await fetch('/api/state', { cache: 'no-store' });
      if (!response.ok) throw new Error('state unavailable');
      applyRunState(await response.json());
      clearReconnectTimer();
    } catch {
      scheduleReconnectStatus();
    } finally {
      const events = bufferedServerEvents;
      bufferedServerEvents = [];
      reconcilePromise = null;
      for (const event of events) handleServerEvent(event);
    }
  })();
  return reconcilePromise;
}

function ingestServerEvent(data) {
  if (reconcilePromise) {
    bufferedServerEvents.push(data);
    return;
  }
  handleServerEvent(data);
}

async function acceptRunResponse(response, sessionId) {
  const data = await response.json();
  runningRunId = data.run_id || null;
  runningSessionId = runningRunId ? sessionId : null;
  if (runningRunId) {
    setStatus('Running', 'run');
    $('provider-button').disabled = true;
    updateSend();
    updateComposerContext();
  }
  await reconcileRunState();
}

let evtSrc = null;
function connectEvents() {
  if (evtSrc) return;
  evtSrc = new EventSource('/api/events');
  evtSrc.onmessage = (e) => {
    let data; try { data = JSON.parse(e.data); } catch { return; }
    if (data.type === 'hello') {
      clearReconnectTimer();
      reconcileRunState();
      refreshProviderStatus();
      return;
    }
    ingestServerEvent(data);
  };
  evtSrc.onerror = scheduleReconnectStatus;
}

function addToSession(sid, m) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (m.eventKey && s.messages.some(item => item.eventKey === m.eventKey)) return false;
  if ((m.type === 'limit' || m.type === 'pause' || m.type === 'teach' || m.type === 'err') && !m.sessionId) m.sessionId = sid;
  s.messages.push(m);
  persistActive();
  if (sid === activeId) { appendMessageNode($('chat'), m); scrollChat(); }
  return true;
}

function replaceSessionMessage(sid, predicate, message) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (message.eventKey && s.messages.some(item => item.eventKey === message.eventKey)) return false;
  const index = s.messages.findIndex(predicate);
  if (index < 0) return false;
  s.messages[index] = message;
  persistActive();
  if (sid === activeId) { renderChat(); scrollChat(); }
  return true;
}

function markTerminalRun(sid, runId) {
  if (!runId) return true;
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (s.terminalRuns.includes(runId)) return false;
  s.terminalRuns = [...s.terminalRuns, runId].slice(-32);
  persistActive();
  return true;
}

function removeTeachMessage(sessionId, teachId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const before = s.messages.length;
  s.messages = s.messages.filter(m => !(m.type === 'teach' && (!teachId || m.id === teachId)));
  if (s.messages.length !== before) {
    persistActive();
    if (sessionId === activeId) renderChat();
  }
}

function removeShellRequest(sessionId, approvalId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const before = s.messages.length;
  s.messages = s.messages.filter(m => !(m.type === 'shell_request' && m.id === approvalId));
  if (s.messages.length !== before) {
    persistActive();
    if (sessionId === activeId) renderChat();
  }
}

function addSendError(sessionId, eventKey = '', runId = '') {
  addToSession(sessionId, { type: 'err', text: 'Could not send the message', sessionId, eventKey, runId });
}

async function resumeTeaching(teachId, sessionId) {
  if (!teachId) return;
  try {
    const r = await fetch('/api/teach/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: teachId }),
    });
    if (r.ok) removeTeachMessage(sessionId, teachId);
  } catch {}
}

function retryTask(sessionId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const lastUser = [...s.messages].reverse().find(m => m.type === 'user' && m.text);
  if (!lastUser) return;
  syncProviderUI(s.provider || DEFAULT_PROVIDER);
  $('task').value = lastUser.text;
  resizeTask();
  updateSend();
  $('send').click();
}

function sessionProjectPath(sid) {
  const s = sessions.find(x => x.id === sid);
  const p = sessionProject(s);
  return p ? p.path : '';
}

async function fetchChanges(project) {
  const r = await fetch('/api/changes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project }),
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) data.ok = false;
  return data;
}

async function restoreChanges(project) {
  const r = await fetch('/api/changes/restore', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project }),
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) data.ok = false;
  return data;
}

async function maybeAddChangesSummary(sid, eventKey = '', runId = '') {
  const project = sessionProjectPath(sid);
  if (!project) return;
  try {
    const data = await fetchChanges(project);
    if (!data.ok || !data.changed_count) return;
    const files = Array.isArray(data.files) ? data.files.slice(0, 3) : [];
    addToSession(sid, { type: 'changes', count: data.changed_count, files, project, eventKey, runId });
  } catch {}
}

async function openChangesDrawer(project) {
  if (!project) return;
  activeChangesProject = project;
  $('changes-drawer').classList.add('open');
  $('changes-drawer').setAttribute('aria-hidden', 'false');
  await loadChangesDrawer(project);
}

async function loadChangesDrawer(project) {
  $('changes-subtitle').textContent = 'Loading…';
  $('changes-restore').disabled = true;
  $('changes-body').innerHTML = '<div class="changes-empty">Reading changes…</div>';
  try {
    const data = await fetchChanges(project);
    lastChangesData = data;
    renderChangesDrawer(data);
  } catch (err) {
    lastChangesData = null;
    $('changes-subtitle').textContent = 'Failed';
    $('changes-body').innerHTML = `<div class="changes-error">${escapeHtml(String(err))}</div>`;
  }
}

function closeChangesDrawer() {
  $('changes-drawer').classList.remove('open');
  $('changes-drawer').setAttribute('aria-hidden', 'true');
}

function renderChangesDrawer(data) {
  const body = $('changes-body');
  if (!data || !data.ok) {
    $('changes-subtitle').textContent = data && data.error ? data.error : 'No changes';
    body.innerHTML = `<div class="changes-empty">${escapeHtml(data && data.error ? data.error : 'No changes')}</div>`;
    return;
  }
  const files = Array.isArray(data.files) ? data.files : [];
  const mode = data.mode === 'git' ? 'Git' : 'Snapshot';
  $('changes-subtitle').textContent = `${files.length} file${files.length === 1 ? '' : 's'} changed · ${mode}`;
  $('changes-restore').disabled = data.mode === 'git' || !files.length;
  if (!files.length) {
    body.innerHTML = '<div class="changes-empty">No changes</div>';
    return;
  }
  const chunks = parseDiffChunks(data.diff || '');
  body.innerHTML = '';
  for (const file of files) body.appendChild(changeFileNode(file, chunks));
}

function parseDiffChunks(diff) {
  const lines = (diff || '').split('\n');
  const chunks = [];
  let current = null;
  function push() { if (current) chunks.push(current); }
  function start(path) {
    push();
    current = { path: (path || '').replace(/^b\//, ''), lines: [] };
  }
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const next = lines[i + 1] || '';
    if (line.startsWith('diff --git ')) {
      const m = line.match(/\sb\/(.+)$/);
      start(m ? m[1] : '');
    } else if (line.startsWith('--- /dev/null') && next.startsWith('+++ ')
        && (!current || !current.lines.some(l => l.startsWith('diff --git ')))) {
      start(next.replace(/^\+\+\+\s+/, '').replace(/^b\//, ''));
    }
    if (!current && line.trim()) current = { path: '', lines: [] };
    if (current) current.lines.push(line);
  }
  push();
  return chunks;
}

function chunkForPath(chunks, path) {
  const target = (path || '').replace(/\\/g, '/');
  return chunks.find(c => c.path === target || c.path.endsWith('/' + target)) || null;
}

function changeFileNode(file, chunks) {
  const wrap = document.createElement('div');
  wrap.className = 'change-file';
  const btn = document.createElement('button');
  const status = document.createElement('span');
  status.className = 'change-status';
  status.textContent = file.status || 'M';
  const path = document.createElement('span');
  path.className = 'change-path';
  path.title = file.path || '';
  path.textContent = file.path || '';
  const add = document.createElement('span');
  add.className = 'change-stat';
  add.textContent = `+${file.additions || 0}`;
  const del = document.createElement('span');
  del.className = 'change-stat';
  del.textContent = `-${file.deletions || 0}`;
  btn.append(status, path, add, del);
  const pre = document.createElement('pre');
  pre.className = 'diff-pre';
  pre.hidden = true;
  const chunk = chunkForPath(chunks, file.path || '');
  pre.innerHTML = chunk ? renderDiffLines(chunk.lines) : '<span class="diff-line meta">(no text diff available)</span>';
  btn.onclick = () => { pre.hidden = !pre.hidden; };
  wrap.append(btn, pre);
  return wrap;
}

function renderDiffLines(lines) {
  let oldLine = 0;
  let newLine = 0;
  const out = [];
  for (const line of (lines || [])) {
    if (line.startsWith('@@')) {
      const m = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) {
        oldLine = Number(m[1]);
        newLine = Number(m[2]);
      }
      continue;
    }
    if (line.startsWith('diff --git') || line.startsWith('index ') || line.startsWith('---') || line.startsWith('+++')) {
      continue;
    }
    if (line.startsWith('+')) {
      out.push(`<span class="diff-line add"><span class="ln">${newLine || ''}</span><span class="mark">+</span>${escapeHtml(line.slice(1) || ' ')}</span>`);
      newLine += 1;
      continue;
    }
    if (line.startsWith('-')) {
      out.push(`<span class="diff-line del"><span class="ln">${oldLine || ''}</span><span class="mark">-</span>${escapeHtml(line.slice(1) || ' ')}</span>`);
      oldLine += 1;
      continue;
    }
    if (line) {
      oldLine += 1;
      newLine += 1;
    }
  }
  return out.join('');
}

function showCommandApprovalError(errorEl) {
  if (errorEl) {
    errorEl.textContent = 'Could not send approval';
    errorEl.hidden = false;
  }
  setStatus('Could not send approval', 'err');
}

async function approveCommand(id, approved, approveBtn, denyBtn, errorEl) {
  if (!id) return;
  approveBtn.disabled = true;
  denyBtn.disabled = true;
  if (errorEl) {
    errorEl.textContent = '';
    errorEl.hidden = true;
  }
  try {
    const r = await fetch('/api/shell_approval', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, approved }),
    });
    if (!r.ok) {
      showCommandApprovalError(errorEl);
      approveBtn.disabled = false;
      denyBtn.disabled = false;
      return;
    }
    const data = await r.json();
    if (data.event) handleServerEvent(data.event);
  } catch (err) {
    showCommandApprovalError(errorEl);
    approveBtn.disabled = false;
    denyBtn.disabled = false;
  }
}

// ============================ composer ============================
function resizeTask() {
  const t = $('task');
  t.style.height = 'auto';
  t.style.height = Math.min(220, Math.max(40, t.scrollHeight)) + 'px';
}
function updateSend() {
  const has = $('task').value.trim();
  const running = !!runningSessionId;
  $('send').disabled = !has || running;
  $('send').style.display = running ? 'none' : '';
  $('stop').style.display = running ? '' : 'none';
  $('send-hint').textContent = running ? 'Stop' : 'Enter';
}

function toggleResearchForActive() {
  if (runningSessionId) return;
  const s = activeSession();
  if (!s) return;
  s.research = !s.research;
  persistActiveNow();
  updateComposerContext();
  renderChat();
}

async function openLocalProviderConfig() {
  const pop = $('local-config-pop');
  pop.classList.add('open');
  pop.setAttribute('aria-hidden', 'false');
  $('local-config-error').textContent = '';
  $('local-api-key').value = '';
  try {
    const r = await fetch('/api/local_provider');
    if (!r.ok) return;
    const data = await r.json();
    const local = data.local || {};
    if (local.base_url) $('local-base-url').value = local.base_url;
    if (local.model) $('local-model-name').value = local.model;
    const cands = Array.isArray(local.candidates) ? local.candidates : [];
    $('local-config-candidates').innerHTML = cands.length
      ? cands.map(url => `<button type="button" data-url="${escapeHtml(url)}">${escapeHtml(url)}</button>`).join('')
      : '';
    document.querySelectorAll('#local-config-candidates button').forEach((btn) => {
      btn.onclick = () => { $('local-base-url').value = btn.dataset.url || ''; };
    });
  } catch {}
}

function closeLocalProviderConfig() {
  $('local-config-pop').classList.remove('open');
  $('local-config-pop').setAttribute('aria-hidden', 'true');
}

async function saveLocalProviderConfig() {
  const base_url = $('local-base-url').value.trim();
  const model = $('local-model-name').value.trim();
  const api_key = $('local-api-key').value.trim();
  if (!base_url) return;
  $('local-config-error').textContent = '';
  $('local-config-save').disabled = true;
  $('local-config-save').textContent = 'Connecting';
  try {
    const payload = { base_url, model };
    if (api_key) payload.api_key = api_key;
    const r = await fetch('/api/local_provider', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok) {
      $('local-config-error').textContent = data.error || 'could not connect';
      return;
    }
    providerStatus.local = true;
    syncProviderUI(currentProviderId());
    closeLocalProviderConfig();
    refreshProviderStatus();
  } catch {
    $('local-config-error').textContent = 'could not reach the server';
  } finally {
    $('local-config-save').disabled = false;
    $('local-config-save').textContent = 'Connect';
  }
}

$('task').addEventListener('input', () => { resizeTask(); updateSend(); updateComposerContext(); });
$('task').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    if (!$('send').disabled) $('send').click();
  }
});
$('composer-context').onclick = (e) => {
  const target = e.target.closest('.ctx-token');
  if (!target || runningSessionId) return;
  if (target.id === 'ctx-folder') {
    const s = activeSession();
    if (!s || sessionProject(s) || projectPickerBusy) return;
    attachCurrentChatToPickedProject({ sendDraft: !!$('task').value.trim() });
  } else if (target.id === 'ctx-research') {
    toggleResearchForActive();
  } else if (target.id === 'ctx-provider') {
    if (currentProviderId() === 'local') openLocalProviderConfig();
  }
};
$('composer-context').addEventListener('keydown', (e) => {
  if ((e.key !== 'Enter' && e.key !== ' ') || runningSessionId) return;
  const target = e.target.closest('.ctx-token');
  if (!target) return;
  e.preventDefault();
  target.click();
});
function setActiveProvider(id) {
  const provider = PROVIDERS.includes(id) ? id : DEFAULT_PROVIDER;
  const s = activeSession();
  if (!s) return;
  s.provider = provider;
  persistActiveNow();
  syncProviderUI(provider);
  updateComposerContext();
  if (provider === 'local') openLocalProviderConfig();
}
$('provider-button').onclick = (e) => {
  if ($('provider-button').disabled) return;
  e.stopPropagation();
  const menu = $('provider-menu');
  menu.classList.toggle('open');
  $('provider-button').classList.toggle('open', menu.classList.contains('open'));
  if (menu.classList.contains('open')) refreshProviderStatus();
};
document.addEventListener('click', (e) => {
  if (!$('provider-menu').contains(e.target) && !$('provider-button').contains(e.target)) {
    $('provider-menu').classList.remove('open');
    $('provider-button').classList.remove('open');
  }
  if (
    $('local-config-pop').classList.contains('open') &&
    !$('local-config-pop').contains(e.target) &&
    !e.target.closest('.provider-item') &&
    e.target.id !== 'ctx-provider'
  ) {
    closeLocalProviderConfig();
  }
});
document.querySelectorAll('.provider-item').forEach((btn) => {
  btn.onclick = () => {
    setActiveProvider(btn.dataset.provider);
    $('provider-menu').classList.remove('open');
    $('provider-button').classList.remove('open');
  };
});

function clearDraftIfUnchanged(sessionId, draft) {
  if (activeId !== sessionId || $('task').value.trim() !== draft) return;
  $('task').value = '';
  resizeTask();
  updateSend();
  updateComposerContext();
}

async function sendTaskFromSession(sessionId, task, providerId = '', onSendStarted = null) {
  const text = String(task || '').trim();
  if (!text || runningSessionId) return false;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return false;
  const provider = PROVIDERS.includes(providerId)
    ? providerId
    : (PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER);
  if (typeof onSendStarted === 'function') onSendStarted();
  pushMsgToSession(sessionId, { type: 'user', text });
  const project = sessionProjectPath(sessionId);
  const intent = currentIntentForSession(sessionId);
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, project, task: text, provider, intent }),
  });
  if (r.status === 409) { addSendError(sessionId); return true; }
  if (!r.ok) {
    addSendError(sessionId);
    return true;
  }
  await acceptRunResponse(r, sessionId);
  return true;
}

$('send').onclick = async () => {
  const sessionId = activeId;
  const task = $('task').value.trim();
  const provider = currentProviderId();
  if (!task) return;
  await sendTaskFromSession(sessionId, task, provider, () => clearDraftIfUnchanged(sessionId, task));
};
async function continueTask(sessionId) {
  if (runningSessionId) return;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const p = sessionProject(s);
  if (!p) {
    addToSession(sessionId, { type: 'err', text: 'Only project tasks can be continued; plain chats have no tool loop.', sessionId });
    return;
  }
  addToSession(sessionId, { type: 'info', text: 'continue task' });
  const task = [
    'Continue the unfinished task in this same conversation.',
    'Use the existing project context and finish the original user request.',
    'If the work is complete, reply with a JSON done tool call.'
  ].join(' ');
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: sessionId,
      project: p.path,
      task,
      continue_task: true,
      provider: s.provider || DEFAULT_PROVIDER,
      intent: 'project',
    }),
  });
  if (r.status === 409 || !r.ok) {
    addSendError(sessionId);
    return;
  }
  await acceptRunResponse(r, sessionId);
}
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
$('changes-close').onclick = closeChangesDrawer;
$('research-close').onclick = closeResearchDrawer;
$('research-restore').onclick = restoreResearchRun;
$('research-use-project').onclick = () => attachCurrentChatToPickedProject({ sendDraft: false });
$('local-config-close').onclick = closeLocalProviderConfig;
$('local-config-save').onclick = saveLocalProviderConfig;
$('changes-refresh').onclick = () => {
  if (activeChangesProject) loadChangesDrawer(activeChangesProject);
};
$('changes-restore').onclick = async () => {
  if (!activeChangesProject || !lastChangesData || lastChangesData.mode === 'git') return;
  $('changes-restore').disabled = true;
  $('changes-restore').textContent = 'Restoring';
  try {
    const data = await restoreChanges(activeChangesProject);
    if (!data.ok) {
      const detail = data.conflicts && data.conflicts.length
        ? `Conflict: ${data.conflicts.join(', ')}`
        : (data.error || 'Restore failed');
      $('changes-subtitle').textContent = detail;
      $('changes-restore').disabled = false;
      return;
    }
    $('changes-restore').textContent = 'Restored';
    await loadChangesDrawer(activeChangesProject);
    setTimeout(() => { $('changes-restore').textContent = 'Restore'; }, 1200);
  } catch (err) {
    $('changes-subtitle').textContent = String(err);
  } finally {
    if ($('changes-restore').textContent !== 'Restored') $('changes-restore').textContent = 'Restore';
  }
};
$('changes-copy').onclick = async () => {
  const diff = lastChangesData && lastChangesData.diff ? lastChangesData.diff : '';
  if (!diff) return;
  try {
    await navigator.clipboard.writeText(diff);
    $('changes-copy').textContent = 'Copied';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  } catch {
    $('changes-copy').textContent = 'Failed';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  }
};
$('btn-new-chat').onclick = () => {
  const p = activeProject();
  newSession(p ? p.id : null);
};
$('btn-add-project').onclick = pickProject;
$('toggle-sidebar').onclick = () => {
  document.body.classList.add('sidebar-collapsed');
  $('show-sidebar').style.display = '';
};
$('show-sidebar').onclick = () => {
  document.body.classList.remove('sidebar-collapsed');
  $('show-sidebar').style.display = 'none';
};
$('topbar-more').onclick = (e) => {
  e.stopPropagation();
  openTopMenu(e.currentTarget);
};

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const p = activeProject();
    newSession(p ? p.id : null);
  }
});
window.addEventListener('pagehide', () => {
  if (uiStatePersistTimer !== null) {
    clearTimeout(uiStatePersistTimer);
    uiStatePersistTimer = null;
  }
  cacheUiState();
  const payload = JSON.stringify({ state: currentUiState() });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/ui_state', new Blob([payload], { type: 'application/json' }));
      return;
    }
  } catch {}
  saveUiStateToServer();
});

// ============================ boot ============================
async function boot() {
  renderSidebar();
  renderChat();
  resizeTask();
  updateSend();
  syncProviderUI(currentProviderId());
  $('provider-button').disabled = false;
  syncResearchUI();
  setStatus('', 'ok');
  await restoreUiStateFromServer();
  connectEvents();
}
boot();
</script>
