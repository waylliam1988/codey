<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/icon.ico" type="image/x-icon" />
<title>Codey</title>
<style>
  :root {
    --bg:        #181818;
    --bg-2:      #1c1c1c;
    --panel:     #202020;
    --panel-2:   #262626;
    --hover:     #2a2a2a;
    --active:    #2f2f2f;
    --border:    #2a2a2a;
    --border-2:  #232323;
    --text:      #e6e6e6;
    --text-dim:  #a0a0a0;
    --muted:     #6b6b6b;
    --faint:     #4a4a4a;
    --ok-dot:    #4ec9b0;
    --err-text:  #d28a8a;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Cascadia Code', 'SF Mono', 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    display: grid;
    grid-template-columns: auto 1fr;
    overflow: hidden;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================== sidebar ============================== */
  aside {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width .18s ease, min-width .18s ease;
    min-width: 260px;
  }
  body.sidebar-collapsed aside { width: 0; min-width: 0; overflow: hidden; }
  .sidebar-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px;
  }
  .sidebar-spacer { flex: 1; min-width: 0; }
  .btn-icon {
    background: transparent; border: 0; color: var(--text-dim); cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .btn-icon:hover { background: var(--hover); color: var(--text); }
  .btn-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .sidebar-actions {
    padding: 0 6px 8px;
    display: grid;
    gap: 1px;
  }
  .sidebar-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px;
    border: 0; background: transparent; color: var(--text-dim);
    border-radius: 6px; cursor: pointer; font-size: 13px;
    text-align: left;
    transition: background .12s, color .12s;
  }
  .sidebar-row:hover { background: var(--hover); color: var(--text); }
  .sidebar-row svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8;
    flex-shrink: 0;
  }
  .sidebar-row .label { flex: 1; min-width: 0; }
  .sidebar-row .kbd {
    color: var(--muted); font-size: 11px; font-family: var(--font-mono);
  }

  .session-list {
    flex: 1; overflow-y: auto; padding: 4px 6px 16px;
  }
  .group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 14px 10px 6px;
  }
  .project-node { margin-bottom: 1px; position: relative; }
  .project-row {
    display: flex; align-items: center; gap: 4px;
    color: var(--text-dim); border-radius: 6px;
    padding: 6px 6px 6px 4px; min-height: 30px;
    cursor: pointer;
    position: relative;
  }
  .project-row:hover { background: var(--hover); color: var(--text); }
  .project-row.has-active::before {
    content: ''; position: absolute; left: -6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--text); border-radius: 1px;
  }
  .project-toggle {
    width: 18px; height: 18px; border: 0; background: transparent;
    color: var(--muted); display: grid; place-items: center;
    border-radius: 4px; cursor: pointer; flex-shrink: 0;
    padding: 0;
  }
  .project-row:hover .project-toggle { color: var(--text-dim); }
  .project-toggle svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }
  .project-main {
    min-width: 0; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px;
  }
  .project-more {
    width: 22px; height: 22px; border: 0; background: transparent;
    color: var(--muted); display: none; place-items: center;
    border-radius: 4px; cursor: pointer; flex-shrink: 0;
    font-size: 14px; line-height: 1;
  }
  .project-row:hover .project-more { display: grid; }
  .project-more:hover { background: var(--panel-2); color: var(--text); }
  .project-children { padding-left: 14px; }
  .project-empty {
    margin: 1px 0 4px 22px;
    color: var(--faint); font-size: 12px;
    padding: 4px 8px;
  }

  .session-item {
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    color: var(--text-dim); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: background .1s, color .1s;
    margin-bottom: 1px;
  }
  .session-item:hover { background: var(--hover); color: var(--text); }
  .session-item.active { background: var(--active); color: var(--text); }
  .session-item .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .session-item .session-more {
    visibility: hidden;
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 0; width: 18px; height: 18px;
    border-radius: 3px; flex-shrink: 0;
    font-size: 13px; line-height: 1;
  }
  .session-item:hover .session-more { visibility: visible; }
  .session-item .session-more:hover { color: var(--text); background: var(--panel-2); }

  /* ============================== generic context menu ============================== */
  .ctx-menu {
    position: fixed;
    min-width: 168px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,.45);
    padding: 4px;
    z-index: 80;
    display: none;
  }
  .ctx-menu.open { display: grid; gap: 1px; }
  .ctx-menu button {
    width: 100%; border: 0; background: transparent;
    color: var(--text-dim); cursor: pointer;
    border-radius: 5px; padding: 7px 10px; text-align: left; font-size: 13px;
  }
  .ctx-menu button:hover { background: var(--hover); color: var(--text); }
  .ctx-menu button.danger:hover { color: var(--err-text); }
  .ctx-menu button.arming { color: var(--err-text); background: var(--hover); }

  /* ---------- inline rename ---------- */
  .rename-input {
    flex: 1; min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .rename-input:focus { border-color: var(--faint); }

  /* ============================== main ============================== */
  main {
    display: grid;
    grid-template-rows: 44px 1fr auto;
    min-height: 0; overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .topbar .sess-title {
    flex: 1; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text);
  }
  .topbar .sess-title .crumb-proj { color: var(--muted); }
  .topbar .sess-title .crumb-sep  { color: var(--faint); margin: 0 6px; }
  .topbar .sess-title .crumb-chat { color: var(--text); }

  .topbar-actions {
    display: inline-flex; align-items: center; gap: 6px;
    min-width: 0;
  }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-dim); font-size: 11.5px;
    max-width: 220px;
    overflow: hidden;
  }
  .status .status-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status.err { color: var(--err-text); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.err { background: var(--err-text); }
  .spinner {
    width: 11px; height: 11px;
    border: 1.4px solid var(--border);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chat-area {
    overflow-y: auto;
    padding: 24px 0 28px;
    min-height: 0;
  }
  .chat-inner {
    max-width: 760px; margin: 0 auto; padding: 0 24px;
    display: flex; flex-direction: column;
  }
  .welcome {
    padding: 96px 4px 0;
    color: var(--text-dim);
  }
  .welcome h1 {
    font-size: 18px; font-weight: 500; margin: 0 0 4px; color: var(--text);
    letter-spacing: 0;
  }
  .welcome p { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- messages: de-bubbled ---------- */
  .msg {
    display: flex; flex-direction: column;
    margin: 0 0 18px;
  }
  .msg-label {
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .msg-label.err { color: var(--err-text); }
  .msg .body {
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.65;
  }
  .msg.asst .body.collapsed {
    max-height: 168px; overflow: hidden; position: relative;
  }
  .msg.asst .body.collapsed::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    background: linear-gradient(180deg, transparent, var(--bg));
    pointer-events: none;
  }
  .msg.asst .toggle {
    margin-top: 4px; font-size: 11px; color: var(--text-dim); cursor: pointer;
    align-self: flex-start;
    user-select: none;
  }
  .msg.asst .toggle:hover { color: var(--text); }
  .msg-copy {
    width: 22px; height: 22px; margin-top: 6px; padding: 0;
    border: 0; border-radius: 4px; background: transparent;
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
    opacity: .45;
    transition: background .12s, color .12s, opacity .12s;
  }
  .msg:hover .msg-copy,
  .msg:focus-within .msg-copy { opacity: 1; }
  .msg-copy:hover,
  .msg-copy:focus-visible { background: var(--hover); color: var(--text-dim); opacity: 1; }
  .msg-copy.copied { color: var(--text); }
  .msg-copy svg {
    width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8;
  }

  /* ---------- assistant markdown (monochrome, no highlighting) ---------- */
  .msg .body.md { white-space: normal; }
  .msg .body.md > :first-child { margin-top: 0; }
  .msg .body.md > :last-child { margin-bottom: 0; }
  .md-p { margin: 0 0 10px; white-space: pre-wrap; }
  .md-h {
    font-weight: 600; color: var(--text);
    font-size: 13px; margin: 14px 0 8px;
  }
  .md-list { margin: 0 0 10px; padding-left: 20px; }
  .md-list .md-list { margin: 4px 0 2px; }
  .md-list li { margin: 2px 0; }
  .md-ic {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px;
  }
  .md-code {
    position: relative;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; margin: 0 0 10px;
    overflow-x: auto;
  }
  .md-code code {
    display: block;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
    color: var(--text); white-space: pre;
  }
  .code-copy {
    position: absolute; top: 6px; right: 6px;
    font-family: var(--font-mono); font-size: 11px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 4px; padding: 2px 8px;
    cursor: pointer; opacity: 0;
    transition: background .12s, color .12s, opacity .12s;
  }
  .md-code:hover .code-copy,
  .md-code:focus-within .code-copy { opacity: 1; }
  .code-copy:hover,
  .code-copy:focus-visible { background: var(--hover); color: var(--text-dim); opacity: 1; }
  .code-copy.copied { color: var(--text); }

  /* ---------- tool line ---------- */
  .tool-line {
    display: grid;
    grid-template-columns: 12px 7ch 1fr auto auto;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .tool-line .tl-dot { color: var(--faint); }
  .tool-line .tl-kind { color: var(--text-dim); }
  .tool-line .tl-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-dim);
  }
  .tool-line .tl-arrow { color: var(--faint); }
  .tool-line .tl-result { color: var(--text-dim); }
  .tool-line .tl-result.err { color: var(--err-text); }
  .tool-line.pending .tl-result { color: var(--muted); }
  .tool-line.compact { grid-template-columns: 1fr auto auto; }
  .msg.tool { margin: 0; }
  .msg.tool + .msg.tool { margin-top: 0; }

  /* ---------- tool group (read-only folding) ---------- */
  .tool-group { margin: 0; }
  .tool-group-summary {
    display: grid;
    grid-template-columns: 12px auto 1fr auto;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
    cursor: pointer;
  }
  .tool-group-summary .tg-kind { color: var(--text-dim); }
  .tool-group-summary .tg-count { color: var(--muted); }
  .tool-group-summary .tg-chevron {
    justify-self: end; color: var(--faint);
    transition: transform .12s;
  }
  .tool-group:not(.collapsed) .tg-chevron { transform: rotate(90deg); }
  .tool-group-summary:hover .tg-kind,
  .tool-group-summary:hover .tg-count { color: var(--text); }
  .tool-group-body { display: none; padding-left: 20px; }
  .tool-group:not(.collapsed) .tool-group-body { display: block; }

  /* ---------- turn divider ---------- */
  .turn-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 18px 0 8px;
  }
  .turn-divider .line {
    flex: 1; height: 1px; background: var(--border);
  }

  /* ---------- inline note (formerly turn-divider used for info) ---------- */
  .info-line {
    color: var(--muted);
    font-size: 11.5px;
    padding: 4px 0;
    font-family: var(--font-mono);
  }

  /* ---------- status rows (done / pause / limit / error / changes) ---------- */
  .status-row {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 13px;
    margin: 4px 0 0;
  }
  .status-row .sr-prefix {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    flex-shrink: 0;
  }
  .status-row.err .sr-prefix { color: var(--err-text); }
  .status-row .sr-text {
    color: var(--text-dim);
    flex: 1; min-width: 0;
    overflow-wrap: anywhere;
  }
  .status-row.err .sr-text { color: var(--err-text); }
  .link-btn {
    background: transparent; border: 0; padding: 0;
    color: var(--text-dim); cursor: pointer;
    font-size: 12px; font-family: inherit;
    flex-shrink: 0;
  }
  .link-btn:hover:not(:disabled) { color: var(--text); text-decoration: underline; }
  .link-btn:disabled { color: var(--faint); cursor: not-allowed; }

  /* ---------- changes card ---------- */
  .changes-head-row {
    display: flex; align-items: baseline; gap: 12px;
  }
  .changes-head-row .changes-count {
    font-size: 13px; color: var(--text-dim); flex: 1;
  }
  .changes-files {
    margin-top: 6px;
    display: grid;
    gap: 2px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .changes-file {
    display: grid;
    grid-template-columns: 2ch 1fr auto;
    gap: 12px;
    align-items: baseline;
    color: var(--text-dim);
  }
  .changes-file .cf-status { color: var(--muted); }
  .changes-file .cf-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .changes-file .cf-stat { color: var(--text-dim); }

  /* ---------- shell card ---------- */
  .shell-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid; gap: 8px;
  }
  .shell-card .sc-title {
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .shell-card .sc-meta {
    color: var(--muted); font-family: var(--font-mono); font-size: 11.5px;
  }
  .shell-card .sc-note {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .shell-card .sc-error {
    color: var(--err-text);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .shell-command {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
    color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre;
  }
  .shell-actions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .text-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .text-btn:hover:not(:disabled) {
    background: var(--hover); color: var(--text); border-color: var(--border);
  }
  .text-btn.primary {
    color: var(--text);
    font-weight: 500;
  }
  .text-btn.primary:hover:not(:disabled) {
    background: var(--panel-2);
  }
  .text-btn:disabled { opacity: .4; cursor: not-allowed; }

  .shell-output {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px;
    color: var(--text-dim); font-family: var(--font-mono); font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* ============================== composer ============================== */
  .composer-wrap {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 24px 16px;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
  }
  .composer-context {
    color: var(--muted);
    font-size: 11.5px;
    padding: 0 4px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .ctx-token {
    border: 0;
    background: transparent;
    color: inherit;
    padding: 1px 4px;
    font: inherit;
    cursor: pointer;
  }
  .ctx-token:hover:not(:disabled) { color: var(--text); }
  .ctx-token.active {
    color: var(--text);
  }
  .ctx-token:disabled {
    cursor: default;
    opacity: .55;
  }
  .ctx-token:focus-visible {
    outline: 1px solid var(--faint);
    outline-offset: 2px;
  }
  .composer-context .ctx-sep { color: var(--faint); }
  .composer-box {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px 8px;
    transition: border-color .12s;
  }
  .composer-box:focus-within { border-color: var(--text-dim); }
  .composer-box textarea {
    width: 100%; min-height: 40px; max-height: 220px;
    background: transparent; border: 0; color: var(--text);
    font-family: inherit; font-size: 13.5px; line-height: 1.55;
    resize: none; outline: none; padding: 6px 4px;
  }
  .composer-box textarea::placeholder { color: var(--muted); }

  .composer-bar {
    display: flex; align-items: center; gap: 6px; margin-top: 2px;
  }

  /* provider picker — keeps the green dot */
  .provider-chooser { position: relative; display: inline-flex; }
  .provider-button {
    border: 0;
    background: transparent;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 8px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
  }
  .provider-button:hover:not(:disabled),
  .provider-button.open {
    background: var(--hover);
    color: var(--text);
  }
  .provider-button:disabled { opacity: .55; cursor: default; }
  .provider-button .chev {
    width: 11px; height: 11px;
    stroke: currentColor; fill: none; stroke-width: 2;
    color: var(--faint);
    flex-shrink: 0;
  }
  .provider-menu {
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    min-width: 180px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    padding: 4px;
    display: none;
    z-index: 30;
  }
  .provider-menu.open { display: grid; gap: 1px; }

<script src="/assets/research_graph.js?v=0.2.14"></script>
<script>
// ============================ state & storage ============================
const $ = (id) => document.getElementById(id);
const LS_SESSIONS = 'codey:sessions';
const LS_ACTIVE   = 'codey:active';
const LS_PROJECTS = 'codey:projects';
const LS_UI_UPDATED = 'codey:ui-updated';
const LS_UI_REVISION = 'codey:ui-revision';
const LS_LEGACY_PROJECT = 'codey:project';
const DEFAULT_PROVIDER = 'deepseek';
const PROVIDER_LABELS = { deepseek: 'DeepSeek', mimo: 'MiMo', stepfun: 'StepFun', qwen: 'Qwen', glm: 'GLM', local: 'Local' };
const PROVIDERS = Object.keys(PROVIDER_LABELS);

function uid() { return Math.random().toString(36).slice(2, 10); }
function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; }
}
function saveSessions(arr) { localStorage.setItem(LS_SESSIONS, JSON.stringify(arr)); }
function saveProjects(arr) { localStorage.setItem(LS_PROJECTS, JSON.stringify(arr)); }
function defaultSession(projectId = null, provider = DEFAULT_PROVIDER) {
  return { id: uid(), title: 'New chat', messages: [], terminalRuns: [], researchRuns: [], createdAt: Date.now(), projectId, provider, research: false };
}
function pathName(path) {
  const trimmed = (path || '').replace(/[\\\/]+$/, '');
  return trimmed.split(/[\\\/]/).pop() || trimmed || 'project';
}
function pathKey(path) { return (path || '').replace(/[\\\/]+$/, '').toLowerCase(); }
function escapeHtml(text) {
  return (text || '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function normalizeStoredResearchRun(run) {
  run = run && typeof run === 'object' ? run : {};
  return {
    runId: String(run.runId || ''),
    synthesisId: String(run.synthesisId || ''),
    notesCreated: Array.isArray(run.notesCreated) ? run.notesCreated.map(String) : [],
    notesUpdated: Array.isArray(run.notesUpdated) ? run.notesUpdated.map(String) : [],
    sourceUrls: Array.isArray(run.sourceUrls) ? run.sourceUrls.map(String) : [],
    sourcesRead: Number(run.sourcesRead || 0),
    queries: Array.isArray(run.queries) ? run.queries.map(String) : [],
    searchResults: Array.isArray(run.searchResults) ? run.searchResults : [],
    openedSources: Array.isArray(run.openedSources) ? run.openedSources : [],
    coverage: run.coverage && typeof run.coverage === 'object' ? run.coverage : {},
    citationMap: Array.isArray(run.citationMap) ? run.citationMap : [],
    evidenceItems: Array.isArray(run.evidenceItems) ? run.evidenceItems : [],
    counterpoints: Array.isArray(run.counterpoints) ? run.counterpoints.map(String) : [],
    qualityWarnings: Array.isArray(run.qualityWarnings) ? run.qualityWarnings.map(String) : [],
    receipt: run.receipt ? String(run.receipt) : '',
    restoreable: false,
    createdAt: Number(run.createdAt || 0) || Date.now(),
  };
}

function normalizeSessions(value) {
  return (Array.isArray(value) ? value : []).map(s => ({
    id: s.id || uid(),
    title: s.title || 'New chat',
    messages: Array.isArray(s.messages) ? s.messages : [],
    terminalRuns: Array.isArray(s.terminalRuns) ? s.terminalRuns.slice(-32) : [],
    researchRuns: Array.isArray(s.researchRuns)
      ? s.researchRuns.slice(-32).map(normalizeStoredResearchRun)
      : [],
    createdAt: s.createdAt || Date.now(),
    projectId: s.projectId || null,
    provider: PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER,
    research: !!s.research,
  }));
}
function normalizeProjects(value) {
  return (Array.isArray(value) ? value : []).map(p => ({
    id: p.id || uid(),
    name: p.name || pathName(p.path),
    path: p.path || '',
    expanded: p.expanded !== false,
    createdAt: p.createdAt || Date.now(),
  })).filter(p => p.path);
}
function applyUiState(state) {
  sessions = normalizeSessions(state && state.sessions);
  projects = normalizeProjects(state && state.projects);
  activeId = state && state.active_id ? String(state.active_id) : '';
  uiStateUpdatedAt = Number(state && state.updated_at || 0) || 0;
  uiStateRevision = Number(state && state.revision || 0) || 0;
  if (!sessions.length) {
    const s = defaultSession();
    sessions = [s];
    activeId = s.id;
  }
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
}
function currentUiState() {
  return { active_id: activeId, sessions, projects, updated_at: uiStateUpdatedAt, revision: uiStateRevision };
}
function cacheUiState() {
  saveSessions(sessions);
  saveProjects(projects);
  localStorage.setItem(LS_ACTIVE, activeId);
  localStorage.setItem(LS_UI_UPDATED, String(uiStateUpdatedAt));
  localStorage.setItem(LS_UI_REVISION, String(uiStateRevision));
}

function renderMarkdown(container, text) {
  const lines = String(text == null ? '' : text).split('\n');
  let listStack = [];
  const flushList = () => {
    if (listStack.length) container.appendChild(listStack[0].el);
    listStack = [];
  };
  const appendListItem = (line) => {
    const match = line.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
    if (!match) return false;
    const spaces = match[1].replace(/\t/g, '    ').length;
    let depth = Math.floor(spaces / 2);
    const tag = /^\d/.test(match[2]) ? 'ol' : 'ul';
    if (depth > listStack.length) depth = listStack.length;
    if (depth === 0 && listStack[0] && listStack[0].tag !== tag) flushList();
    while (listStack.length > depth + 1) listStack.pop();
    if (!listStack[depth] || listStack[depth].tag !== tag) {
      if (depth > 0 && (!listStack[depth - 1] || !listStack[depth - 1].lastLi)) depth = 0;
      if (depth === 0 && listStack[0] && listStack[0].tag !== tag) flushList();
      const next = document.createElement(tag);
      next.className = 'md-list';
      if (depth > 0) {
        const parent = listStack[depth - 1];
        parent.lastLi.appendChild(next);
      }
      listStack = listStack.slice(0, depth);
      listStack[depth] = { el: next, tag, lastLi: null };
    }
    const li = document.createElement('li');
    li.innerHTML = renderInlineMd(match[3]);
    listStack[depth].el.appendChild(li);
    listStack[depth].lastLi = li;
    return true;
  };
  const isBreak = (line) => (
    /^\s*```/.test(line) || /^#{1,6}\s+/.test(line)
    || /^\s*[-*]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)
  );
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      appendCodeBlock(container, buf.join('\n'));
      continue;
    }
    if (!line.trim()) { flushList(); i++; continue; }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushList();
      const el = document.createElement('div');
      el.className = 'md-h md-h' + Math.min(6, heading[1].length);
      el.innerHTML = renderInlineMd(heading[2]);
      container.appendChild(el);
      i++;
      continue;
    }
    if (appendListItem(line)) {
      i++;
      continue;
    }
    flushList();
    const para = [];
    while (i < lines.length && lines[i].trim() && !isBreak(lines[i])) {
      para.push(lines[i]);
      i++;
    }
    const p = document.createElement('p');
    p.className = 'md-p';
    p.innerHTML = renderInlineMd(para.join('\n'));
    container.appendChild(p);
  }
  flushList();
}

  if (FOLDABLE_TOOL_KINDS.has(m.kind) && !m.error && !m.pending) {
    div.dataset.foldkind = m.kind;
    div.dataset.toolPath = m.path || '';
    div.dataset.toolResult = m.result || '';
  }
  div.appendChild(toolRowEl(m, false));
  return div;
}
function appendToToolGroup(group, m) {
  const body = group.querySelector('.tool-group-body');
  body.appendChild(toolRowEl(m, true));
  group.querySelector('.tg-count').textContent = foldCountLabel(m.kind, body.children.length);
}
function appendOrFoldTool(chat, m) {
  const last = chat.lastElementChild;
  if (last && last.classList && last.classList.contains('tool-group') && last.dataset.foldkind === m.kind) {
    appendToToolGroup(last, m);
    return;
  }
  if (last && last.classList && last.classList.contains('msg') && last.classList.contains('tool') && last.dataset.foldkind === m.kind) {
    const group = createToolGroup(m.kind);
    appendToToolGroup(group, {
      kind: m.kind,
      path: last.dataset.toolPath || '',
      result: last.dataset.toolResult || '',
      error: false,
    });
    appendToToolGroup(group, m);

function appendMessageNode(chat, m) {

    body.className = 'body md';

    div.appendChild(body);

  } else if (m.type === 'research_done') {
    const actions = [
      { label: 'Open', onclick: () => openResearchDrawer(m.sessionId || activeId) },
      { label: 'Use in Project', onclick: () => attachCurrentChatToPickedProject({ sendDraft: false }) },
    ];
    chat.appendChild(statusRow('Research', m.text || 'Research saved', {
      kind: 'done',
      actions,
      copyText: m.text || '',
    }));
  } else if (m.type === 'done') {
    const action = m.project && m.changed ? {
      label: 'View diff',
      onclick: () => openChangesDrawer(m.project),
    } : null;
    const text = m.text || 'Task complete';
    chat.appendChild(statusRow('Done', text, { kind: 'done', action, copyText: text }));
  } else if (m.type === 'review') {
    const text = m.text || 'Complete';
    chat.appendChild(statusRow('Review', text, { kind: 'review', copyText: text }));
  } else if (m.type === 'changes') {
    const div = document.createElement('div');
    div.className = 'msg changes';
    const head = document.createElement('div');
    head.className = 'changes-head-row';
    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = 'Changes';
    const count = document.createElement('span');
    count.className = 'changes-count';
    const n = m.count || 0;
    count.textContent = `${n} file${n === 1 ? '' : 's'}`;
    const view = document.createElement('button');
    view.className = 'link-btn';
    view.textContent = 'View diff';
    view.onclick = () => openChangesDrawer(m.project || currentProjectPath());
    head.append(label, count, view);
    div.appendChild(head);
    const files = Array.isArray(m.files) ? m.files : [];
    if (files.length) {
      const list = document.createElement('div');
      list.className = 'changes-files';
      for (const f of files) {
        const row = document.createElement('div');
        row.className = 'changes-file';
        row.innerHTML = `<span class="cf-status">${escapeHtml(f.status || 'M')}</span><span class="cf-path">${escapeHtml(f.path || '')}</span><span class="cf-stat">+${f.additions || 0} -${f.deletions || 0}</span>`;
        list.appendChild(row);
      }
      div.appendChild(list);
    }
    chat.appendChild(div);
  } else if (m.type === 'shell_request') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const card = document.createElement('div');
    card.className = 'shell-card';
    const title = document.createElement('div');
    title.className = 'sc-title';
    title.textContent = 'Approval required';
    const meta = document.createElement('div');
    meta.className = 'sc-meta';
    meta.textContent = m.cwd ? `Runs in ${m.cwd}` : 'Runs in .';
    const riskTitle = m.riskTitle || m.riskLabel || '';
    const riskDetail = m.riskDetail || '';
    const note = document.createElement('div');
    note.className = 'sc-note';
    note.textContent = riskTitle || riskDetail
      ? `${riskTitle || 'Shell command'}${riskDetail ? ` · ${riskDetail}` : ''}`
      : '';
    const cmd = document.createElement('div');
    cmd.className = 'shell-command';
    cmd.textContent = '$ ' + (m.command || '');
    const error = document.createElement('div');
    error.className = 'sc-error';
    error.hidden = true;
    const actions = document.createElement('div');
    actions.className = 'shell-actions';
    const deny = document.createElement('button');
    deny.className = 'text-btn';
    deny.textContent = 'Deny';
    const approve = document.createElement('button');
    approve.className = 'text-btn primary';
    approve.textContent = 'Allow';
    approve.onclick = () => approveCommand(m.id, true, approve, deny, error);
    deny.onclick = () => approveCommand(m.id, false, approve, deny, error);
    actions.append(deny, approve);
    card.append(title, meta);
    if (note.textContent) card.appendChild(note);
    card.append(cmd, error, actions);
    div.appendChild(card);
    chat.appendChild(div);
  } else if (m.type === 'shell_result') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const out = document.createElement('div');
    out.className = 'shell-output';
    const exit = m.exitCode === null || m.exitCode === undefined ? '' : `exit ${m.exitCode}\n`;
    out.textContent = `${m.approved ? 'Executed' : 'Denied'}\n$ ${m.command || ''}\n${exit}${m.output || ''}`;
    div.appendChild(out);
    chat.appendChild(div);
  } else if (m.type === 'limit') {
    chat.appendChild(statusRow('Limit', m.text || 'Turn limit reached', {
      action: { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'pause') {
    chat.appendChild(statusRow('Paused', m.text || 'No progress for several turns', {
      action: { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'teach') {
    chat.appendChild(statusRow('Paused', m.text || 'Click the control in the model page', {
      action: { label: 'Resume', disabled: false, onclick: () => resumeTeaching(m.id, m.sessionId || activeId) },
    }));
  } else if (m.type === 'err') {
    chat.appendChild(statusRow('Error', m.text || '', {
      err: true,
      action: { label: 'Retry', disabled: !!runningSessionId, onclick: () => retryTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'info') {
    const div = document.createElement('div');
    div.className = 'info-line';
    div.textContent = m.text;
    chat.appendChild(div);
  }
}

// ============================ session ops ============================
function switchSession(id) {
  activeId = id; persistActiveNow(); renderSidebar(); renderChat();
}
function openProject(projectId) {
  const p = projectById(projectId);
  if (!p) return;
  p.expanded = true;
  const first = sessions.find(s => s.projectId === projectId);
  if (first) switchSession(first.id);
  else newSession(projectId);
}
function newSession(projectId = null) {
  const provider = currentProviderId();
  const s = defaultSession(projectId, provider);
  sessions.unshift(s); activeId = s.id; persistActiveNow(); renderSidebar(); renderChat();
  fetch('/api/new_chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: s.id }),
  }).catch(() => {});
}
async function forgetSessionState(id) {
  try {
    const response = await fetch('/api/new_chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: id }),
    });
    return response.ok;
  } catch {
    return false;
  }
}
async function deleteSession(id) {
  if (!await forgetSessionState(id)) return;
  const fallbackProvider = currentProviderId();
  sessions = sessions.filter(s => s.id !== id);
  if (!sessions.length) {
    const s = defaultSession(null, fallbackProvider);
    sessions = [s];
  }
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActiveNow(); renderSidebar(); renderChat();
}
function renameSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  editingProjectId = '';
  editingSessionId = id;
  if (s.projectId) { const p = projectById(s.projectId); if (p) p.expanded = true; }
  renderSidebar();
  focusRenameInput();
}
async function clearMessages(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  if (!await forgetSessionState(id)) return;
  s.messages = [];
  s.terminalRuns = [];
  s.researchRuns = [];
  persistActiveNow();
  if (id === activeId) renderChat();
}
function renameProject(id) {
  const p = projectById(id);
  if (!p) return;
  editingSessionId = '';
  editingProjectId = id;
  renderSidebar();
  focusRenameInput();
}
async function deleteProject(id) {
  const p = projectById(id);
  if (!p) return;
  const cleared = await Promise.all(
    sessions.filter(s => s.projectId === id).map(s => forgetSessionState(s.id))
  );
  if (!cleared.every(Boolean)) return;
  projects = projects.filter(x => x.id !== id);
  sessions = sessions.filter(s => s.projectId !== id);
  if (!sessions.length) sessions = [defaultSession(null, DEFAULT_PROVIDER)];
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActiveNow(); renderSidebar(); renderChat();
}
function ensureProject(path, name) {
  const existing = projects.find(p => pathKey(p.path) === pathKey(path));
  if (existing) {
    existing.expanded = true;
    return existing;
  }
  const p = {
    id: uid(),
    name: name || pathName(path),
    path,
    expanded: true,
    createdAt: Date.now(),
  };
  projects.unshift(p);
  persistActive();
  return p;
}
let projectPickerBusy = false;
async function pickProjectPath(mode = 'open', initial = '') {
  if (projectPickerBusy) return null;
  projectPickerBusy = true;
  $('btn-add-project').disabled = true;
  updateComposerContext();
  try {
    const r = await fetch('/api/pick_folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, initial }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      setStatus('Could not add project', 'err');
      return null;
    }
    if (!data.ok || !data.path) return null;
    return data;
  } finally {
    projectPickerBusy = false;
    $('btn-add-project').disabled = false;
    updateComposerContext();
  }
}
function attachSessionToProject(projectId, sessionId = activeId) {
  const s = sessions.find(x => x.id === sessionId);
  const p = projectById(projectId);
  if (!s || !p || sessionProject(s)) return false;
  s.projectId = p.id;
  s.research = false;
  p.expanded = true;
  persistActiveNow();
  renderSidebar();
  if (sessionId === activeId) renderChat();
  else updateComposerContext();
  return true;
}
async function pickProject() {
  const s = activeSession();
  const shouldAttach = !!s && !sessionProject(s);
  const data = await pickProjectPath(shouldAttach ? 'new' : 'open', currentProjectPath());
  if (!data) return;
  const p = ensureProject(data.path, data.name);
  if (shouldAttach) attachSessionToProject(p.id, s.id);
  else newSession(p.id);
}

async function attachCurrentChatToPickedProject({ sendDraft = false } = {}) {
  if (runningSessionId) return;
  const sid = activeId;
  const s = sessions.find(x => x.id === sid);
  if (!s || sessionProject(s)) return;
  const draft = $('task').value.trim();
  const provider = PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER;
  const data = await pickProjectPath('new', currentProjectPath());
  if (!data) return;
  const p = ensureProject(data.path, data.name);
  if (!attachSessionToProject(p.id, sid)) return;
  if (!sendDraft || !draft) return;
  await sendTaskFromSession(sid, draft, provider, () => clearDraftIfUnchanged(sid, draft));
}

function pushMsgToSession(sid, m) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  const wasEmpty = s.messages.length === 0;
  s.messages.push(m);
  if (s.title === 'New chat' && m.type === 'user' && m.text) {
    s.title = m.text.slice(0, 28) + (m.text.length > 28 ? '…' : '');
    persistActiveNow();
    renderSidebar();
    if (sid === activeId) renderChat();
    return true;
  }
  persistActiveNow();
  if (sid === activeId) {
    if (wasEmpty) renderChat();
    else {
      appendMessageNode($('chat'), m);
      scrollChat();
    }
  }
  return true;
}

function openMenuAt(menu, anchor) {
  const rect = anchor.getBoundingClientRect();
  menu.classList.add('open');
  const mr = menu.getBoundingClientRect();
  let left = rect.right - mr.width;
  if (left < 8) left = rect.left;
  let top = rect.bottom + 4;
  if (top + mr.height > window.innerHeight - 8) top = rect.top - mr.height - 4;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
}
