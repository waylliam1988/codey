<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/icon.ico" type="image/x-icon" />
<title>Codey</title>
<link rel="stylesheet" href="/assets/tokens.css?v=__CODEY_VERSION__" />
<link rel="stylesheet" href="/assets/app.css?v=__CODEY_VERSION__" />
</head>
<body>
<aside id="aside">
  <div class="sidebar-head">
    <button class="btn-icon" id="toggle-sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-spacer"></div>
  </div>
  <div class="sidebar-actions">
    <button class="sidebar-row" id="btn-new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">New chat</span>
      <span class="kbd">Ctrl+N</span>
    </button>
    <button class="sidebar-row" id="btn-add-project">
      <svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      <span class="label">Add project</span>
    </button>
  </div>
  <div class="session-list" id="session-list"></div>
</aside>

<main>
  <div class="topbar">
    <button class="btn-icon" id="show-sidebar" title="Show sidebar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="sess-title" id="sess-title">New chat</div>
    <div class="topbar-actions">
      <div class="status" id="status"></div>
      <button class="btn-icon" id="topbar-more" title="More">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="chat-inner" id="chat"></div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="composer-context" id="composer-context"></div>
      <div class="composer-box">
        <textarea id="task" placeholder="Send a message to Codey…" rows="1"></textarea>
      </div>
      <div class="composer-bar">
        <div class="provider-chooser">
          <button class="provider-button" id="provider-button" title="Model" disabled>
            <span class="dot" id="provider-dot"></span>
            <span class="name" id="provider-name">DeepSeek</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="provider-menu" id="provider-menu" aria-hidden="true">
            <button class="provider-item" data-provider="deepseek">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">DeepSeek</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="mimo">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">MiMo</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="stepfun">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">StepFun</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="qwen">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">Qwen</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="glm">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">GLM</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="local">
              <span class="dot" aria-hidden="true"></span>
              <span class="label">Local</span>
              <span class="check">✓</span>
            </button>
          </div>
        </div>
        <span class="send-hint" id="send-hint">Enter</span>
        <div class="action-slot">
          <button class="icon-btn" id="stop" style="display:none" title="Stop">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="icon-btn send" id="send" disabled title="Send">
            <svg viewBox="0 0 24 24"><path d="M3 11 21 3l-7 18-3-8-8-2Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="local-config-pop" id="local-config-pop" aria-hidden="true">
  <h4>Local model</h4>
  <p>Connect an OpenAI-compatible local endpoint.</p>
  <div class="local-config-candidates" id="local-config-candidates"></div>
  <input id="local-base-url" placeholder="http://127.0.0.1:1234/v1" autocomplete="off" />
  <input id="local-model-name" placeholder="model id" autocomplete="off" />
  <input id="local-api-key" placeholder="API key (blank keeps saved key)" autocomplete="off" />
  <div class="local-config-actions">
    <button class="text-btn" id="local-config-close">Close</button>
    <button class="text-btn primary" id="local-config-save">Connect</button>
  </div>
  <div class="local-config-error" id="local-config-error"></div>
</div>

<div class="ctx-menu" id="proj-menu">
  <button data-act="newchat">New chat here</button>
  <button data-act="rename">Rename</button>
  <button data-act="remove" class="danger" data-confirm="Confirm remove">Remove project and chats</button>
</div>
<div class="ctx-menu" id="sess-menu">
  <button data-act="rename">Rename</button>
  <button data-act="delete" class="danger" data-confirm="Confirm delete">Delete chat</button>
</div>
<div class="ctx-menu" id="top-menu">
  <button data-act="rename">Rename chat</button>
  <button data-act="local-context">Local context</button>
  <button data-act="clear" class="danger" data-confirm="Confirm clear">Clear messages</button>
</div>
<div class="ctx-menu" id="local-context-menu"></div>

<section class="changes-drawer" id="changes-drawer" aria-hidden="true">
  <div class="changes-head">
    <div class="changes-title">
      <strong>Changes</strong>
      <span id="changes-subtitle">Not loaded</span>
    </div>
    <button class="drawer-btn" id="changes-copy">Copy diff</button>
    <button class="drawer-btn" id="changes-restore">Restore</button>
    <button class="drawer-btn" id="changes-refresh">Refresh</button>
    <button class="drawer-btn" id="changes-close">Close</button>
  </div>
  <div class="changes-body" id="changes-body">
    <div class="changes-empty">No changes</div>
  </div>
</section>

<section class="changes-drawer" id="research-drawer" aria-hidden="true">
  <div class="changes-head">
    <div class="changes-title">
      <strong>Research</strong>
      <span id="research-subtitle">Not loaded</span>
    </div>
    <button class="drawer-btn" id="research-use-project">Use in Project</button>
    <button class="drawer-btn" id="research-restore">Restore</button>
    <button class="drawer-btn" id="research-close">Close</button>
  </div>
  <div class="changes-body" id="research-body">
    <div class="changes-empty">No research yet</div>
  </div>
</section>

<section class="changes-drawer" id="local-context-drawer" aria-hidden="true">
  <div class="changes-head">
    <div class="changes-title">
      <strong>Local context</strong>
      <span id="local-context-subtitle">Not loaded</span>
    </div>
    <button class="drawer-btn" id="local-context-export">Export</button>
    <button class="drawer-btn" id="local-context-refresh">Refresh</button>
    <button class="drawer-btn" id="local-context-close">Close</button>
  </div>
  <div class="changes-body" id="local-context-body">
    <div class="changes-empty">Not loaded</div>
  </div>
</section>

<script src="/assets/render.js?v=__CODEY_VERSION__"></script>
<script src="/assets/research_graph.js?v=__CODEY_VERSION__"></script>
<script src="/assets/research_drawer.js?v=__CODEY_VERSION__"></script>
<script src="/assets/changes_drawer.js?v=__CODEY_VERSION__"></script>
<script src="/assets/local_context_drawer.js?v=__CODEY_VERSION__"></script>
<script src="/assets/run_details.js?v=__CODEY_VERSION__"></script>
<script src="/assets/provider_ui.js?v=__CODEY_VERSION__"></script>
<script>
// ============================ state & storage ============================
const $ = (id) => document.getElementById(id);
const LS_SESSIONS = 'codey:sessions';
const LS_ACTIVE   = 'codey:active';
const LS_PROJECTS = 'codey:projects';
const LS_UI_UPDATED = 'codey:ui-updated';
const LS_UI_REVISION = 'codey:ui-revision';
const DEFAULT_PROVIDER = 'deepseek';
const PROVIDER_LABELS = { deepseek: 'DeepSeek', mimo: 'MiMo', stepfun: 'StepFun', qwen: 'Qwen', glm: 'GLM', local: 'Local' };
const PROVIDERS = Object.keys(PROVIDER_LABELS);

function uid() { return Math.random().toString(36).slice(2, 10); }
function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; }
}
function safeLocalSet(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
function saveSessions(arr) { safeLocalSet(LS_SESSIONS, JSON.stringify(arr)); }
function saveProjects(arr) { safeLocalSet(LS_PROJECTS, JSON.stringify(arr)); }
function defaultSession(projectId = null, provider = DEFAULT_PROVIDER) {
  return { id: uid(), title: 'New chat', messages: [], terminalRuns: [], researchRuns: [], createdAt: Date.now(), projectId, provider, research: false };
}
function pathName(path) {
  const trimmed = (path || '').replace(/[\\\/]+$/, '');
  return trimmed.split(/[\\\/]/).pop() || trimmed || 'project';
}
function pathKey(path) { return (path || '').replace(/[\\\/]+$/, '').toLowerCase(); }
// escapeHtml and the receipt schema helpers live in /assets/render.js.
const escapeHtml = window.CodeyRender.escapeHtml;
const receiptSummary = window.CodeyRender.receiptSummary;
const receiptChangedCount = window.CodeyRender.receiptChangedCount;

function normalizeStoredResearchRun(run) {
  run = run && typeof run === 'object' ? run : {};
  return {
    runId: String(run.runId || ''),
    synthesisId: String(run.synthesisId || ''),
    notesCreated: Array.isArray(run.notesCreated) ? run.notesCreated.map(String) : [],
    notesUpdated: Array.isArray(run.notesUpdated) ? run.notesUpdated.map(String) : [],
    sourceUrls: Array.isArray(run.sourceUrls) ? run.sourceUrls.map(String) : [],
    sourcesRead: Number(run.sourcesRead || 0),
    queries: Array.isArray(run.queries) ? run.queries.map(String) : [],
    searchResults: Array.isArray(run.searchResults) ? run.searchResults : [],
    openedSources: Array.isArray(run.openedSources) ? run.openedSources : [],
    coverage: run.coverage && typeof run.coverage === 'object' ? run.coverage : {},
    citationMap: Array.isArray(run.citationMap) ? run.citationMap : [],
    evidenceItems: Array.isArray(run.evidenceItems) ? run.evidenceItems : [],
    counterpoints: Array.isArray(run.counterpoints) ? run.counterpoints.map(String) : [],
    qualityWarnings: Array.isArray(run.qualityWarnings) ? run.qualityWarnings.map(String) : [],
    receipt: run.receipt ? String(run.receipt) : '',
    restoreable: false,
    createdAt: Number(run.createdAt || 0) || Date.now(),
  };
}

function normalizeSessions(value) {
  return (Array.isArray(value) ? value : []).map(s => ({
    id: s.id || uid(),
    title: s.title || 'New chat',
    messages: Array.isArray(s.messages) ? s.messages : [],
    terminalRuns: Array.isArray(s.terminalRuns) ? s.terminalRuns.slice(-32) : [],
    researchRuns: Array.isArray(s.researchRuns)
      ? s.researchRuns.slice(-32).map(normalizeStoredResearchRun)
      : [],
    createdAt: s.createdAt || Date.now(),
    projectId: s.projectId || null,
    provider: PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER,
    research: !!s.research,
  }));
}
function normalizeProjects(value) {
  return (Array.isArray(value) ? value : []).map(p => ({
    id: p.id || uid(),
    name: p.name || pathName(p.path),
    path: p.path || '',
    expanded: p.expanded !== false,
    createdAt: p.createdAt || Date.now(),
  })).filter(p => p.path);
}
function applyUiState(state) {
  sessions = normalizeSessions(state && state.sessions);
  projects = normalizeProjects(state && state.projects);
  activeId = state && state.active_id ? String(state.active_id) : '';
  uiStateUpdatedAt = Number(state && state.updated_at || 0) || 0;
  uiStateRevision = Number(state && state.revision || 0) || 0;
  if (!sessions.length) {
    const s = defaultSession();
    sessions = [s];
    activeId = s.id;
  }
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
}
function currentUiState() {
  return { active_id: activeId, sessions, projects, updated_at: uiStateUpdatedAt, revision: uiStateRevision };
}
function cacheUiState() {
  saveSessions(sessions);
  saveProjects(projects);
  safeLocalSet(LS_ACTIVE, activeId);
  safeLocalSet(LS_UI_UPDATED, String(uiStateUpdatedAt));
  safeLocalSet(LS_UI_REVISION, String(uiStateRevision));
}
function cachedUiState() {
  return {
    active_id: localStorage.getItem(LS_ACTIVE) || '',
    sessions: loadJson(LS_SESSIONS, []),
    projects: loadJson(LS_PROJECTS, []),
    updated_at: Number(localStorage.getItem(LS_UI_UPDATED) || 0) || 0,
    revision: Number(localStorage.getItem(LS_UI_REVISION) || 0) || 0,
  };
}
function uiStateVersion(state) {
  return [
    Number(state && state.updated_at || 0) || 0,
    Number(state && state.revision || 0) || 0,
  ];
}
function isUiStateNewer(a, b) {
  const av = uiStateVersion(a);
  const bv = uiStateVersion(b);
  return av[0] > bv[0] || (av[0] === bv[0] && av[1] > bv[1]);
}
function hasStoredUiState(state) {
  return !!(
    state &&
    ((Array.isArray(state.sessions) && state.sessions.length) ||
      (Array.isArray(state.projects) && state.projects.length) ||
      state.active_id)
  );
}
function hasMeaningfulUiState(state) {
  if (!state) return false;
  if (Array.isArray(state.projects) && state.projects.length) return true;
  if (!Array.isArray(state.sessions)) return false;
  return state.sessions.some(s =>
    (Array.isArray(s.messages) && s.messages.length) ||
    (Array.isArray(s.terminalRuns) && s.terminalRuns.length) ||
    (s.title && s.title !== 'New chat')
  );
}
function saveUiStateToServer() {
  fetch('/api/ui_state', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state: currentUiState() }),
  }).catch(() => {});
}
async function restoreUiStateFromServer() {
  try {
    const r = await fetch('/api/ui_state', { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    if (!hasStoredUiState(data.state)) {
      saveUiStateToServer();
      return;
    }
    if ((bootHadMeaningfulUiState || uiStateDirtySinceBoot) && isUiStateNewer(currentUiState(), data.state)) {
      saveUiStateToServer();
      return;
    }
    applyUiState(data.state);
    cacheUiState();
    renderSidebar();
    renderChat();
    updateComposerContext();
    syncProviderUI(currentProviderId());
  } catch {}
}

let sessions = [];
let projects = [];
let activeId = '';
let uiStateUpdatedAt = 0;
let uiStateRevision = 0;
let uiStateDirtySinceBoot = false;

const bootCachedState = cachedUiState();
const bootHadMeaningfulUiState = hasMeaningfulUiState(bootCachedState);
applyUiState(bootCachedState);
cacheUiState();

// ============================ helpers ============================
function activeSession() { return sessions.find(s => s.id === activeId); }
function projectById(id) { return projects.find(p => p.id === id) || null; }
function sessionProject(s) {
  return s && s.projectId ? projectById(s.projectId) : null;
}
function activeProject() {
  return sessionProject(activeSession());
}
function currentProjectPath() {
  const p = activeProject();
  return p ? p.path : '';
}
function currentProviderId() {
  const s = activeSession();
  return s && PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER;
}
// Provider picker UI lives in /assets/provider_ui.js.
function syncProviderUI(providerId) {
  window.CodeyProviderUI.sync(providerId);
}
function applyProviderStatus(providers) {
  window.CodeyProviderUI.applyStatus(providers);
}
function refreshProviderStatus() {
  return window.CodeyProviderUI.refreshStatus();
}

let uiStatePersistTimer = null;
const UI_STATE_PERSIST_DELAY = 400;
function markUiStateDirty() {
  uiStateUpdatedAt = Math.max(Date.now(), uiStateUpdatedAt);
  uiStateRevision += 1;
  uiStateDirtySinceBoot = true;
}
function flushUiState() {
  if (uiStatePersistTimer !== null) {
    clearTimeout(uiStatePersistTimer);
    uiStatePersistTimer = null;
  }
  cacheUiState();
  saveUiStateToServer();
}
function persistActive() {
  markUiStateDirty();
  if (uiStatePersistTimer !== null) return;
  uiStatePersistTimer = setTimeout(() => {
    uiStatePersistTimer = null;
    cacheUiState();
    saveUiStateToServer();
  }, UI_STATE_PERSIST_DELAY);
}
function persistActiveNow() {
  markUiStateDirty();
  flushUiState();
}
function updateComposerContext() {
  const el = $('composer-context');
  const s = activeSession();
  const p = activeProject();
  const proj = p ? p.name : 'Choose folder';
  const disabled = !!runningSessionId;
  const folderDisabled = disabled || !!p || projectPickerBusy;
  const researchActive = !!(s && s.research);
  const pieces = [
    `<button class="ctx-token ctx-folder" id="ctx-folder" ${folderDisabled ? 'disabled' : ''} title="${escapeHtml(p ? p.path : 'Choose folder')}">${escapeHtml(proj)}</button>`,
    `<span class="ctx-sep">·</span>`,
    `<button class="ctx-token ctx-research ${researchActive ? 'active' : ''}" id="ctx-research" ${disabled ? 'disabled' : ''} aria-pressed="${researchActive ? 'true' : 'false'}" title="${researchActive ? 'Research is on for this chat' : 'Research'}">Research</button>`,
  ];
  el.innerHTML = pieces.join('');
  el.title = '';
  syncResearchUI();
}
function syncResearchUI() {
  const btn = $('ctx-research');
  if (!btn) return;
  const s = activeSession();
  const active = !!(s && s.research);
  btn.classList.toggle('active', active);
  btn.disabled = !!runningSessionId;
  btn.title = active ? 'Research is on for this chat' : 'Research';
}
function currentIntentForSession(sessionId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.research) return 'auto';
  return sessionProjectPath(sessionId) ? 'hybrid' : 'research';
}

// ============================ sidebar rendering ============================
function renderSidebar() {
  const list = $('session-list');
  list.innerHTML = '';

  const projLabel = document.createElement('div');
  projLabel.className = 'group-label';
  projLabel.textContent = 'PROJECTS';
  list.appendChild(projLabel);

  if (!projects.length) {
    const empty = document.createElement('div');
    empty.className = 'project-empty';
    empty.textContent = 'No projects';
    list.appendChild(empty);
  }

  for (const p of projects) {
    const node = document.createElement('div');
    node.className = 'project-node';

    const row = document.createElement('div');
    row.className = 'project-row';
    const activeS = activeSession();
    if (activeS && activeS.projectId === p.id) row.classList.add('has-active');
    row.title = p.path;

    const toggle = document.createElement('button');
    toggle.className = 'project-toggle';
    toggle.innerHTML = p.expanded
      ? '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
    toggle.onclick = (e) => {
      e.stopPropagation();
      p.expanded = !p.expanded;
      persistActive();
      renderSidebar();
    };
    row.appendChild(toggle);

    if (p.id === editingProjectId) {
      row.appendChild(renameInputEl(
        p.name || '',
        (val) => commitProjectRename(p.id, val),
        cancelProjectRename,
      ));
    } else {
      const main = document.createElement('div');
      main.className = 'project-main';
      main.textContent = p.name;
      row.appendChild(main);

      row.onclick = () => openProject(p.id);
    }

    const more = document.createElement('button');
    more.className = 'project-more';
    more.title = 'More';
    more.textContent = '⋯';
    more.onclick = (e) => {
      e.stopPropagation();
      openProjectMenu(e.currentTarget, p.id);
    };
    row.appendChild(more);

    node.appendChild(row);

    if (p.expanded) {
      const children = document.createElement('div');
      children.className = 'project-children';
      const projectSessions = sessions.filter(s => s.projectId === p.id);
      if (!projectSessions.length) {
        const empty = document.createElement('div');
        empty.className = 'project-empty';
        empty.textContent = 'No chats';
        children.appendChild(empty);
      } else {
        for (const s of projectSessions) children.appendChild(sessionNode(s));
      }
      node.appendChild(children);
    }
    list.appendChild(node);
  }

  const looseLabel = document.createElement('div');
  looseLabel.className = 'group-label';
  looseLabel.textContent = 'CHATS';
  list.appendChild(looseLabel);
  const loose = sessions.filter(s => !sessionProject(s));
  if (!loose.length) {
    const empty = document.createElement('div');
    empty.className = 'project-empty';
    empty.style.marginLeft = '10px';
    empty.textContent = 'No chats';
    list.appendChild(empty);
  }
  for (const s of loose) list.appendChild(sessionNode(s));
}

function sessionNode(s) {
  const item = document.createElement('div');
  item.className = 'session-item' + (s.id === activeId ? ' active' : '');
  if (s.id === editingSessionId) {
    item.appendChild(renameInputEl(
      s.title || '',
      (val) => commitSessionRename(s.id, val),
      cancelSessionRename,
    ));
    return item;
  }
  item.onclick = (e) => { if (!e.target.closest('button')) switchSession(s.id); };
  const title = document.createElement('span');
  title.className = 'session-title';
  title.textContent = s.title || 'Untitled';
  item.appendChild(title);
  const more = document.createElement('button');
  more.className = 'session-more'; more.textContent = '⋯'; more.title = 'More';
  more.onclick = (e) => { e.stopPropagation(); openSessionMenu(e.currentTarget, s.id); };
  item.appendChild(more);
  return item;
}

// ============================ inline rename & confirm ============================
let editingSessionId = '';
let editingProjectId = '';
let armedDangerTimer = null;
function renameInputEl(value, commit, cancel) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.value = value || '';
  input.maxLength = 80;
  input.setAttribute('aria-label', 'Rename');
  let settled = false;
  const finish = (fn, arg) => {
    if (settled) return;
    settled = true;
    fn(arg);
  };
  input.onmousedown = (e) => e.stopPropagation();
  input.onclick = (e) => e.stopPropagation();
  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(commit, input.value); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(cancel); }
  };
  input.onblur = () => finish(commit, input.value);
  return input;
}
function focusRenameInput() {
  const input = document.querySelector('.rename-input');
  if (input) { input.focus(); input.select(); }
}
function commitSessionRename(id, value) {
  editingSessionId = '';
  const s = sessions.find(x => x.id === id);

function renderChat() {

  if (!s) return;
  const p = activeProject();
  const titleEl = $('sess-title');
  if (p) {
    titleEl.innerHTML = `<span class="crumb-proj">${escapeHtml(p.name)}</span><span class="crumb-sep">/</span><span class="crumb-chat">${escapeHtml(s.title || 'New chat')}</span>`;

  }

    chat.innerHTML = `
      <div class="welcome">
        <h1>Codey</h1>

function statusRow(prefix, text, opts = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + (opts.kind || '');
  const row = document.createElement('div');
  row.className = 'status-row' + (opts.err ? ' err' : '');
  const pre = document.createElement('span');
  pre.className = 'sr-prefix';
  pre.textContent = prefix;
  const txt = document.createElement('span');
  txt.className = 'sr-text';
  let body = text || '';
  if (opts.err) body = body.replace(/^ERROR:\s*/i, '');
  txt.textContent = body;
  row.append(pre, txt);
  const actions = Array.isArray(opts.actions) ? opts.actions.slice() : [];
  if (opts.action) actions.push(opts.action);
  for (const action of actions) {
    const btn = document.createElement('button');
    btn.className = 'link-btn';
    btn.textContent = action.label;
    btn.disabled = !!action.disabled;
    btn.onclick = action.onclick;
    row.appendChild(btn);
  }
  div.appendChild(row);
  if (opts.copyText) addMessageCopyButton(div, opts.copyText);
  return div;
}

function messageCopyText(m) {
  return m && typeof m.text === 'string' ? m.text : '';
}
// Markdown / copy / tool-line helpers live in /assets/render.js (window.CodeyRender).
const copyText = window.CodeyRender.copyText;
const addMessageCopyButton = window.CodeyRender.addMessageCopyButton;
const renderMarkdown = window.CodeyRender.renderMarkdown;
const FOLDABLE_TOOL_KINDS = window.CodeyRender.FOLDABLE_TOOL_KINDS;
const standaloneToolEl = window.CodeyRender.standaloneToolEl;
const appendOrFoldTool = window.CodeyRender.appendOrFoldTool;

function appendMessageNode(chat, m) {
  if (m.type === 'user') {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-label">You</div><div class="body"></div>`;
    div.querySelector('.body').textContent = m.text;
    addMessageCopyButton(div, messageCopyText(m));
    chat.appendChild(div);
  } else if (m.type === 'turn') {
    const div = document.createElement('div');
    div.className = 'turn-divider';
    const label = document.createElement('span');
    const note = (m.note || '').toString().trim();
    label.textContent = `Turn ${m.n}${note ? ` ${note}` : ''}`;
    const line = document.createElement('span');
    line.className = 'line';
    div.appendChild(label);
    div.appendChild(line);
    chat.appendChild(div);
  } else if (m.type === 'asst') {
    const div = document.createElement('div');
    div.className = 'msg asst';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Codey';
    div.appendChild(label);
    const body = document.createElement('div');
    body.className = 'body md';
    renderMarkdown(body, m.text);
    div.appendChild(body);
    if (m.text.split('\n').length > 6 || m.text.length > 400) {
      const toggle = document.createElement('div');
      toggle.className = 'toggle'; toggle.textContent = 'Collapse';
      toggle.onclick = () => {
        const collapsed = body.classList.toggle('collapsed');
        toggle.textContent = collapsed ? 'Expand' : 'Collapse';
      };
      div.appendChild(toggle);
    }
    addMessageCopyButton(div, messageCopyText(m));
    chat.appendChild(div);
  } else if (m.type === 'tool') {
    if (FOLDABLE_TOOL_KINDS.has(m.kind) && !m.error) {
      appendOrFoldTool(chat, m);
    } else {
      chat.appendChild(standaloneToolEl(m));
    }
  } else if (m.type === 'tool_pending') {
    chat.appendChild(standaloneToolEl(m));
  } else if (m.type === 'research_done') {
    const actions = window.CodeyRunDetails.actionsForMessage(m, [
      { label: 'Open', onclick: () => openResearchDrawer(m.sessionId || activeId) },
      { label: 'Use in Project', onclick: () => attachCurrentChatToPickedProject({ sendDraft: false }) },
    ]);
    chat.appendChild(statusRow('Research', m.text || 'Research saved', {
      kind: 'done',
      actions,
      copyText: m.text || '',
    }));
  } else if (m.type === 'done') {
    const action = m.project && m.changed ? {
      label: 'View diff',
      onclick: () => openChangesDrawer(m.project),
    } : null;
    const text = m.text || 'Task complete';
    chat.appendChild(statusRow('Done', text, {
      kind: 'done',
      actions: window.CodeyRunDetails.actionsForMessage(m, [action]),
      copyText: text,
    }));
  } else if (m.type === 'review') {
    const text = m.text || 'Complete';
    chat.appendChild(statusRow('Review', text, {
      kind: 'review',
      copyText: text,
    }));
  } else if (m.type === 'changes') {
    const div = document.createElement('div');
    div.className = 'msg changes';
    const head = document.createElement('div');
    head.className = 'changes-head-row';
    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = 'Changes';
    const count = document.createElement('span');
    count.className = 'changes-count';
    const n = m.count || 0;
    count.textContent = `${n} file${n === 1 ? '' : 's'}`;
    const view = document.createElement('button');
    view.className = 'link-btn';
    view.textContent = 'View diff';
    view.onclick = () => openChangesDrawer(m.project || currentProjectPath());
    head.append(label, count, view);
    div.appendChild(head);
    const files = Array.isArray(m.files) ? m.files : [];
    if (files.length) {
      const list = document.createElement('div');
      list.className = 'changes-files';
      for (const f of files) {
        const row = document.createElement('div');
        row.className = 'changes-file';
        row.innerHTML = `<span class="cf-status">${escapeHtml(f.status || 'M')}</span><span class="cf-path">${escapeHtml(f.path || '')}</span><span class="cf-stat">+${f.additions || 0} -${f.deletions || 0}</span>`;
        list.appendChild(row);
      }
      div.appendChild(list);
    }
    chat.appendChild(div);
  } else if (m.type === 'shell_request') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const card = document.createElement('div');
    card.className = 'shell-card';
    const title = document.createElement('div');
    title.className = 'sc-title';
    title.textContent = 'Approval required';
    const meta = document.createElement('div');
    meta.className = 'sc-meta';
    meta.textContent = m.cwd ? `Runs in ${m.cwd}` : 'Runs in .';
    const riskTitle = m.riskTitle || m.riskLabel || '';
    const riskDetail = m.riskDetail || '';
    const note = document.createElement('div');
    note.className = 'sc-note';
    note.textContent = riskTitle || riskDetail
      ? `${riskTitle || 'Shell command'}${riskDetail ? ` · ${riskDetail}` : ''}`
      : '';
    const cmd = document.createElement('div');
    cmd.className = 'shell-command';
    cmd.textContent = '$ ' + (m.command || '');
    const error = document.createElement('div');
    error.className = 'sc-error';
    error.hidden = true;
    const actions = document.createElement('div');
    actions.className = 'shell-actions';
    const deny = document.createElement('button');
    deny.className = 'text-btn';
    deny.textContent = 'Deny';
    const approve = document.createElement('button');
    approve.className = 'text-btn primary';
    approve.textContent = 'Allow';
    approve.onclick = () => approveCommand(m.id, true, approve, deny, error);
    deny.onclick = () => approveCommand(m.id, false, approve, deny, error);
    actions.append(deny, approve);
    card.append(title, meta);
    if (note.textContent) card.appendChild(note);
    card.append(cmd, error, actions);
    div.appendChild(card);
    chat.appendChild(div);
  } else if (m.type === 'shell_result') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const out = document.createElement('div');
    out.className = 'shell-output';
    const exit = m.exitCode === null || m.exitCode === undefined ? '' : `exit ${m.exitCode}\n`;
    out.textContent = `${m.approved ? 'Executed' : 'Denied'}\n$ ${m.command || ''}\n${exit}${m.output || ''}`;
    div.appendChild(out);
    chat.appendChild(div);
  } else if (m.type === 'limit') {
    chat.appendChild(statusRow('Limit', m.text || 'Turn limit reached', {
      actions: window.CodeyRunDetails.actionsForMessage(m, [
        { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
      ]),
    }));
  } else if (m.type === 'pause') {
    chat.appendChild(statusRow('Paused', m.text || 'No progress for several turns', {
      actions: window.CodeyRunDetails.actionsForMessage(m, [
        { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
      ]),
    }));
  } else if (m.type === 'teach') {
    chat.appendChild(statusRow('Paused', m.text || 'Click the control in the model page', {
      action: { label: 'Resume', disabled: false, onclick: () => resumeTeaching(m.id, m.sessionId || activeId) },
    }));
  } else if (m.type === 'err') {
    chat.appendChild(statusRow('Error', m.text || '', {
      err: true,
      actions: window.CodeyRunDetails.actionsForMessage(m, [
        { label: 'Retry', disabled: !!runningSessionId, onclick: () => retryTask(m.sessionId || activeId) },
      ]),
    }));
  } else if (m.type === 'info') {
    const div = document.createElement('div');
    div.className = 'info-line';
    div.textContent = m.text;
    chat.appendChild(div);
  }
}

// ============================ session ops ============================
function switchSession(id) {
  activeId = id; persistActiveNow(); handleLocalContextScopeChanged(); renderSidebar(); renderChat();

function openProject(projectId) {
  const p = projectById(projectId);
  if (!p) return;
  p.expanded = true;
  const first = sessions.find(s => s.projectId === projectId);
  if (first) switchSession(first.id);
  else newSession(projectId);
}
function newSession(projectId = null) {
  const provider = currentProviderId();
  const s = defaultSession(projectId, provider);
  sessions.unshift(s); activeId = s.id; persistActiveNow(); handleLocalContextScopeChanged(); renderSidebar(); renderChat();
  fetch('/api/new_chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },

  }).catch(() => {});
}
async function forgetSessionState(id) {
  try {
    const response = await fetch('/api/new_chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: id }),
    });
    return response.ok;
  } catch {
    return false;
  }
}
async function deleteSession(id) {
  if (!await forgetSessionState(id)) return;
  const fallbackProvider = currentProviderId();
  sessions = sessions.filter(s => s.id !== id);
  if (!sessions.length) {
    const s = defaultSession(null, fallbackProvider);
    sessions = [s];
  }
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActiveNow(); handleLocalContextScopeChanged(); renderSidebar(); renderChat();
}
function renameSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  editingProjectId = '';
  editingSessionId = id;
  if (s.projectId) { const p = projectById(s.projectId); if (p) p.expanded = true; }
  renderSidebar();

}
async function clearMessages(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  if (!await forgetSessionState(id)) return;
  s.messages = [];
  s.terminalRuns = [];
  s.researchRuns = [];
  persistActiveNow();
  if (id === activeId) {
    closeLocalContextDrawer();
    renderChat();
  }
}
function renameProject(id) {
  const p = projectById(id);
  if (!p) return;
  editingSessionId = '';
  editingProjectId = id;
  renderSidebar();
  focusRenameInput();
}
async function deleteProject(id) {
  const p = projectById(id);
  if (!p) return;
  const cleared = await Promise.all(
    sessions.filter(s => s.projectId === id).map(s => forgetSessionState(s.id))
  );
  if (!cleared.every(Boolean)) return;
  projects = projects.filter(x => x.id !== id);
  sessions = sessions.filter(s => s.projectId !== id);
  if (!sessions.length) sessions = [defaultSession(null, DEFAULT_PROVIDER)];
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActiveNow(); handleLocalContextScopeChanged(); renderSidebar(); renderChat();
}
function ensureProject(path, name) {
  const existing = projects.find(p => pathKey(p.path) === pathKey(path));
  if (existing) {
    existing.expanded = true;
    return existing;
  }
  const p = {
    id: uid(),
    name: name || pathName(path),
    path,
    expanded: true,
    createdAt: Date.now(),
  };
  projects.unshift(p);
  persistActive();
  return p;
}
let projectPickerBusy = false;
async function pickProjectPath(mode = 'open', initial = '') {
  if (projectPickerBusy) return null;
  projectPickerBusy = true;
  $('btn-add-project').disabled = true;
  updateComposerContext();
  try {
    const r = await fetch('/api/pick_folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, initial }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      setStatus('Could not add project', 'err');
      return null;
    }
    if (!data.ok || !data.path) return null;
    return data;
  } finally {
    projectPickerBusy = false;
    $('btn-add-project').disabled = false;
    updateComposerContext();
  }
}
function attachSessionToProject(projectId, sessionId = activeId) {
  const s = sessions.find(x => x.id === sessionId);
  const p = projectById(projectId);
  if (!s || !p || sessionProject(s)) return false;
  s.projectId = p.id;
  s.research = false;
  p.expanded = true;
  persistActiveNow();
  if (sessionId === activeId) handleLocalContextScopeChanged();
  renderSidebar();
  if (sessionId === activeId) renderChat();
  else updateComposerContext();
  return true;
}
async function pickProject() {
  const s = activeSession();
  const shouldAttach = !!s && !sessionProject(s);
  const data = await pickProjectPath(shouldAttach ? 'new' : 'open', currentProjectPath());
  if (!data) return;
  const p = ensureProject(data.path, data.name);
  if (shouldAttach) attachSessionToProject(p.id, s.id);
  else newSession(p.id);
}

async function attachCurrentChatToPickedProject({ sendDraft = false } = {}) {
  if (runningSessionId) return;
  const sid = activeId;
  const s = sessions.find(x => x.id === sid);
  if (!s || sessionProject(s)) return;
  const draft = $('task').value.trim();
  const provider = PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER;
  const data = await pickProjectPath('new', currentProjectPath());
  if (!data) return;
  const p = ensureProject(data.path, data.name);
  if (!attachSessionToProject(p.id, sid)) return;
  if (!sendDraft || !draft) return;
  await sendTaskFromSession(sid, draft, provider, () => clearDraftIfUnchanged(sid, draft));
}

function pushMsgToSession(sid, m) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  const wasEmpty = s.messages.length === 0;
  s.messages.push(m);
  if (s.title === 'New chat' && m.type === 'user' && m.text) {
    s.title = m.text.slice(0, 28) + (m.text.length > 28 ? '…' : '');
    persistActiveNow();
    renderSidebar();
    if (sid === activeId) renderChat();
    return true;
  }
  persistActiveNow();
  if (sid === activeId) {
    if (wasEmpty) renderChat();
    else {
      appendMessageNode($('chat'), m);
      scrollChat();
    }
  }
  return true;
}

function openMenuAt(menu, anchor) {

  menu.classList.add('open');

  let left = rect.right - mr.width;
  if (left < 8) left = rect.left;
  let top = rect.bottom + 4;
  if (top + mr.height > window.innerHeight - 8) top = rect.top - mr.height - 4;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
}

// ============================ SSE event ingestion ============================
let runningSessionId = null;
let runningRunId = null;
let turnCounter = 0;
let activeChangesProject = '';
let lastChangesData = null;
let reconnectTimer = null;
let reconcilePromise = null;
let bufferedServerEvents = [];

function setStatus(text, kind) {
  const el = $('status');
  el.className = 'status ' + (kind || '');
  el.innerHTML = '';
  if (kind === 'run' || kind === 'warn') {
    const sp = document.createElement('span');
    sp.className = 'spinner';
    el.appendChild(sp);
  } else if (kind === 'err') {
    const d = document.createElement('span');
    d.className = 'status-dot err';
    el.appendChild(d);
  }
  if (text && (kind === 'run' || kind === 'warn' || kind === 'err')) {
    const t = document.createElement('span');
    t.className = 'status-text';
    t.textContent = text;
    el.appendChild(t);
  }
}

function handleServerEvent(data) {
  const runId = (data.run_id || '').toString();
  const sid = data.session_id;
  const mayOutliveRun = ['task_start', 'task_done', 'shell_request', 'shell_result', 'teach_request', 'resync_required'];
  if (runId && runningRunId && !mayOutliveRun.includes(data.type) && runId !== runningRunId) return;
  // Server dropped queued events for this client: re-pull authoritative state.
  if (data.type === 'resync_required') { reconcileRunState(); refreshProviderStatus(); return; }
  if (data.type === 'status') {
    setStatus(data.status === 'connecting' ? 'Connecting to browser…' : data.status, 'warn');
    return;
  }
  if (data.type === 'providers') {
    applyProviderStatus(data.providers);
    return;
  }
  if (data.type === 'turn') {
    addToSession(sid, {
      type: 'turn',
      n: data.turn || 0,
      note: (data.note || '').toString(),
      runId,
    });
    return;
  }
  if (data.type === 'tool_started') {
    const rawToolId = (data.tool_id || '').toString();
    const toolKey = rawToolId ? `${runId}:${rawToolId}` : '';
    const s = sessions.find(x => x.id === sid);
    if (s && toolKey && s.messages.some(item => item.toolKey === toolKey)) return;
    addToSession(sid, {
      type: 'tool_pending',
      toolKey,
      eventKey: toolKey ? `tool:${toolKey}:start` : '',
      kind: data.kind || '',
      path: data.path || '',
      activity: (data.activity || '').toString().slice(0, 200),
      pending: true,
      runId,
    });
    return;
  }
  if (data.type === 'tool') {
    const rawToolId = (data.tool_id || '').toString();
    const toolKey = rawToolId ? `${runId}:${rawToolId}` : '';
    const toolStatus = (data.status || (data.ok === false ? 'error' : 'ok')).toString();
    const message = {
      type: 'tool',
      toolKey,
      eventKey: toolKey ? `tool:${toolKey}:final` : '',
      kind: data.kind || '',
      path: data.path || '',
      result: (data.result || '').toString().slice(0, 200),
      status: toolStatus,
      error: toolStatus === 'error',
      runId,
    };
    if (
      toolKey &&
      replaceSessionMessage(
        sid,
        item => item.type === 'tool_pending' && item.toolKey === toolKey,
        message,
      )
    ) return;
    addToSession(sid, message);
    return;
  }
  if (data.type === 'info') {
    if (data.text) addToSession(sid, { type: 'info', text: data.text, runId });
    return;
  }
  if (data.type === 'teach_request') {
    removeTeachMessage(sid);
    addToSession(sid, {
      type: 'teach', id: data.id, text: data.text, sessionId: sid, runId,
      eventKey: `teach:${data.id}`,
    });
    return;
  }
  if (data.type === 'task_start') {
    runningRunId = runId;
    runningSessionId = sid;
    turnCounter = 0;
    setStatus('Running', 'run');
    $('send').disabled = true;
    $('provider-button').disabled = true;
    updateSend();
    updateComposerContext();
    return;
  }
  if (data.type === 'task_done') {
    const current = !runId || runId === runningRunId;
    if (current) {
      runningRunId = null;
      runningSessionId = null;
      setStatus('', 'ok');
      $('provider-button').disabled = false;
      updateSend();
      updateComposerContext();
    }
    if (!markTerminalRun(sid, runId)) return;
    const summary = (data.summary || '').toString();
    const reason = (data.stop_reason || 'done').toString();
    const terminalKey = runId ? `terminal:${runId}` : '';
    const answerKey = terminalKey ? `${terminalKey}:answer` : '';
    const receiptKey = terminalKey ? `${terminalKey}:receipt` : '';
    const project = sessionProjectPath(sid);
    let shownReceipt = false;
    const researchRun = data.research ? recordResearchRun(sid, runId, data.research, data.receipt) : null;
    if (reason === 'error' && data.provider_failure && data.provider_failure.action === 'connect') {
      if (data.provider && PROVIDERS.includes(data.provider)) {
        applyProviderStatus([{ id: data.provider, available: false }]);
      }
      addSendError(sid, terminalKey, runId);
      flushUiState();
      return;
    }
    if (summary.startsWith('ERROR:')) {
      addToSession(sid, { type: 'err', text: summary.replace(/^ERROR:\s*/i, ''), sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'max_turns') {
      const turns = data.turns || data.max_turns || 0;
      const label = turns ? `Reached turn limit (${turns})` : 'Reached turn limit';
      addToSession(sid, { type: 'limit', text: label, sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'no_progress') {
      addToSession(sid, { type: 'pause', text: 'Paused after several turns without new file writes', sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'approval') {
      // shell approval card is emitted separately
    } else if (reason === 'stopped') {
      const turns = data.turns || 0;
      const label = turns ? `Stopped after ${turns} turn${turns === 1 ? '' : 's'}` : 'Stopped';
      addToSession(sid, { type: 'pause', text: label, sessionId: sid, runId, eventKey: terminalKey });
    } else if (reason === 'done') {
      if (data.mode === 'research') {
        if (summary) addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
        if (receiptSummary(data.receipt)) {
          addToSession(sid, {
            type: 'research_done',
            text: receiptSummary(data.receipt),
            runId,
            sessionId: sid,
            eventKey: receiptKey,
          });
          shownReceipt = true;
        }
      } else if (data.mode === 'chat') {
        if (summary) addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
      } else if (project && summary) {
        addToSession(sid, { type: 'asst', text: summary, runId, eventKey: answerKey });
      }
      const changes = data.changes || {};
      const changed = !!data.changed;
      const changedCount = receiptChangedCount(data.receipt, changes);
      if (changed && changedCount > 0 && receiptSummary(data.receipt)) {
        addToSession(sid, {
          type: 'done',
          text: receiptSummary(data.receipt),
          project: changes.project || project,
          changed: true,
          runId,
          sessionId: sid,
          eventKey: receiptKey,
        });
        shownReceipt = true;
      } else if (!project && summary && data.mode !== 'research' && data.mode !== 'chat') {
        addToSession(sid, { type: 'done', text: summary, sessionId: sid, runId, eventKey: terminalKey });
      }
    } else if (summary) {
      addToSession(sid, { type: 'done', text: summary, sessionId: sid, runId, eventKey: terminalKey });
    }
    if (reason !== 'error' && reason !== 'approval' && data.changed && !shownReceipt) maybeAddChangesSummary(sid, terminalKey, runId);
    flushUiState();
    return;
  }
  if (data.type === 'shell_request') {
    addToSession(sid, {
      type: 'shell_request',
      id: data.id,
      command: data.command,
      cwd: data.cwd,
      project: data.project,
      riskLabel: data.risk_label,
      riskTitle: data.risk_title,
      riskDetail: data.risk_detail,
      runId,
      eventKey: `shell:${data.id}`,
    });
    return;
  }
  if (data.type === 'shell_result') {
    removeShellRequest(sid, data.id);
    addToSession(sid, {
      type: 'shell_result',
      id: data.id,
      approved: !!data.approved,
      command: data.command,
      cwd: data.cwd,
      output: data.output,
      exitCode: data.exit_code,
      runId,
      eventKey: `shell-result:${data.id}`,
    });
    return;
  }
  if (data.type === 'reply') {
    const answerKey = runId ? `terminal:${runId}:answer` : '';
    if (data.text) addToSession(sid, { type: 'asst', text: data.text, runId, eventKey: answerKey });
    return;
  }
  if (data.type === 'review') {
    if (data.text) addToSession(sid, { type: 'review', text: data.text, sessionId: sid, runId });
    return;
  }
}

function clearReconnectTimer() {
  if (reconnectTimer === null) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
}

function scheduleReconnectStatus() {
  if (reconnectTimer !== null) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (evtSrc && evtSrc.readyState !== EventSource.OPEN) setStatus('Reconnecting…', 'warn');
  }, 5000);
}

function normalizeResearchRunArtifact(runId, research, receipt) {
  return {
    runId,
    synthesisId: (research.synthesis_id || '').toString(),
    notesCreated: Array.isArray(research.notes_created) ? research.notes_created.map(String) : [],
    notesUpdated: Array.isArray(research.notes_updated) ? research.notes_updated.map(String) : [],
    sourceUrls: Array.isArray(research.source_urls) ? research.source_urls.map(String) : [],
    sourcesRead: Number(research.sources_read || 0),
    queries: Array.isArray(research.queries) ? research.queries.map(String) : [],
    searchResults: Array.isArray(research.search_results) ? research.search_results : [],
    openedSources: Array.isArray(research.opened_sources) ? research.opened_sources : [],
    coverage: research.coverage && typeof research.coverage === 'object' ? research.coverage : {},
    citationMap: Array.isArray(research.citation_map) ? research.citation_map : [],
    evidenceItems: Array.isArray(research.evidence_items) ? research.evidence_items : [],
    counterpoints: Array.isArray(research.counterpoints) ? research.counterpoints.map(String) : [],
    qualityWarnings: Array.isArray(research.quality_warnings) ? research.quality_warnings.map(String) : [],
    receipt: receiptSummary(receipt),
    restoreable: true,
    createdAt: Date.now(),
  };
}

function recordResearchRun(sessionId, runId, research, receipt) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return null;
  const item = normalizeResearchRunArtifact(runId, research || {}, receipt || {});
  researchDrawerTab = 'evidence';
  researchNoteFocusId = '';
  s.researchRuns = Array.isArray(s.researchRuns)
    ? s.researchRuns.filter(run => run.runId !== runId)
    : [];
  s.researchRuns.push(item);
  s.researchRuns = s.researchRuns.slice(-32);
  invalidateResearchNoteCache(noteIdsForResearchRun(item));
  persistActive();
  return item;
}

function currentResearchRun(sessionId = activeId) {
  const s = sessions.find(x => x.id === sessionId);
  const runs = s && Array.isArray(s.researchRuns) ? s.researchRuns : [];
  return runs.length ? runs[runs.length - 1] : null;
}

async function restoreResearchRun() {
  const run = currentResearchRun();
  if (!run || !run.runId) return;
  $('research-restore').disabled = true;
  try {
    const r = await fetch('/api/research/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: run.runId }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok || !data.ok) {
      $('research-subtitle').textContent = data.error || 'Restore failed';
      if (run && /not found/i.test(data.error || '')) {
        run.restoreable = false;
        persistActiveNow();
        renderResearchDrawer(activeId);
      }
      return;
    }
    $('research-subtitle').textContent = `${(data.restored || []).length} restored`;
    invalidateResearchNoteCache(noteIdsForResearchRun(run));
    const s = activeSession();
    if (s && Array.isArray(s.researchRuns)) {
      s.researchRuns = s.researchRuns.filter(item => item.runId !== run.runId);
      persistActiveNow();
    }
    addToSession(activeId, {
      type: 'done',
      text: `Research restored: ${(data.restored || []).length} files`,
      eventKey: `research-restore:${run.runId}`,
    });
    renderResearchDrawer(activeId);
  } finally {
    const current = currentResearchRun();
    $('research-restore').disabled = !current || !current.restoreable;
  }
}

function markResearchRestoreAvailability(runIds) {
  const available = new Set(Array.isArray(runIds) ? runIds.map(String) : []);
  let changed = false;
  for (const s of sessions) {
    const runs = Array.isArray(s.researchRuns) ? s.researchRuns : [];
    for (const run of runs) {
      const next = available.has(String(run.runId || ''));
      if (!!run.restoreable !== next) {
        run.restoreable = next;
        changed = true;
      }
    }
  }
  if (changed) persistActive();
  if ($('research-drawer').classList.contains('open')) renderResearchDrawer(activeId);
}

function applyRunState(data) {
  if (data.last_shell_result) handleServerEvent(data.last_shell_result);
  if (data.last_terminal_event) handleServerEvent(data.last_terminal_event);
  if (data.pending_event) handleServerEvent(data.pending_event);

  const busy = !!data.busy && !!data.run_id;
  runningRunId = busy ? data.run_id : null;
  runningSessionId = busy ? data.session_id : null;
  if (busy) {
    const connecting = data.run_status === 'connecting';
    setStatus(connecting ? 'Connecting to browser…' : 'Running', connecting ? 'warn' : 'run');
  } else {
    setStatus('', 'ok');
  }
  $('provider-button').disabled = busy;
  markResearchRestoreAvailability(data.research_restore_runs || []);
  updateSend();
  updateComposerContext();
}

function reconcileRunState() {
  if (reconcilePromise) return reconcilePromise;
  bufferedServerEvents = [];
  reconcilePromise = (async () => {
    try {
      const response = await fetch('/api/state', { cache: 'no-store' });
      if (!response.ok) throw new Error('state unavailable');
      applyRunState(await response.json());
      clearReconnectTimer();
    } catch {
      scheduleReconnectStatus();
    } finally {
      const events = bufferedServerEvents;
      bufferedServerEvents = [];
      reconcilePromise = null;
      for (const event of events) handleServerEvent(event);
    }
  })();
  return reconcilePromise;
}

function ingestServerEvent(data) {
  if (reconcilePromise) {
    bufferedServerEvents.push(data);
    return;
  }
  handleServerEvent(data);
}

async function acceptRunResponse(response, sessionId) {
  const data = await response.json();
  runningRunId = data.run_id || null;
  runningSessionId = runningRunId ? sessionId : null;
  if (runningRunId) {
    setStatus('Running', 'run');
    $('provider-button').disabled = true;
    updateSend();
    updateComposerContext();
  }
  await reconcileRunState();
}

let evtSrc = null;
function connectEvents() {
  if (evtSrc) return;
  evtSrc = new EventSource('/api/events');
  evtSrc.onmessage = (e) => {
    let data; try { data = JSON.parse(e.data); } catch { return; }
    if (data.type === 'hello') {
      clearReconnectTimer();
      reconcileRunState();
      refreshProviderStatus();
      return;
    }
    ingestServerEvent(data);
  };
  evtSrc.onerror = scheduleReconnectStatus;
}

function addToSession(sid, m) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (m.eventKey && s.messages.some(item => item.eventKey === m.eventKey)) return false;
  if ((m.type === 'limit' || m.type === 'pause' || m.type === 'teach' || m.type === 'err') && !m.sessionId) m.sessionId = sid;
  s.messages.push(m);
  persistActive();
  if (sid === activeId) { appendMessageNode($('chat'), m); scrollChat(); }
  return true;
}

function replaceSessionMessage(sid, predicate, message) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (message.eventKey && s.messages.some(item => item.eventKey === message.eventKey)) return false;
  const index = s.messages.findIndex(predicate);
  if (index < 0) return false;
  s.messages[index] = message;
  persistActive();
  if (sid === activeId) { renderChat(); scrollChat(); }
  return true;
}

function markTerminalRun(sid, runId) {
  if (!runId) return true;
  const s = sessions.find(x => x.id === sid);
  if (!s) return false;
  if (s.terminalRuns.includes(runId)) return false;
  s.terminalRuns = [...s.terminalRuns, runId].slice(-32);
  persistActive();
  return true;
}

function removeTeachMessage(sessionId, teachId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const before = s.messages.length;
  s.messages = s.messages.filter(m => !(m.type === 'teach' && (!teachId || m.id === teachId)));
  if (s.messages.length !== before) {
    persistActive();
    if (sessionId === activeId) renderChat();
  }
}

function removeShellRequest(sessionId, approvalId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const before = s.messages.length;
  s.messages = s.messages.filter(m => !(m.type === 'shell_request' && m.id === approvalId));
  if (s.messages.length !== before) {
    persistActive();
    if (sessionId === activeId) renderChat();
  }
}

async function sendTaskFromSession(sessionId, task, providerId = '', onSendStarted = null) {
  const text = String(task || '').trim();
  if (!text || runningSessionId) return false;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return false;
  const provider = PROVIDERS.includes(providerId)
    ? providerId
    : (PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER);
  if (typeof onSendStarted === 'function') onSendStarted();
  pushMsgToSession(sessionId, { type: 'user', text });
  const project = sessionProjectPath(sessionId);
  const intent = currentIntentForSession(sessionId);
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, project, task: text, provider, intent }),
  });
  if (r.status === 409) { addSendError(sessionId); return true; }
  if (!r.ok) {
    addSendError(sessionId);
    return true;
  }
  await acceptRunResponse(r, sessionId);
  return true;
}

$('send').onclick = async () => {
  const sessionId = activeId;
  const task = $('task').value.trim();
  const provider = currentProviderId();
  if (!task) return;
  await sendTaskFromSession(sessionId, task, provider, () => clearDraftIfUnchanged(sessionId, task));
};
async function continueTask(sessionId) {
  if (runningSessionId) return;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const p = sessionProject(s);
  if (!p) {
    addToSession(sessionId, { type: 'err', text: 'Only project tasks can be continued; plain chats have no tool loop.', sessionId });
    return;
  }
  addToSession(sessionId, { type: 'info', text: 'continue task' });
  const task = [
    'Continue the unfinished task in this same conversation.',
    'Use the existing project context and finish the original user request.',
    'If the work is complete, reply with a JSON done tool call.'
  ].join(' ');
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: sessionId,
      project: p.path,
      task,
      continue_task: true,
      provider: s.provider || DEFAULT_PROVIDER,
      intent: 'project',
    }),
  });
  if (r.status === 409 || !r.ok) {
    addSendError(sessionId);
    return;
  }
  await acceptRunResponse(r, sessionId);
}
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
$('changes-close').onclick = closeChangesDrawer;
$('research-close').onclick = closeResearchDrawer;
$('research-restore').onclick = restoreResearchRun;
$('research-use-project').onclick = () => attachCurrentChatToPickedProject({ sendDraft: false });
$('changes-refresh').onclick = () => {
  if (activeChangesProject) loadChangesDrawer(activeChangesProject);
};
$('changes-restore').onclick = async () => {
  if (!activeChangesProject || !lastChangesData || lastChangesData.mode === 'git') return;
  $('changes-restore').disabled = true;
  $('changes-restore').textContent = 'Restoring';
  try {
    const data = await restoreChanges(activeChangesProject);
    if (!data.ok) {
      const detail = data.conflicts && data.conflicts.length
        ? `Conflict: ${data.conflicts.join(', ')}`
        : (data.error || 'Restore failed');
      $('changes-subtitle').textContent = detail;
      $('changes-restore').disabled = false;
      return;
    }
    $('changes-restore').textContent = 'Restored';
    await loadChangesDrawer(activeChangesProject);
    setTimeout(() => { $('changes-restore').textContent = 'Restore'; }, 1200);
  } catch (err) {
    $('changes-subtitle').textContent = String(err);
  } finally {
    if ($('changes-restore').textContent !== 'Restored') $('changes-restore').textContent = 'Restore';
  }
};
$('changes-copy').onclick = async () => {
  const diff = lastChangesData && lastChangesData.diff ? lastChangesData.diff : '';
  if (!diff) return;
  try {
    await navigator.clipboard.writeText(diff);
    $('changes-copy').textContent = 'Copied';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  } catch {
    $('changes-copy').textContent = 'Failed';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  }
};
$('btn-new-chat').onclick = () => {
  const p = activeProject();
  newSession(p ? p.id : null);
};
$('btn-add-project').onclick = pickProject;
$('toggle-sidebar').onclick = () => {
  document.body.classList.add('sidebar-collapsed');
  $('show-sidebar').style.display = '';
};
$('show-sidebar').onclick = () => {
  document.body.classList.remove('sidebar-collapsed');
  $('show-sidebar').style.display = 'none';
};
$('topbar-more').onclick = (e) => {
  e.stopPropagation();
  openTopMenu(e.currentTarget);
};

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const p = activeProject();
    newSession(p ? p.id : null);
  }
});
window.addEventListener('pagehide', () => {
  if (uiStatePersistTimer !== null) {
    clearTimeout(uiStatePersistTimer);
    uiStatePersistTimer = null;
  }
  cacheUiState();
  const payload = JSON.stringify({ state: currentUiState() });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/ui_state', new Blob([payload], { type: 'application/json' }));
      return;
    }
  } catch {}
  saveUiStateToServer();
});

// ============================ boot ============================
async function boot() {
  window.CodeyResearchDrawer.init({
    $,
    getActiveId: () => activeId,
    getCurrentRun: currentResearchRun,
    getResearchGraphDepth: () => researchGraphDepth,
    setResearchGraphDepth: value => { researchGraphDepth = value; },
    getResearchNoteFocusId: () => researchNoteFocusId,
    setResearchNoteFocusId: value => { researchNoteFocusId = value; },
    getResearchDrawerTab: () => researchDrawerTab,
    setResearchDrawerTab: value => { researchDrawerTab = value; },
    copyText,
    closeOtherDrawers,
  });
  window.CodeyChangesDrawer.init({
    $,
    fetchChanges,
    escapeHtml,
    setActiveProject: value => { activeChangesProject = value; },
    setLastData: value => { lastChangesData = value; },
    closeOtherDrawers,
  });
  window.CodeyLocalContextDrawer.init({
    $,
    getActiveId: () => activeId,
    currentProjectPath: () => currentProjectPath(),
    openMenuAt,
    closeAllMenus,
    closeOtherDrawers,
    copyText,
  });
  window.CodeyRunDetails.init({ getActiveId: () => activeId });
  window.CodeyProviderUI.init({
    $,
    escapeHtml,
    PROVIDERS,
    PROVIDER_LABELS,
    DEFAULT_PROVIDER,
    currentProviderId,
    setActiveProvider,
  });
  renderSidebar();
  renderChat();
  resizeTask();
  updateSend();
  syncProviderUI(currentProviderId());
  refreshProviderStatus();
  $('provider-button').disabled = false;
  syncResearchUI();
  setStatus('', 'ok');
  await restoreUiStateFromServer();
  connectEvents();
}
boot();
</script>
</body>
</html>
