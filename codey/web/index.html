<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/icon.ico" type="image/x-icon" />
<title>Codey</title>
<style>
  :root {
    --bg:        #181818;
    --bg-2:      #1c1c1c;
    --panel:     #202020;
    --panel-2:   #262626;
    --hover:     #2a2a2a;
    --active:    #2f2f2f;
    --border:    #2a2a2a;
    --border-2:  #232323;
    --text:      #e6e6e6;
    --text-dim:  #a0a0a0;
    --muted:     #6b6b6b;
    --faint:     #4a4a4a;
    --ok-dot:    #4ec9b0;
    --err-text:  #d28a8a;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Cascadia Code', 'SF Mono', 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    display: grid;
    grid-template-columns: auto 1fr;
    overflow: hidden;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================== sidebar ============================== */
  aside {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width .18s ease, min-width .18s ease;
    min-width: 260px;
  }
  body.sidebar-collapsed aside { width: 0; min-width: 0; overflow: hidden; }
  .sidebar-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px;
  }
  .sidebar-spacer { flex: 1; min-width: 0; }
  .btn-icon {
    background: transparent; border: 0; color: var(--text-dim); cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .btn-icon:hover { background: var(--hover); color: var(--text); }
  .btn-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .sidebar-actions {
    padding: 0 6px 8px;
    display: grid;
    gap: 1px;
  }
  .sidebar-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px;
    border: 0; background: transparent; color: var(--text-dim);
    border-radius: 6px; cursor: pointer; font-size: 13px;
    text-align: left;
    transition: background .12s, color .12s;
  }
  .sidebar-row:hover { background: var(--hover); color: var(--text); }
  .sidebar-row svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8;
    flex-shrink: 0;
  }
  .sidebar-row .label { flex: 1; min-width: 0; }
  .sidebar-row .kbd {
    color: var(--muted); font-size: 11px; font-family: var(--font-mono);
  }

  .session-list {
    flex: 1; overflow-y: auto; padding: 4px 6px 16px;
  }
  .group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 14px 10px 6px;
  }
  .project-node { margin-bottom: 1px; position: relative; }
  .project-row {
    display: flex; align-items: center; gap: 4px;
    color: var(--text-dim); border-radius: 6px;
    padding: 6px 6px 6px 4px; min-height: 30px;
    cursor: pointer;
    position: relative;
  }
  .project-row:hover { background: var(--hover); color: var(--text); }
  .project-row.has-active::before {
    content: ''; position: absolute; left: -6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--text); border-radius: 1px;
  }
  .project-toggle {
    width: 18px; height: 18px; border: 0; background: transparent;
    color: var(--muted); display: grid; place-items: center;
    border-radius: 4px; cursor: pointer; flex-shrink: 0;
    padding: 0;
  }
  .project-row:hover .project-toggle { color: var(--text-dim); }
  .project-toggle svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }
  .project-main {
    min-width: 0; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px;
  }
  .project-more {
    width: 22px; height: 22px; border: 0; background: transparent;
    color: var(--muted); display: none; place-items: center;
    border-radius: 4px; cursor: pointer; flex-shrink: 0;
    font-size: 14px; line-height: 1;
  }
  .project-row:hover .project-more { display: grid; }
  .project-more:hover { background: var(--panel-2); color: var(--text); }
  .project-children { padding-left: 14px; }
  .project-empty {
    margin: 1px 0 4px 22px;
    color: var(--faint); font-size: 12px;
    padding: 4px 8px;
  }

  .session-item {
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    color: var(--text-dim); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: background .1s, color .1s;
    margin-bottom: 1px;
  }
  .session-item:hover { background: var(--hover); color: var(--text); }
  .session-item.active { background: var(--active); color: var(--text); }
  .session-item .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .session-item .session-more {
    visibility: hidden;
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 0; width: 18px; height: 18px;
    border-radius: 3px; flex-shrink: 0;
    font-size: 13px; line-height: 1;
  }
  .session-item:hover .session-more { visibility: visible; }
  .session-item .session-more:hover { color: var(--text); background: var(--panel-2); }

  /* ============================== generic context menu ============================== */
  .ctx-menu {
    position: fixed;
    min-width: 168px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,.45);
    padding: 4px;
    z-index: 80;
    display: none;
  }
  .ctx-menu.open { display: grid; gap: 1px; }
  .ctx-menu button {
    width: 100%; border: 0; background: transparent;
    color: var(--text-dim); cursor: pointer;
    border-radius: 5px; padding: 7px 10px; text-align: left; font-size: 13px;
  }
  .ctx-menu button:hover { background: var(--hover); color: var(--text); }
  .ctx-menu button.danger:hover { color: var(--err-text); }

  /* ============================== main ============================== */
  main {
    display: grid;
    grid-template-rows: 44px 1fr auto;
    min-height: 0; overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .topbar .sess-title {
    flex: 1; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text);
  }
  .topbar .sess-title .crumb-proj { color: var(--muted); }
  .topbar .sess-title .crumb-sep  { color: var(--faint); margin: 0 6px; }
  .topbar .sess-title .crumb-chat { color: var(--text); }

  .topbar-actions {
    display: inline-flex; align-items: center; gap: 6px;
    min-width: 0;
  }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-dim); font-size: 11.5px;
    max-width: 220px;
    overflow: hidden;
  }
  .status .status-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status.err { color: var(--err-text); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.err { background: var(--err-text); }
  .spinner {
    width: 11px; height: 11px;
    border: 1.4px solid var(--border);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chat-area {
    overflow-y: auto;
    padding: 24px 0 28px;
    min-height: 0;
  }
  .chat-inner {
    max-width: 760px; margin: 0 auto; padding: 0 24px;
    display: flex; flex-direction: column;
  }
  .welcome {
    padding: 96px 4px 0;
    color: var(--text-dim);
  }
  .welcome h1 {
    font-size: 18px; font-weight: 500; margin: 0 0 4px; color: var(--text);
    letter-spacing: 0;
  }
  .welcome p { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- messages: de-bubbled ---------- */
  .msg {
    display: flex; flex-direction: column;
    margin: 0 0 18px;
  }
  .msg-label {
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .msg-label.err { color: var(--err-text); }
  .msg .body {
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.65;
  }
  .msg.asst .body.collapsed {
    max-height: 168px; overflow: hidden; position: relative;
  }
  .msg.asst .body.collapsed::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    background: linear-gradient(180deg, transparent, var(--bg));
    pointer-events: none;
  }
  .msg.asst .toggle {
    margin-top: 4px; font-size: 11px; color: var(--text-dim); cursor: pointer;
    align-self: flex-start;
    user-select: none;
  }
  .msg.asst .toggle:hover { color: var(--text); }

  /* ---------- tool line ---------- */
  .tool-line {
    display: grid;
    grid-template-columns: 12px 7ch 1fr auto auto;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .tool-line .tl-dot { color: var(--faint); }
  .tool-line .tl-kind { color: var(--text-dim); }
  .tool-line .tl-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-dim);
  }
  .tool-line .tl-arrow { color: var(--faint); }
  .tool-line .tl-result { color: var(--text-dim); }
  .tool-line .tl-result.err { color: var(--err-text); }
  .msg.tool { margin: 0; }
  .msg.tool + .msg.tool { margin-top: 0; }

  /* ---------- turn divider ---------- */
  .turn-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 18px 0 8px;
  }
  .turn-divider .line {
    flex: 1; height: 1px; background: var(--border);
  }

  /* ---------- inline note (formerly turn-divider used for info) ---------- */
  .info-line {
    color: var(--muted);
    font-size: 11.5px;
    padding: 4px 0;
    font-family: var(--font-mono);
  }

  /* ---------- status rows (done / pause / limit / error / changes) ---------- */
  .status-row {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 13px;
    margin: 4px 0 0;
  }
  .status-row .sr-prefix {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    flex-shrink: 0;
  }
  .status-row.err .sr-prefix { color: var(--err-text); }
  .status-row .sr-text {
    color: var(--text-dim);
    flex: 1; min-width: 0;
    overflow-wrap: anywhere;
  }
  .status-row.err .sr-text { color: var(--err-text); }
  .link-btn {
    background: transparent; border: 0; padding: 0;
    color: var(--text-dim); cursor: pointer;
    font-size: 12px; font-family: inherit;
    flex-shrink: 0;
  }
  .link-btn:hover:not(:disabled) { color: var(--text); text-decoration: underline; }
  .link-btn:disabled { color: var(--faint); cursor: not-allowed; }

  /* ---------- changes card ---------- */
  .changes-head-row {
    display: flex; align-items: baseline; gap: 12px;
  }
  .changes-head-row .changes-count {
    font-size: 13px; color: var(--text-dim); flex: 1;
  }
  .changes-files {
    margin-top: 6px;
    display: grid;
    gap: 2px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .changes-file {
    display: grid;
    grid-template-columns: 2ch 1fr auto;
    gap: 12px;
    align-items: baseline;
    color: var(--text-dim);
  }
  .changes-file .cf-status { color: var(--muted); }
  .changes-file .cf-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .changes-file .cf-stat { color: var(--text-dim); }

  /* ---------- shell card ---------- */
  .shell-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid; gap: 8px;
  }
  .shell-card .sc-title {
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .shell-card .sc-meta {
    color: var(--muted); font-family: var(--font-mono); font-size: 11.5px;
  }
  .shell-card .sc-error {
    color: var(--err-text);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .shell-command {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
    color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre;
  }
  .shell-actions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .text-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .text-btn:hover:not(:disabled) {
    background: var(--hover); color: var(--text); border-color: var(--border);
  }
  .text-btn.primary {
    color: var(--text);
    font-weight: 500;
  }
  .text-btn.primary:hover:not(:disabled) {
    background: var(--panel-2);
  }
  .text-btn:disabled { opacity: .4; cursor: not-allowed; }

  .shell-output {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px;
    color: var(--text-dim); font-family: var(--font-mono); font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* ============================== composer ============================== */
  .composer-wrap {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 24px 16px;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
  }
  .composer-context {
    color: var(--muted);
    font-size: 11.5px;
    padding: 0 4px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .composer-context .ctx-sep { color: var(--faint); }
  .composer-box {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px 8px;
    transition: border-color .12s;
  }
  .composer-box:focus-within { border-color: var(--text-dim); }
  .composer-box textarea {
    width: 100%; min-height: 40px; max-height: 220px;
    background: transparent; border: 0; color: var(--text);
    font-family: inherit; font-size: 13.5px; line-height: 1.55;
    resize: none; outline: none; padding: 6px 4px;
  }
  .composer-box textarea::placeholder { color: var(--muted); }

  .composer-bar {
    display: flex; align-items: center; gap: 6px; margin-top: 2px;
  }

  /* provider picker — keeps the green dot */
  .provider-chooser { position: relative; display: inline-flex; }
  .provider-button {
    border: 0;
    background: transparent;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 8px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
  }
  .provider-button:hover:not(:disabled),
  .provider-button.open {
    background: var(--hover);
    color: var(--text);
  }
  .provider-button:disabled { opacity: .55; cursor: default; }
  .provider-button .chev {
    width: 11px; height: 11px;
    stroke: currentColor; fill: none; stroke-width: 2;
    color: var(--faint);
    flex-shrink: 0;
  }
  .provider-menu {
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    min-width: 180px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    padding: 4px;
    display: none;
    z-index: 30;
  }
  .provider-menu.open { display: grid; gap: 1px; }
  .provider-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 7px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    text-align: left;
    font-family: inherit;
  }
  .provider-item:hover { background: var(--hover); color: var(--text); }
  .provider-item .label { flex: 1; min-width: 0; }
  .provider-item .check {
    width: 12px;
    color: var(--text-dim);
    opacity: 0;
    flex-shrink: 0;
    font-size: 11px;
  }
  .provider-item.active .check { opacity: 1; }
  .provider-item.active { color: var(--text); }

  /* the green dot (the only color in the UI) */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.ok {
    background: var(--ok-dot);
    box-shadow: 0 0 0 3px rgba(78, 201, 176, .14);
  }
  .dot.off {
    background: transparent;
    border: 1.5px solid var(--muted);
  }

  /* send / stop — square icon buttons, no color */
  .icon-btn {
    margin-left: auto;
    background: transparent; color: var(--text-dim); border: 0;
    width: 30px; height: 28px; border-radius: 6px;
    cursor: pointer; display: inline-grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .icon-btn:disabled { color: var(--faint); cursor: not-allowed; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .icon-btn.send svg { fill: currentColor; stroke: none; }
  .send-hint {
    color: var(--faint); font-size: 10.5px;
    font-family: var(--font-mono);
    margin-left: auto;
    opacity: 0;
    transition: opacity .12s;
  }
  .composer-box:focus-within ~ .composer-bar .send-hint,
  .composer-bar:hover .send-hint { opacity: 1; }

  /* ============================== changes drawer ============================== */
  .changes-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(560px, 92vw);
    background: var(--bg-2);
    border-left: 1px solid var(--border);
    box-shadow: -18px 0 48px rgba(0,0,0,.42);
    transform: translateX(102%);
    transition: transform .18s ease;
    z-index: 40;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .changes-drawer.open { transform: translateX(0); }
  .changes-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg-2);
  }
  .changes-title { flex: 1; min-width: 0; }
  .changes-title strong { display: block; font-size: 13.5px; font-weight: 500; color: var(--text); }
  .changes-title span { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .drawer-btn {
    border: 0; background: transparent; color: var(--text-dim);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    font-family: inherit;
  }
  .drawer-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .drawer-btn:disabled { color: var(--faint); cursor: not-allowed; }
  .changes-body { overflow-y: auto; padding: 8px 12px 18px; }
  .changes-empty, .changes-error {
    color: var(--muted); padding: 20px 4px; font-size: 13px;
  }
  .changes-error { color: var(--err-text); }
  .change-file {
    border-bottom: 1px solid var(--border-2);
  }
  .change-file button {
    width: 100%; border: 0; background: transparent; color: var(--text);
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px;
    align-items: center; text-align: left; cursor: pointer;
    padding: 10px 4px; font-size: 13px; font-family: inherit;
  }
  .change-file button:hover { background: rgba(255,255,255,.02); }
  .change-status {
    min-width: 22px; color: var(--muted); font-family: var(--font-mono); font-size: 12px;
  }
  .change-path {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font-mono); color: var(--text-dim); font-size: 12px;
  }
  .change-stat {
    font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
  }
  .diff-pre {
    margin: 0 0 12px; padding: 0;
    background: var(--bg); border: 1px solid var(--border-2); border-radius: 6px;
    overflow-x: auto; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
  }
  .diff-line { display: block; padding: 1px 12px; white-space: pre; color: var(--text-dim); }
  .diff-line .ln {
    display: inline-block;
    width: 4ch;
    padding-right: 10px;
    color: var(--faint);
    text-align: right;
    user-select: none;
  }
  .diff-line .mark {
    display: inline-block;
    width: 2ch;
    color: var(--text-dim);
  }
  .diff-line.add { background: rgba(78, 201, 176, .07); color: var(--text); }
  .diff-line.del { background: rgba(210, 138, 138, .07); color: var(--text); }
  .diff-line.hunk { color: var(--muted); }
  .diff-line.meta { color: var(--faint); }

  @media (max-width: 720px) {
    aside { position: absolute; z-index: 10; height: 100%; }
    body.sidebar-collapsed aside { display: none; }
  }
</style>
</head>
<body>
<aside id="aside">
  <div class="sidebar-head">
    <button class="btn-icon" id="toggle-sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="sidebar-spacer"></div>
  </div>
  <div class="sidebar-actions">
    <button class="sidebar-row" id="btn-new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">New chat</span>
      <span class="kbd">Ctrl+N</span>
    </button>
    <button class="sidebar-row" id="btn-add-project">
      <svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      <span class="label">Add project</span>
    </button>
  </div>
  <div class="session-list" id="session-list"></div>
</aside>

<main>
  <div class="topbar">
    <button class="btn-icon" id="show-sidebar" title="Show sidebar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="sess-title" id="sess-title">New chat</div>
    <div class="topbar-actions">
      <div class="status" id="status"></div>
      <button class="btn-icon" id="topbar-more" title="More">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="chat-inner" id="chat"></div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="composer-context" id="composer-context"></div>
      <div class="composer-box">
        <textarea id="task" placeholder="Send a message to Codey…" rows="1"></textarea>
      </div>
      <div class="composer-bar">
        <div class="provider-chooser">
          <button class="provider-button" id="provider-button" title="Model" disabled>
            <span class="dot ok" id="provider-dot"></span>
            <span class="name" id="provider-name">DeepSeek</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="provider-menu" id="provider-menu" aria-hidden="true">
            <button class="provider-item" data-provider="deepseek">
              <span class="dot ok" aria-hidden="true"></span>
              <span class="label">DeepSeek</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="mimo">
              <span class="dot ok" aria-hidden="true"></span>
              <span class="label">MiMo</span>
              <span class="check">✓</span>
            </button>
            <button class="provider-item" data-provider="qwen">
              <span class="dot ok" aria-hidden="true"></span>
              <span class="label">Qwen</span>
              <span class="check">✓</span>
            </button>
          </div>
        </div>
        <span class="send-hint" id="send-hint">Ctrl ↵</span>
        <button class="icon-btn" id="stop" style="display:none" title="Stop">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn send" id="send" disabled title="Send">
          <svg viewBox="0 0 24 24"><path d="M3 11 21 3l-7 18-3-8-8-2Z"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>

<div class="ctx-menu" id="proj-menu">
  <button data-act="newchat">New chat here</button>
  <button data-act="rename">Rename</button>
  <button data-act="remove" class="danger">Remove from sidebar</button>
</div>
<div class="ctx-menu" id="sess-menu">
  <button data-act="rename">Rename</button>
  <button data-act="delete" class="danger">Delete chat</button>
</div>
<div class="ctx-menu" id="top-menu">
  <button data-act="rename">Rename chat</button>
  <button data-act="clear" class="danger">Clear messages</button>
</div>

<section class="changes-drawer" id="changes-drawer" aria-hidden="true">
  <div class="changes-head">
    <div class="changes-title">
      <strong>Changes</strong>
      <span id="changes-subtitle">Not loaded</span>
    </div>
    <button class="drawer-btn" id="changes-copy">Copy diff</button>
    <button class="drawer-btn" id="changes-restore">Restore</button>
    <button class="drawer-btn" id="changes-refresh">Refresh</button>
    <button class="drawer-btn" id="changes-close">Close</button>
  </div>
  <div class="changes-body" id="changes-body">
    <div class="changes-empty">No changes</div>
  </div>
</section>

<script>
// ============================ state & storage ============================
const $ = (id) => document.getElementById(id);
const LS_SESSIONS = 'codey:sessions';
const LS_ACTIVE   = 'codey:active';
const LS_PROJECTS = 'codey:projects';
const LS_LEGACY_PROJECT = 'codey:project';
const DEFAULT_PROVIDER = 'deepseek';
const PROVIDERS = ['deepseek', 'mimo', 'qwen'];

function uid() { return Math.random().toString(36).slice(2, 10); }
function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; }
}
function saveSessions(arr) { localStorage.setItem(LS_SESSIONS, JSON.stringify(arr)); }
function saveProjects(arr) { localStorage.setItem(LS_PROJECTS, JSON.stringify(arr)); }
function pathName(path) {
  const trimmed = (path || '').replace(/[\\\/]+$/, '');
  return trimmed.split(/[\\\/]/).pop() || trimmed || 'project';
}
function pathKey(path) { return (path || '').replace(/[\\\/]+$/, '').toLowerCase(); }
function escapeHtml(text) {
  return (text || '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

let sessions = loadJson(LS_SESSIONS, []).map(s => ({
  id: s.id || uid(),
  title: s.title || 'New chat',
  messages: Array.isArray(s.messages) ? s.messages : [],
  createdAt: s.createdAt || Date.now(),
  projectId: s.projectId || null,
  provider: PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER,
}));
let projects = loadJson(LS_PROJECTS, []).map(p => ({
  id: p.id || uid(),
  name: p.name || pathName(p.path),
  path: p.path || '',
  expanded: p.expanded !== false,
  createdAt: p.createdAt || Date.now(),
})).filter(p => p.path);

let activeId = localStorage.getItem(LS_ACTIVE) || '';

const legacyProject = (localStorage.getItem(LS_LEGACY_PROJECT) || '').trim();
if (legacyProject && !projects.some(p => pathKey(p.path) === pathKey(legacyProject))) {
  projects.unshift({
    id: uid(),
    name: pathName(legacyProject),
    path: legacyProject,
    expanded: true,
    createdAt: Date.now(),
  });
  saveProjects(projects);
}
localStorage.removeItem(LS_LEGACY_PROJECT);

if (!sessions.length) {
  const s = { id: uid(), title: 'New chat', messages: [], createdAt: Date.now(), projectId: null, provider: DEFAULT_PROVIDER };
  sessions = [s]; activeId = s.id; saveSessions(sessions);
  localStorage.setItem(LS_ACTIVE, activeId);
}
if (!sessions.find(s => s.id === activeId)) {
  activeId = sessions[0].id; localStorage.setItem(LS_ACTIVE, activeId);
}

// ============================ helpers ============================
function activeSession() { return sessions.find(s => s.id === activeId); }
function projectById(id) { return projects.find(p => p.id === id) || null; }
function activeProject() {
  const s = activeSession();
  return s && s.projectId ? projectById(s.projectId) : null;
}
function currentProjectPath() {
  const p = activeProject();
  return p ? p.path : '';
}
function currentProviderId() {
  const s = activeSession();
  return s && PROVIDERS.includes(s.provider) ? s.provider : DEFAULT_PROVIDER;
}
function providerLabel(id) {
  if (id === 'qwen') return 'Qwen';
  if (id === 'mimo') return 'MiMo';
  return 'DeepSeek';
}
function providerAvailability(_id) { return 'ok'; } // future health check hook
function syncProviderUI(providerId) {
  const id = PROVIDERS.includes(providerId) ? providerId : DEFAULT_PROVIDER;
  $('provider-name').textContent = providerLabel(id);
  $('provider-dot').className = 'dot ' + providerAvailability(id);
  document.querySelectorAll('.provider-item').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.provider === id);
  });
}
function persistActive() {
  saveSessions(sessions);
  saveProjects(projects);
  localStorage.setItem(LS_ACTIVE, activeId);
}
function updateComposerContext() {
  const el = $('composer-context');
  const p = activeProject();
  const proj = p ? p.name : 'No project';
  const prov = providerLabel(currentProviderId());
  el.innerHTML = `<span>${escapeHtml(proj)}</span><span class="ctx-sep">·</span><span>${escapeHtml(prov)}</span>`;
}

// ============================ sidebar rendering ============================
function renderSidebar() {
  const list = $('session-list');
  list.innerHTML = '';

  const projLabel = document.createElement('div');
  projLabel.className = 'group-label';
  projLabel.textContent = 'PROJECTS';
  list.appendChild(projLabel);

  if (!projects.length) {
    const empty = document.createElement('div');
    empty.className = 'project-empty';
    empty.textContent = 'No projects';
    list.appendChild(empty);
  }

  for (const p of projects) {
    const node = document.createElement('div');
    node.className = 'project-node';

    const row = document.createElement('div');
    row.className = 'project-row';
    const activeS = activeSession();
    if (activeS && activeS.projectId === p.id) row.classList.add('has-active');
    row.title = p.path;

    const toggle = document.createElement('button');
    toggle.className = 'project-toggle';
    toggle.innerHTML = p.expanded
      ? '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
    toggle.onclick = (e) => {
      e.stopPropagation();
      p.expanded = !p.expanded;
      persistActive();
      renderSidebar();
    };
    row.appendChild(toggle);

    const main = document.createElement('div');
    main.className = 'project-main';
    main.textContent = p.name;
    row.appendChild(main);

    row.onclick = () => openProject(p.id);

    const more = document.createElement('button');
    more.className = 'project-more';
    more.title = 'More';
    more.textContent = '⋯';
    more.onclick = (e) => {
      e.stopPropagation();
      openProjectMenu(e.currentTarget, p.id);
    };
    row.appendChild(more);

    node.appendChild(row);

    if (p.expanded) {
      const children = document.createElement('div');
      children.className = 'project-children';
      const projectSessions = sessions.filter(s => s.projectId === p.id);
      if (!projectSessions.length) {
        const empty = document.createElement('div');
        empty.className = 'project-empty';
        empty.textContent = 'No chats';
        children.appendChild(empty);
      } else {
        for (const s of projectSessions) children.appendChild(sessionNode(s));
      }
      node.appendChild(children);
    }
    list.appendChild(node);
  }

  const looseLabel = document.createElement('div');
  looseLabel.className = 'group-label';
  looseLabel.textContent = 'CHATS';
  list.appendChild(looseLabel);
  const loose = sessions.filter(s => !s.projectId);
  if (!loose.length) {
    const empty = document.createElement('div');
    empty.className = 'project-empty';
    empty.style.marginLeft = '10px';
    empty.textContent = 'No chats';
    list.appendChild(empty);
  }
  for (const s of loose) list.appendChild(sessionNode(s));
}

function sessionNode(s) {
  const item = document.createElement('div');
  item.className = 'session-item' + (s.id === activeId ? ' active' : '');
  item.onclick = (e) => { if (!e.target.closest('button')) switchSession(s.id); };
  const title = document.createElement('span');
  title.className = 'session-title';
  title.textContent = s.title || 'Untitled';
  item.appendChild(title);
  const more = document.createElement('button');
  more.className = 'session-more'; more.textContent = '⋯'; more.title = 'More';
  more.onclick = (e) => { e.stopPropagation(); openSessionMenu(e.currentTarget, s.id); };
  item.appendChild(more);
  return item;
}

// ============================ chat rendering ============================
function renderChat() {
  const s = activeSession();
  const chat = $('chat');
  if (!s) return;
  const p = activeProject();
  const titleEl = $('sess-title');
  if (p) {
    titleEl.innerHTML = `<span class="crumb-proj">${escapeHtml(p.name)}</span><span class="crumb-sep">/</span><span class="crumb-chat">${escapeHtml(s.title || 'New chat')}</span>`;
  } else {
    titleEl.innerHTML = `<span class="crumb-chat">${escapeHtml(s.title || 'New chat')}</span>`;
  }
  syncProviderUI(currentProviderId());
  updateComposerContext();

  if (!s.messages.length) {
    chat.innerHTML = `
      <div class="welcome">
        <h1>Codey</h1>
        <p>Send a message to start.</p>
      </div>`;
    return;
  }

  chat.innerHTML = '';
  for (const m of s.messages) appendMessageNode(chat, m);
  scrollChat();
}

function statusRow(prefix, text, opts = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + (opts.kind || '');
  const row = document.createElement('div');
  row.className = 'status-row' + (opts.err ? ' err' : '');
  const pre = document.createElement('span');
  pre.className = 'sr-prefix';
  pre.textContent = prefix;
  const txt = document.createElement('span');
  txt.className = 'sr-text';
  let body = text || '';
  if (opts.err) body = body.replace(/^ERROR:\s*/i, '');
  txt.textContent = body;
  row.append(pre, txt);
  if (opts.action) {
    const btn = document.createElement('button');
    btn.className = 'link-btn';
    btn.textContent = opts.action.label;
    btn.disabled = !!opts.action.disabled;
    btn.onclick = opts.action.onclick;
    row.appendChild(btn);
  }
  div.appendChild(row);
  return div;
}

function appendMessageNode(chat, m) {
  if (m.type === 'user') {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-label">You</div><div class="body"></div>`;
    div.querySelector('.body').textContent = m.text;
    chat.appendChild(div);
  } else if (m.type === 'turn') {
    const div = document.createElement('div');
    div.className = 'turn-divider';
    div.innerHTML = `<span>Turn ${m.n}</span><span class="line"></span>`;
    chat.appendChild(div);
  } else if (m.type === 'asst') {
    const div = document.createElement('div');
    div.className = 'msg asst';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Codey';
    div.appendChild(label);
    const body = document.createElement('div');
    body.className = 'body collapsed';
    body.textContent = m.text;
    div.appendChild(body);
    if (m.text.split('\n').length > 6 || m.text.length > 400) {
      const toggle = document.createElement('div');
      toggle.className = 'toggle'; toggle.textContent = 'Expand';
      toggle.onclick = () => {
        const collapsed = body.classList.toggle('collapsed');
        toggle.textContent = collapsed ? 'Expand' : 'Collapse';
      };
      div.appendChild(toggle);
    } else {
      body.classList.remove('collapsed');
    }
    chat.appendChild(div);
  } else if (m.type === 'tool') {
    const div = document.createElement('div');
    div.className = 'msg tool';
    const row = document.createElement('div');
    row.className = 'tool-line';
    const dot = document.createElement('span'); dot.className = 'tl-dot'; dot.textContent = '·';
    const kind = document.createElement('span'); kind.className = 'tl-kind'; kind.textContent = m.kind || '';
    const path = document.createElement('span'); path.className = 'tl-path'; path.textContent = m.path || '';
    const arrow = document.createElement('span'); arrow.className = 'tl-arrow'; arrow.textContent = '→';
    const result = document.createElement('span'); result.className = 'tl-result' + (m.error ? ' err' : ''); result.textContent = m.result || '';
    row.append(dot, kind, path, arrow, result);
    div.appendChild(row);
    chat.appendChild(div);
  } else if (m.type === 'done') {
    chat.appendChild(statusRow('Done', m.text || 'Task complete', { kind: 'done' }));
  } else if (m.type === 'review') {
    chat.appendChild(statusRow('Review', m.text || 'Complete', { kind: 'review' }));
  } else if (m.type === 'changes') {
    const div = document.createElement('div');
    div.className = 'msg changes';
    const head = document.createElement('div');
    head.className = 'changes-head-row';
    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = 'Changes';
    const count = document.createElement('span');
    count.className = 'changes-count';
    const n = m.count || 0;
    count.textContent = `${n} file${n === 1 ? '' : 's'}`;
    const view = document.createElement('button');
    view.className = 'link-btn';
    view.textContent = 'View diff';
    view.onclick = () => openChangesDrawer(m.project || currentProjectPath());
    head.append(label, count, view);
    div.appendChild(head);
    const files = Array.isArray(m.files) ? m.files : [];
    if (files.length) {
      const list = document.createElement('div');
      list.className = 'changes-files';
      for (const f of files) {
        const row = document.createElement('div');
        row.className = 'changes-file';
        row.innerHTML = `<span class="cf-status">${escapeHtml(f.status || 'M')}</span><span class="cf-path">${escapeHtml(f.path || '')}</span><span class="cf-stat">+${f.additions || 0} -${f.deletions || 0}</span>`;
        list.appendChild(row);
      }
      div.appendChild(list);
    }
    chat.appendChild(div);
  } else if (m.type === 'shell_request') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const card = document.createElement('div');
    card.className = 'shell-card';
    const title = document.createElement('div');
    title.className = 'sc-title';
    title.textContent = 'Command approval';
    const meta = document.createElement('div');
    meta.className = 'sc-meta';
    meta.textContent = m.cwd ? `Runs in ${m.cwd}` : 'Runs in .';
    const cmd = document.createElement('div');
    cmd.className = 'shell-command';
    cmd.textContent = '$ ' + (m.command || '');
    const error = document.createElement('div');
    error.className = 'sc-error';
    error.hidden = true;
    const actions = document.createElement('div');
    actions.className = 'shell-actions';
    const deny = document.createElement('button');
    deny.className = 'text-btn';
    deny.textContent = 'Deny';
    const approve = document.createElement('button');
    approve.className = 'text-btn primary';
    approve.textContent = 'Allow';
    approve.onclick = () => approveCommand(m.id, true, approve, deny, error);
    deny.onclick = () => approveCommand(m.id, false, approve, deny, error);
    actions.append(deny, approve);
    card.append(title, meta, cmd, error, actions);
    div.appendChild(card);
    chat.appendChild(div);
  } else if (m.type === 'shell_result') {
    const div = document.createElement('div');
    div.className = 'msg shell';
    const out = document.createElement('div');
    out.className = 'shell-output';
    const exit = m.exitCode === null || m.exitCode === undefined ? '' : `exit ${m.exitCode}\n`;
    out.textContent = `${m.approved ? 'Executed' : 'Denied'}\n$ ${m.command || ''}\n${exit}${m.output || ''}`;
    div.appendChild(out);
    chat.appendChild(div);
  } else if (m.type === 'limit') {
    chat.appendChild(statusRow('Limit', m.text || 'Turn limit reached', {
      action: { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'pause') {
    chat.appendChild(statusRow('Paused', m.text || 'No progress for several turns', {
      action: { label: 'Continue', disabled: !!runningSessionId, onclick: () => continueTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'err') {
    chat.appendChild(statusRow('Error', m.text || '', {
      err: true,
      action: { label: 'Retry', disabled: !!runningSessionId, onclick: () => retryTask(m.sessionId || activeId) },
    }));
  } else if (m.type === 'info') {
    const div = document.createElement('div');
    div.className = 'info-line';
    div.textContent = m.text;
    chat.appendChild(div);
  }
}

function scrollChat() {
  const area = $('chat-area');
  area.scrollTop = area.scrollHeight;
}

// ============================ session ops ============================
function switchSession(id) {
  activeId = id; persistActive(); renderSidebar(); renderChat();
}
function openProject(projectId) {
  const p = projectById(projectId);
  if (!p) return;
  p.expanded = true;
  const first = sessions.find(s => s.projectId === projectId);
  if (first) switchSession(first.id);
  else newSession(projectId);
}
function newSession(projectId = null) {
  const provider = currentProviderId();
  const s = { id: uid(), projectId, title: 'New chat', messages: [], createdAt: Date.now(), provider };
  sessions.unshift(s); activeId = s.id; persistActive(); renderSidebar(); renderChat();
  fetch('/api/new_chat', { method: 'POST' }).catch(() => {});
}
function deleteSession(id) {
  if (!confirm('Delete this chat?')) return;
  const fallbackProvider = currentProviderId();
  sessions = sessions.filter(s => s.id !== id);
  if (!sessions.length) {
    const s = { id: uid(), title: 'New chat', messages: [], createdAt: Date.now(), projectId: null, provider: fallbackProvider };
    sessions = [s];
  }
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActive(); renderSidebar(); renderChat();
}
function renameSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const next = prompt('Rename chat', s.title || 'New chat');
  if (next === null) return;
  const title = next.trim();
  if (!title) return;
  s.title = title.slice(0, 80);
  persistActive();
  renderSidebar();
  if (id === activeId) renderChat();
}
function clearMessages(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  if (!confirm('Clear all messages in this chat?')) return;
  s.messages = [];
  persistActive();
  if (id === activeId) renderChat();
}
function renameProject(id) {
  const p = projectById(id);
  if (!p) return;
  const next = prompt('Rename project', p.name);
  if (next === null) return;
  const name = next.trim();
  if (!name) return;
  p.name = name.slice(0, 80);
  persistActive();
  renderSidebar();
  if (activeProject() && activeProject().id === id) renderChat();
}
function deleteProject(id) {
  const p = projectById(id);
  if (!p) return;
  if (!confirm(`Remove project "${p.name}" from the sidebar? Files on disk will not be deleted, but local chats under this project will be.`)) return;
  projects = projects.filter(x => x.id !== id);
  sessions = sessions.filter(s => s.projectId !== id);
  if (!sessions.length) sessions = [{ id: uid(), title: 'New chat', messages: [], createdAt: Date.now(), projectId: null, provider: DEFAULT_PROVIDER }];
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;
  persistActive(); renderSidebar(); renderChat();
}
function ensureProject(path, name) {
  const existing = projects.find(p => pathKey(p.path) === pathKey(path));
  if (existing) {
    existing.expanded = true;
    return existing;
  }
  const p = {
    id: uid(),
    name: name || pathName(path),
    path,
    expanded: true,
    createdAt: Date.now(),
  };
  projects.unshift(p);
  saveProjects(projects);
  return p;
}
async function pickProject() {
  $('btn-add-project').disabled = true;
  try {
    const r = await fetch('/api/pick_folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'open', initial: currentProjectPath() }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      setStatus('Could not add project', 'err');
      return;
    }
    if (!data.ok || !data.path) return;
    const p = ensureProject(data.path, data.name);
    newSession(p.id);
  } finally {
    $('btn-add-project').disabled = false;
  }
}

function pushMsg(m) {
  const s = activeSession();
  if (!s) return;
  const wasEmpty = s.messages.length === 0;
  s.messages.push(m);
  if (s.title === 'New chat' && m.type === 'user' && m.text) {
    s.title = m.text.slice(0, 28) + (m.text.length > 28 ? '…' : '');
    persistActive();
    renderSidebar();
    renderChat();
    return;
  }
  persistActive();
  if (wasEmpty) renderChat();
  else {
    appendMessageNode($('chat'), m);
    scrollChat();
  }
}

// ============================ context menus ============================
function openMenuAt(menu, anchor) {
  const rect = anchor.getBoundingClientRect();
  menu.classList.add('open');
  const mr = menu.getBoundingClientRect();
  let left = rect.right - mr.width;
  if (left < 8) left = rect.left;
  let top = rect.bottom + 4;
  if (top + mr.height > window.innerHeight - 8) top = rect.top - mr.height - 4;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
}
function closeAllMenus() {
  document.querySelectorAll('.ctx-menu.open').forEach(m => m.classList.remove('open'));
}
function openProjectMenu(anchor, projectId) {
  closeAllMenus();
  const menu = $('proj-menu');
  menu.dataset.projectId = projectId;
  openMenuAt(menu, anchor);
}
function openSessionMenu(anchor, sessionId) {
  closeAllMenus();
  const menu = $('sess-menu');
  menu.dataset.sessionId = sessionId;
  openMenuAt(menu, anchor);
}
function openTopMenu(anchor) {
  closeAllMenus();
  openMenuAt($('top-menu'), anchor);
}
$('proj-menu').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = $('proj-menu').dataset.projectId;
  closeAllMenus();
  if (!id) return;
  const act = btn.dataset.act;
  if (act === 'newchat') newSession(id);
  else if (act === 'rename') renameProject(id);
  else if (act === 'remove') deleteProject(id);
});
$('sess-menu').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = $('sess-menu').dataset.sessionId;
  closeAllMenus();
  if (!id) return;
  const act = btn.dataset.act;
  if (act === 'rename') renameSession(id);
  else if (act === 'delete') deleteSession(id);
});
$('top-menu').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  closeAllMenus();
  const act = btn.dataset.act;
  if (act === 'rename') renameSession(activeId);
  else if (act === 'clear') clearMessages(activeId);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('.ctx-menu')) return;
  if (e.target.closest('.project-more, .session-more, #topbar-more')) return;
  closeAllMenus();
});

// ============================ SSE event ingestion ============================
let runningSessionId = null;
let turnCounter = 0;
let activeChangesProject = '';
let lastChangesData = null;

function setStatus(text, kind) {
  const el = $('status');
  el.className = 'status ' + (kind || '');
  el.innerHTML = '';
  if (kind === 'run' || kind === 'warn') {
    const sp = document.createElement('span');
    sp.className = 'spinner';
    el.appendChild(sp);
  } else if (kind === 'err') {
    const d = document.createElement('span');
    d.className = 'status-dot err';
    el.appendChild(d);
  }
  if (text && (kind === 'run' || kind === 'warn' || kind === 'err')) {
    const t = document.createElement('span');
    t.className = 'status-text';
    t.textContent = text;
    el.appendChild(t);
  }
}

const evtSrc = new EventSource('/api/events');
evtSrc.onmessage = (e) => {
  let data; try { data = JSON.parse(e.data); } catch { return; }
  if (data.type === 'hello') {
    const running = data.status === 'running';
    setStatus(running ? 'Running' : '', running ? 'run' : 'ok');
    $('provider-button').disabled = running;
    updateSend();
    return;
  }
  if (data.type === 'status') {
    setStatus(data.status === 'connecting' ? 'Connecting to Edge…' : data.status, 'warn');
    return;
  }
  const sid = data.session_id;
  if (data.type === 'task_start') {
    runningSessionId = sid;
    turnCounter = 0;
    setStatus('Running', 'run');
    $('send').disabled = true;
    $('provider-button').disabled = true;
    $('stop').style.display = '';
    return;
  }
  if (data.type === 'task_done') {
    runningSessionId = null;
    setStatus('', 'ok');
    $('stop').style.display = 'none';
    $('provider-button').disabled = false;
    updateSend();
    const summary = (data.summary || '').toString();
    const reason = (data.stop_reason || 'done').toString();
    if (summary.startsWith('ERROR:')) {
      addToSession(sid, { type: 'err', text: summary.replace(/^ERROR:\s*/i, ''), sessionId: sid });
    } else if (reason === 'max_turns') {
      const turns = data.turns || data.max_turns || 0;
      const label = turns ? `Reached turn limit (${turns})` : 'Reached turn limit';
      addToSession(sid, { type: 'limit', text: label, sessionId: sid });
    } else if (reason === 'no_progress') {
      addToSession(sid, { type: 'pause', text: 'Paused after several turns without new file writes', sessionId: sid });
    } else if (reason === 'approval') {
      // shell approval card is emitted separately
    } else if (summary) {
      addToSession(sid, { type: 'done', text: summary });
    }
    if (reason !== 'error' && reason !== 'approval') maybeAddChangesSummary(sid);
    return;
  }
  if (data.type === 'shell_request') {
    addToSession(sid, {
      type: 'shell_request',
      id: data.id,
      command: data.command,
      cwd: data.cwd,
      project: data.project,
    });
    return;
  }
  if (data.type === 'shell_result') {
    addToSession(sid, {
      type: 'shell_result',
      id: data.id,
      approved: !!data.approved,
      command: data.command,
      cwd: data.cwd,
      output: data.output,
      exitCode: data.exit_code,
    });
    return;
  }
  if (data.type === 'reply') {
    if (data.text) addToSession(sid, { type: 'asst', text: data.text });
    return;
  }
  if (data.type === 'review') {
    if (data.text) addToSession(sid, { type: 'review', text: data.text });
    return;
  }
  if (data.type === 'log') {
    handleLog(sid, data.text || '');
    return;
  }
};
evtSrc.onerror = () => setStatus('Disconnected', 'err');

function addToSession(sid, m) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return;
  if ((m.type === 'limit' || m.type === 'pause' || m.type === 'err') && !m.sessionId) m.sessionId = sid;
  s.messages.push(m);
  persistActive();
  if (sid === activeId) { appendMessageNode($('chat'), m); scrollChat(); }
}

function addSendError(sessionId) {
  addToSession(sessionId, { type: 'err', text: 'Could not send the message', sessionId });
}

function handleLog(sid, line) {
  if (!line) return;
  const turnMatch = line.match(/^\s*--- turn (\d+) reply.*?---\s*\n([\s\S]*)$/);
  if (turnMatch) {
    const n = parseInt(turnMatch[1], 10);
    addToSession(sid, { type: 'turn', n });
    const body = turnMatch[2].trim();
    if (body) addToSession(sid, { type: 'asst', text: body });
    return;
  }
  const toolMatch = line.match(/^\s*·\s+(\w+)\s+(\S*)\s*->\s*(.*)$/);
  if (toolMatch) {
    const [, kind, path, result] = toolMatch;
    addToSession(sid, { type: 'tool', kind, path, result: result.slice(0, 200), error: /^ERROR/.test(result) });
    return;
  }
  if (line.startsWith('[agent] DONE')) return;
  if (line.startsWith('[agent] loaded project instructions:')) {
    const names = line.replace('[agent] loaded project instructions:', '').trim();
    addToSession(sid, { type: 'info', text: names ? `loaded project instructions: ${names}` : 'loaded project instructions' });
    return;
  }
  if (line.startsWith('ERROR') || line.includes('Traceback')) {
    addToSession(sid, { type: 'err', text: line.replace(/^ERROR:\s*/i, ''), sessionId: sid }); return;
  }
  if (line.startsWith('[agent]') || line.startsWith('[codey]')) {
    addToSession(sid, { type: 'info', text: line }); return;
  }
}

function retryTask(sessionId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const lastUser = [...s.messages].reverse().find(m => m.type === 'user' && m.text);
  if (!lastUser) return;
  syncProviderUI(s.provider || DEFAULT_PROVIDER);
  $('task').value = lastUser.text;
  resizeTask();
  updateSend();
  $('send').click();
}

function sessionProjectPath(sid) {
  const s = sessions.find(x => x.id === sid);
  const p = s && s.projectId ? projectById(s.projectId) : null;
  return p ? p.path : '';
}

async function fetchChanges(project) {
  const r = await fetch('/api/changes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project }),
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) data.ok = false;
  return data;
}

async function restoreChanges(project) {
  const r = await fetch('/api/changes/restore', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project }),
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) data.ok = false;
  return data;
}

async function maybeAddChangesSummary(sid) {
  const project = sessionProjectPath(sid);
  if (!project) return;
  try {
    const data = await fetchChanges(project);
    if (!data.ok || !data.changed_count) return;
    const files = Array.isArray(data.files) ? data.files.slice(0, 3) : [];
    addToSession(sid, { type: 'changes', count: data.changed_count, files, project });
  } catch {}
}

async function openChangesDrawer(project) {
  if (!project) return;
  activeChangesProject = project;
  $('changes-drawer').classList.add('open');
  $('changes-drawer').setAttribute('aria-hidden', 'false');
  await loadChangesDrawer(project);
}

async function loadChangesDrawer(project) {
  $('changes-subtitle').textContent = 'Loading…';
  $('changes-restore').disabled = true;
  $('changes-body').innerHTML = '<div class="changes-empty">Reading changes…</div>';
  try {
    const data = await fetchChanges(project);
    lastChangesData = data;
    renderChangesDrawer(data);
  } catch (err) {
    lastChangesData = null;
    $('changes-subtitle').textContent = 'Failed';
    $('changes-body').innerHTML = `<div class="changes-error">${escapeHtml(String(err))}</div>`;
  }
}

function closeChangesDrawer() {
  $('changes-drawer').classList.remove('open');
  $('changes-drawer').setAttribute('aria-hidden', 'true');
}

function renderChangesDrawer(data) {
  const body = $('changes-body');
  if (!data || !data.ok) {
    $('changes-subtitle').textContent = data && data.error ? data.error : 'No changes';
    body.innerHTML = `<div class="changes-empty">${escapeHtml(data && data.error ? data.error : 'No changes')}</div>`;
    return;
  }
  const files = Array.isArray(data.files) ? data.files : [];
  const mode = data.mode === 'git' ? 'Git' : 'Snapshot';
  $('changes-subtitle').textContent = `${files.length} file${files.length === 1 ? '' : 's'} changed · ${mode}`;
  $('changes-restore').disabled = data.mode === 'git' || !files.length;
  if (!files.length) {
    body.innerHTML = '<div class="changes-empty">No changes</div>';
    return;
  }
  const chunks = parseDiffChunks(data.diff || '');
  body.innerHTML = '';
  for (const file of files) body.appendChild(changeFileNode(file, chunks));
}

function parseDiffChunks(diff) {
  const lines = (diff || '').split('\n');
  const chunks = [];
  let current = null;
  function push() { if (current) chunks.push(current); }
  function start(path) {
    push();
    current = { path: (path || '').replace(/^b\//, ''), lines: [] };
  }
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const next = lines[i + 1] || '';
    if (line.startsWith('diff --git ')) {
      const m = line.match(/\sb\/(.+)$/);
      start(m ? m[1] : '');
    } else if (line.startsWith('--- /dev/null') && next.startsWith('+++ ')
        && (!current || !current.lines.some(l => l.startsWith('diff --git ')))) {
      start(next.replace(/^\+\+\+\s+/, '').replace(/^b\//, ''));
    }
    if (!current && line.trim()) current = { path: '', lines: [] };
    if (current) current.lines.push(line);
  }
  push();
  return chunks;
}

function chunkForPath(chunks, path) {
  const target = (path || '').replace(/\\/g, '/');
  return chunks.find(c => c.path === target || c.path.endsWith('/' + target)) || null;
}

function changeFileNode(file, chunks) {
  const wrap = document.createElement('div');
  wrap.className = 'change-file';
  const btn = document.createElement('button');
  const status = document.createElement('span');
  status.className = 'change-status';
  status.textContent = file.status || 'M';
  const path = document.createElement('span');
  path.className = 'change-path';
  path.title = file.path || '';
  path.textContent = file.path || '';
  const add = document.createElement('span');
  add.className = 'change-stat';
  add.textContent = `+${file.additions || 0}`;
  const del = document.createElement('span');
  del.className = 'change-stat';
  del.textContent = `-${file.deletions || 0}`;
  btn.append(status, path, add, del);
  const pre = document.createElement('pre');
  pre.className = 'diff-pre';
  pre.hidden = true;
  const chunk = chunkForPath(chunks, file.path || '');
  pre.innerHTML = chunk ? renderDiffLines(chunk.lines) : '<span class="diff-line meta">(no text diff available)</span>';
  btn.onclick = () => { pre.hidden = !pre.hidden; };
  wrap.append(btn, pre);
  return wrap;
}

function renderDiffLines(lines) {
  let oldLine = 0;
  let newLine = 0;
  const out = [];
  for (const line of (lines || [])) {
    if (line.startsWith('@@')) {
      const m = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) {
        oldLine = Number(m[1]);
        newLine = Number(m[2]);
      }
      continue;
    }
    if (line.startsWith('diff --git') || line.startsWith('index ') || line.startsWith('---') || line.startsWith('+++')) {
      continue;
    }
    if (line.startsWith('+')) {
      out.push(`<span class="diff-line add"><span class="ln">${newLine || ''}</span><span class="mark">+</span>${escapeHtml(line.slice(1) || ' ')}</span>`);
      newLine += 1;
      continue;
    }
    if (line.startsWith('-')) {
      out.push(`<span class="diff-line del"><span class="ln">${oldLine || ''}</span><span class="mark">-</span>${escapeHtml(line.slice(1) || ' ')}</span>`);
      oldLine += 1;
      continue;
    }
    if (line) {
      oldLine += 1;
      newLine += 1;
    }
  }
  return out.join('');
}

function showCommandApprovalError(errorEl) {
  if (errorEl) {
    errorEl.textContent = 'Could not send approval';
    errorEl.hidden = false;
  }
  setStatus('Could not send approval', 'err');
}

async function approveCommand(id, approved, approveBtn, denyBtn, errorEl) {
  if (!id) return;
  approveBtn.disabled = true;
  denyBtn.disabled = true;
  if (errorEl) {
    errorEl.textContent = '';
    errorEl.hidden = true;
  }
  try {
    const r = await fetch('/api/shell_approval', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, approved }),
    });
    if (!r.ok) {
      showCommandApprovalError(errorEl);
      approveBtn.disabled = false;
      denyBtn.disabled = false;
    }
  } catch (err) {
    showCommandApprovalError(errorEl);
    approveBtn.disabled = false;
    denyBtn.disabled = false;
  }
}

// ============================ composer ============================
function resizeTask() {
  const t = $('task');
  t.style.height = 'auto';
  t.style.height = Math.min(220, Math.max(40, t.scrollHeight)) + 'px';
}
function updateSend() {
  const has = $('task').value.trim();
  $('send').disabled = !has || runningSessionId;
}
$('task').addEventListener('input', () => { resizeTask(); updateSend(); });
$('task').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    if (!$('send').disabled) $('send').click();
  }
});
function setActiveProvider(id) {
  const provider = PROVIDERS.includes(id) ? id : DEFAULT_PROVIDER;
  const s = activeSession();
  if (!s) return;
  s.provider = provider;
  persistActive();
  syncProviderUI(provider);
  updateComposerContext();
}
$('provider-button').onclick = (e) => {
  if ($('provider-button').disabled) return;
  e.stopPropagation();
  const menu = $('provider-menu');
  menu.classList.toggle('open');
  $('provider-button').classList.toggle('open', menu.classList.contains('open'));
};
document.addEventListener('click', (e) => {
  if (!$('provider-menu').contains(e.target) && !$('provider-button').contains(e.target)) {
    $('provider-menu').classList.remove('open');
    $('provider-button').classList.remove('open');
  }
});
document.querySelectorAll('.provider-item').forEach((btn) => {
  btn.onclick = () => {
    setActiveProvider(btn.dataset.provider);
    $('provider-menu').classList.remove('open');
    $('provider-button').classList.remove('open');
  };
});

$('send').onclick = async () => {
  const project = currentProjectPath();
  const task = $('task').value.trim();
  if (!task) return;
  pushMsg({ type: 'user', text: task });
  $('task').value = ''; resizeTask(); updateSend();
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: activeId, project, task, provider: currentProviderId() }),
  });
  if (r.status === 409) { addSendError(activeId); return; }
  if (!r.ok) {
    addSendError(activeId);
    return;
  }
};
async function continueTask(sessionId) {
  if (runningSessionId) return;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const p = s.projectId ? projectById(s.projectId) : null;
  if (!p) {
    addToSession(sessionId, { type: 'err', text: 'Only project tasks can be continued; plain chats have no tool loop.', sessionId });
    return;
  }
  addToSession(sessionId, { type: 'info', text: 'continue task' });
  const task = [
    'Continue the unfinished task in this same conversation.',
    'Use the existing project context and finish the original user request.',
    'If the work is complete, reply with a JSON done tool call.'
  ].join(' ');
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: sessionId,
      project: p.path,
      task,
      continue_task: true,
      provider: s.provider || DEFAULT_PROVIDER,
    }),
  });
  if (r.status === 409 || !r.ok) addSendError(sessionId);
}
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
$('changes-close').onclick = closeChangesDrawer;
$('changes-refresh').onclick = () => {
  if (activeChangesProject) loadChangesDrawer(activeChangesProject);
};
$('changes-restore').onclick = async () => {
  if (!activeChangesProject || !lastChangesData || lastChangesData.mode === 'git') return;
  $('changes-restore').disabled = true;
  $('changes-restore').textContent = 'Restoring';
  try {
    const data = await restoreChanges(activeChangesProject);
    if (!data.ok) {
      const detail = data.conflicts && data.conflicts.length
        ? `Conflict: ${data.conflicts.join(', ')}`
        : (data.error || 'Restore failed');
      $('changes-subtitle').textContent = detail;
      $('changes-restore').disabled = false;
      return;
    }
    $('changes-restore').textContent = 'Restored';
    await loadChangesDrawer(activeChangesProject);
    setTimeout(() => { $('changes-restore').textContent = 'Restore'; }, 1200);
  } catch (err) {
    $('changes-subtitle').textContent = String(err);
  } finally {
    if ($('changes-restore').textContent !== 'Restored') $('changes-restore').textContent = 'Restore';
  }
};
$('changes-copy').onclick = async () => {
  const diff = lastChangesData && lastChangesData.diff ? lastChangesData.diff : '';
  if (!diff) return;
  try {
    await navigator.clipboard.writeText(diff);
    $('changes-copy').textContent = 'Copied';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  } catch {
    $('changes-copy').textContent = 'Failed';
    setTimeout(() => { $('changes-copy').textContent = 'Copy diff'; }, 1200);
  }
};
$('btn-new-chat').onclick = () => {
  const p = activeProject();
  newSession(p ? p.id : null);
};
$('btn-add-project').onclick = pickProject;
$('toggle-sidebar').onclick = () => {
  document.body.classList.add('sidebar-collapsed');
  $('show-sidebar').style.display = '';
};
$('show-sidebar').onclick = () => {
  document.body.classList.remove('sidebar-collapsed');
  $('show-sidebar').style.display = 'none';
};
$('topbar-more').onclick = (e) => {
  e.stopPropagation();
  openTopMenu(e.currentTarget);
};

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const p = activeProject();
    newSession(p ? p.id : null);
  }
});

// ============================ boot ============================
renderSidebar();
renderChat();
resizeTask();
updateSend();
syncProviderUI(currentProviderId());
$('provider-button').disabled = false;
